name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-tracker-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnd-tracker-source/package-lock.json

      - run: npm ci
      - run: npm test

      # dist/dnd-campaign-tracker.html is committed on purpose (see dnd-tracker-source/README.md),
      # so nothing enforces it actually matches the source it's supposed to be generated from. This
      # fails the build if someone edits js/css/data/shell.html and forgets to re-run the build, or
      # hand-edits dist/ directly despite the README's "never do this" rule.
      - name: Verify dist/ matches source
        run: |
          npm run build
          git diff --exit-code -- dist/
