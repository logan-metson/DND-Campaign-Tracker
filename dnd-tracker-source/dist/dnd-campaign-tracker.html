<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Campaign Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1e27;
    --panel:#232939;
    --panel-2:#2b3245;
    --line:#3a4256;
    --brass:#c69749;
    --brass-dim:#8f6f3d;
    --parchment:#e9dfc4;
    --ember:#b5533a;
    --ember-dim:#7a3a2a;
    --moss:#7a9471;
    --moss-dim:#556b4f;
    --text:#e7e4da;
    --text-dim:#9aa0ae;
    --font-display:'Special Elite', cursive;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--font-body);}
  #app{background:var(--ink);border-radius:10px;overflow:hidden;min-height:100%;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}

  .topbar{
    background:var(--panel);
    border-bottom:2px solid var(--line);
    padding:14px 18px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand h1{font-family:var(--font-display);font-size:20px;margin:0;color:var(--brass);letter-spacing:0.5px;}
  .brand .meta-field input{background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--text-dim);font-size:12px;padding:2px 4px;width:90px;font-family:var(--font-mono);}
  .brand .meta-field input:focus{outline:none;border-bottom-color:var(--brass);color:var(--text);}
  .saved-indicator{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);}

  .stamp-btn{
    background:var(--brass);color:#1a1e27;border:none;border-radius:50px;
    padding:10px 20px;font-weight:700;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;
    box-shadow:0 2px 0 var(--brass-dim);
    transition:transform .08s ease;
  }
  .stamp-btn:active{transform:translateY(2px) scale(0.98);box-shadow:0 0 0 var(--brass-dim);}
  .stamp-btn.stamping{animation:stampdown .35s ease;}
  @keyframes stampdown{
    0%{transform:scale(1) rotate(0);}
    40%{transform:scale(1.18) rotate(-6deg);}
    70%{transform:scale(0.96) rotate(2deg);}
    100%{transform:scale(1) rotate(0);}
  }

  .tabs{display:flex;background:var(--panel-2);border-bottom:2px solid var(--line);padding:0 12px;gap:2px;overflow-x:auto;}

  .combat-bar{
    background:linear-gradient(180deg,var(--ember) 0%, var(--ember-dim) 100%);
    color:#1a1e27;
    padding:8px 18px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    font-family:var(--font-display);
    border-bottom:2px solid var(--line);
  }
  .combat-bar .combat-bar-round{font-weight:700;letter-spacing:0.5px;}
  .combat-bar .combat-bar-name{font-size:15px;flex:1;min-width:120px;}
  .combat-bar button{font-size:12px;padding:5px 10px;}

  .last-roll-bar{
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    padding:6px 18px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    font-size:12px;
    color:var(--text-dim);
  }
  .last-roll-bar .last-roll-label{color:var(--text);}
  .last-roll-bar strong{color:var(--brass);font-family:var(--font-mono);}
  .tab{
    padding:10px 16px;font-family:var(--font-display);font-size:13px;color:var(--text-dim);
    background:transparent;border:none;border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tab.active{color:var(--brass);border-bottom-color:var(--brass);}
  .tab:hover{color:var(--text);}

  .content{padding:18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;
  }
  .card h3{font-family:var(--font-display);color:var(--brass);font-size:15px;margin:0 0 10px 0;letter-spacing:0.3px;}
  label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-dim);margin-bottom:3px;}
  .field{margin-bottom:8px;}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    color:var(--text);padding:7px 8px;font-size:13px;
  }
  input[type=number]{font-family:var(--font-mono);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brass);}
  textarea{resize:vertical;min-height:50px;}

  .char-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .char-chip{
    padding:8px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
    font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px;
  }
  .char-chip.active{border-color:var(--brass);color:var(--brass);background:var(--panel-2);}
  .char-chip .hp-tag{font-family:var(--font-mono);font-size:11px;}
  .char-chip.status-dead{opacity:0.55;}
  .char-chip.status-ghost{opacity:0.75;font-style:italic;}
  .add-char-btn{padding:8px 14px;border-radius:6px;background:transparent;border:1px dashed var(--brass-dim);color:var(--brass);font-size:13px;}

  .grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  @media (max-width:700px){.grid-6{grid-template-columns:repeat(3,1fr);}}
  .ability-box{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;}
  .ability-box label{text-align:center;}
  .ability-mod{font-family:var(--font-mono);color:var(--brass);font-size:12px;margin-top:2px;}

  .hp-row{display:flex;align-items:center;gap:6px;}
  .hp-row input{width:56px;text-align:center;flex:none;}
  .step-btn{
    width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:14px;line-height:1;flex:none;
  }
  .step-btn.dmg{color:var(--ember);}
  .step-btn.heal{color:var(--moss);}
  .hp-bar-track{height:6px;border-radius:3px;background:var(--panel-2);margin-top:6px;overflow:hidden;}
  .hp-bar-fill{height:100%;background:var(--moss);transition:width .2s ease, background .2s ease;}

  .item-row,.spell-row,.quest-row{
    display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;margin-bottom:6px;flex-wrap:wrap;
  }
  .item-row input[type=text]{flex:2;min-width:100px;}
  .item-row input[type=number]{width:50px;flex:none;}
  .item-row .tags-input{flex:2;min-width:90px;}
  .remove-btn{
    background:transparent;border:none;color:var(--ember);font-size:16px;padding:0 4px;flex:none;margin-left:auto;
  }
  .small-add{
    background:transparent;border:1px dashed var(--line);color:var(--text-dim);border-radius:6px;
    padding:6px 10px;font-size:12px;width:100%;margin-top:4px;
  }
  .small-add:hover{border-color:var(--brass);color:var(--brass);}

  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
  .slot-box{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
  .slot-box label{margin-bottom:4px;}
  .slot-inputs{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12px;}
  .slot-inputs input{width:34px;text-align:center;padding:4px;}

  .search-box{position:relative;margin-top:8px;}
  .search-input{width:100%;background:var(--panel-2);border:1px dashed var(--line);border-radius:6px;color:var(--text);padding:8px;font-size:13px;}
  .search-input:disabled{opacity:0.5;}
  .search-results{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel-2);border:1px solid var(--brass-dim);border-radius:0 0 6px 6px;max-height:220px;overflow-y:auto;}
  .search-results.open{display:block;}
  .search-result{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--brass-dim);color:#1a1e27;}

  .status-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;}
  .status-alive{background:var(--moss-dim);color:#d6e8d1;}
  .status-unconscious{background:#5a5230;color:#f0e6b8;}
  .status-dead{background:var(--ember-dim);color:#f0d3ca;}
  .status-ghost{background:#3a3f56;color:#c9cdf0;}

  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 14px;font-size:12px;}
  .btn:hover{border-color:var(--brass);color:var(--brass);}
  .btn.primary{background:var(--brass);color:#1a1e27;border:none;font-weight:600;}
  .btn.danger{color:var(--ember);}
  .btn.danger:hover{border-color:var(--ember);}
  .btn.active{border-color:var(--brass);color:var(--brass);}

  .enemy-chip.active{border-color:var(--ember);color:var(--ember);}
  .enemy-chip.status-dead{opacity:0.5;text-decoration:line-through;}
  .enemy-chip.status-fled{opacity:0.65;font-style:italic;}
  .init-tag{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}

  .dice-pad{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .die-btn{
    width:64px;height:64px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--brass);font-family:var(--font-mono);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .die-btn:hover{border-color:var(--brass);}
  .roll-result{
    background:var(--panel);border:1px solid var(--brass-dim);border-radius:8px;padding:16px;text-align:center;margin-bottom:14px;
  }
  .roll-result .total{font-family:var(--font-mono);font-size:36px;color:var(--brass);}
  .roll-result .breakdown{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:4px;}
  .roll-log{max-height:220px;overflow-y:auto;}
  .roll-log-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);padding:5px 0;border-bottom:1px solid var(--line);}
  .adv-toggle{display:flex;gap:6px;margin-bottom:10px;}
  .adv-toggle button{flex:1;}
  .adv-toggle button.active{background:var(--brass);color:#1a1e27;border:none;}

  .snap-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
  .snap-row .snap-meta{font-family:var(--font-mono);color:var(--text-dim);}
  .snap-row .snap-actions{display:flex;gap:6px;}

  textarea.code{font-family:var(--font-mono);font-size:11px;min-height:160px;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brass);color:#1a1e27;
    padding:9px 18px;border-radius:6px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;z-index:999;
  }
  .toast.show{opacity:1;bottom:26px;}

  .empty-note{color:var(--text-dim);font-size:13px;font-style:italic;padding:10px 0;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;}

  .rules-section{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--panel-2);overflow:hidden;}
  .rules-section > summary{padding:10px 14px;cursor:pointer;font-family:var(--font-display);color:var(--brass);font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rules-section > summary::-webkit-details-marker{display:none;}
  .rules-section > summary::after{content:'+ expand';font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
  .rules-section[open] > summary::after{content:'− collapse';}
  .rules-section .rules-body{padding:0 14px 14px 14px;}
  .rules-sub{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--panel);}
  .rules-sub > summary{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text);list-style:none;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .rules-sub > summary::-webkit-details-marker{display:none;}
  .rules-sub > summary::after{content:'+';font-family:var(--font-mono);color:var(--text-dim);flex:none;}
  .rules-sub[open] > summary::after{content:'−';}
  .rules-sub .rules-sub-body{padding:2px 12px 10px 12px;}
  .ref-table{display:flex;flex-direction:column;gap:0;}
  .ref-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;}
  .ref-row:last-child{border-bottom:none;}
  .ref-row .ref-key{flex:0 0 68px;color:var(--brass);font-family:var(--font-mono);font-weight:600;}
  .ref-row .ref-val{flex:1;min-width:200px;color:var(--text);line-height:1.5;}
  .spell-ref-level{margin-bottom:6px;}
  .spell-ref-level-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--text-dim);margin:8px 0 4px;letter-spacing:0.5px;}
  .spell-ref-item{font-size:12px;border-bottom:1px dashed var(--line);}
  .spell-ref-item:last-child{border-bottom:none;}
  .spell-ref-item > summary{padding:4px 0;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;column-gap:6px;align-items:baseline;}
  .spell-ref-item > summary::-webkit-details-marker{display:none;}
  .spell-ref-item > summary::before{content:'▸';color:var(--text-dim);font-size:9px;margin-right:2px;}
  .spell-ref-item[open] > summary::before{content:'▾';}
  .spell-ref-item-body{padding:0 0 8px 14px;color:var(--text-dim);line-height:1.55;border-left:2px solid var(--line);margin:0 0 4px 3px;}
  .spell-ref-item-body em{color:var(--brass-dim);font-style:normal;font-weight:600;}
  .spell-ref-name{color:var(--text);font-weight:600;}
  .spell-ref-meta{color:var(--text-dim);margin-left:6px;}
  .equip-ref-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:center;flex-wrap:wrap;}
  .equip-ref-row:last-child{border-bottom:none;}
  .equip-ref-name{flex:2;min-width:140px;color:var(--text);font-weight:600;}
  .equip-ref-detail{flex:2;min-width:160px;color:var(--text-dim);}
  .equip-ref-cost{flex:0 0 90px;font-family:var(--font-mono);color:var(--brass);text-align:right;}

  .btn.danger.armed{background:var(--ember);color:#1a1e27;border-color:var(--ember);font-weight:700;animation:armedpulse 1s ease-in-out infinite;}
  @keyframes armedpulse{0%,100%{box-shadow:0 0 0 0 rgba(181,83,58,0.55);} 50%{box-shadow:0 0 0 5px rgba(181,83,58,0);}}

  /* ---------- mobile pass ---------- */
  @media (max-width:700px){
    .content{padding:12px;}
    .topbar{padding:10px 12px;gap:8px;}
    .brand h1{font-size:17px;}
    .brand .meta-field input{width:72px;}
    .row{gap:10px;}
    /* 16px prevents iOS Safari's auto-zoom-on-focus, which is most of what makes typing on a
       phone feel janky — everything below 16px triggers it, so 13px was zooming in on every tap */
    input[type=text],input[type=number],textarea,select{font-size:16px;}
    .step-btn{width:36px;height:36px;font-size:16px;}
    .remove-btn{font-size:20px;padding:6px 10px;}
    .die-btn{width:56px;height:56px;}
    .btn,.stamp-btn{padding:10px 14px;}
    .tab{padding:10px 12px;}
    .snap-row{flex-direction:column;align-items:stretch;gap:8px;}
    .snap-row .snap-actions{justify-content:flex-end;}
    .char-chip,.enemy-chip{padding:9px 12px;}
  }
  @media (max-width:460px){
    .grid-6{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

st succeed on a wisdom saving throw or be charmed by you for the spell's duration. If you or one of your companions harms the target, the spells ends.","saveAbility":"wis","saveEffect":"none"},{"index":"animal-messenger","name":"Animal Messenger","level":2,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"24 hours","concentration":false,"ritual":true,"components":"VSM","desc":"By means of this spell, you use an animal to deliver a message. Choose a Tiny beast you can see within range, such as a squirrel, a blue jay, or a bat. You specify a location, which you must have visited, and a recipient who matches a general description, such as \"a man or woman dressed in the uniform of the town guard\" or \"a red-haired dwarf wearing a pointed hat.\" You also speak a message of up to twenty-five words. The target beast travels for the duration of the spell toward the specified lo","higherLevel":"If you cast this spell using a spell slot of 3nd level or higher, the duration of the spell increases by 48 hours for each slot level above 2nd."},{"index":"animal-shapes","name":"Animal Shapes","level":8,"school":"Transmutation","castingTime":"1 action","range":"30 feet","duration":"Up to 24 hours","concentration":true,"ritual":false,"components":"VS","desc":"Your magic turns others into beasts. Choose any number of willing creatures that you can see within range. You transform each target into the form of a Large or smaller beast with a challenge rating of 4 or lower. On subsequent turns, you can use your action to transform affected creatures into new forms. The transformation lasts for the duration for each target, or until the target drops to 0 hit points or dies. You can choose a different form for each target. A target's game statistics are rep"},{"index":"animate-dead","name":"Animate Dead","level":3,"school":"Necromancy","castingTime":"1 minute","range":"10 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"This spell creates an undead servant. Choose a pile of bones or a corpse of a Medium or Small humanoid within range. Your spell imbues the target with a foul mimicry of life, raising it as an undead creature. The target becomes a skeleton if you chose bones or a zombie if you chose a corpse (the GM has the creature's game statistics). On each of your turns, you can use a bonus action to mentally command any creature you made with this spell if the creature is within 60 feet of you (if you contro","higherLevel":"When you cast this spell using a spell slot of 4th level or higher, you animate or reassert control over two additional undead creatures for each slot level above 3rd. Each of the creatures must come from a different corpse or pile of bones."},{"index":"animate-objects","name":"Animate Objects","level":5,"school":"Transmutation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"Objects come to life at your command. Choose up to ten nonmagical objects within range that are not being worn or carried. Medium targets count as two objects, Large targets count as four objects, Huge targets count as eight objects. You can't animate any object larger than Huge. Each target animates and becomes a creature under your control until the spell ends or until reduced to 0 hit points. As a bonus action, you can mentally command any creature you made with this spell if the creature is ","higherLevel":"If you cast this spell using a spell slot of 6th level or higher, you can animate two additional objects for each slot level above 5th."},{"index":"antilife-shell","name":"Antilife Shell","level":5,"school":"Abjuration","castingTime":"1 action","range":"Self","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VS","desc":"A shimmering barrier extends out from you in a 10-foot radius and moves with you, remaining centered on you and hedging out creatures other than undead and constructs. The barrier lasts for the duration. The barrier prevents an affected creature from passing or reaching through. An affected creature can cast spells or make attacks with ranged or reach weapons through the barrier. If you move so that an affected creature is forced to pass through the barrier, the spell ends.","areaType":"sphere","areaSize":10},{"index":"antimagic-field","name":"Antimagic Field","level":8,"school":"Abjuration","castingTime":"1 action","range":"Self","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"A 10-foot-radius invisible sphere of antimagic surrounds you. This area is divorced from the magical energy that suffuses the multiverse. Within the sphere, spells can't be cast, summoned creatures disappear, and even magic items become mundane. Until the spell ends, the sphere moves with you, centered on you. Spells and other magical effects, except those created by an artifact or a deity, are suppressed in the sphere and can't protrude into it. A slot expended to cast a suppressed spell is con","areaType":"sphere","areaSize":10},{"index":"antipathy-sympathy","name":"Antipathy/Sympathy","level":8,"school":"Enchantment","castingTime":"1 hour","range":"60 feet","duration":"10 days","concentration":false,"ritual":false,"components":"VSM","desc":"This spell attracts or repels creatures of your choice. You target something within range, either a Huge or smaller object or creature or an area that is no larger than a 200-foot cube. Then specify a kind of intelligent creature, such as red dragons, goblins, or vampires. You invest the target with an aura that either attracts or repels the specified creatures for the duration. Choose antipathy or sympathy as the aura's effect. ***Antipathy.*** The enchantment causes creatures of the kind you d","areaType":"cube","areaSize":200},{"index":"arcane-eye","name":"Arcane Eye","level":4,"school":"Divination","castingTime":"1 action","range":"30 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"You create an invisible, magical eye within range that hovers in the air for the duration. You mentally receive visual information from the eye, which has normal vision and darkvision out to 30 feet. The eye can look in every direction. As an action, you can move the eye up to 30 feet in any direction. There is no limit to how far away from you the eye can move, but it can't enter another plane of existence. A solid barrier blocks the eye's movement, but the eye can pass through an opening as sm","areaType":"sphere","areaSize":30},{"index":"arcane-hand","name":"Arcane Hand","level":5,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You create a Large hand of shimmering, translucent force in an unoccupied space that you can see within range. The hand lasts for the spell's duration, and it moves at your command, mimicking the movements of your own hand. The hand is an object that has AC 20 and hit points equal to your hit point maximum. If it drops to 0 hit points, the spell ends. It has a Strength of 26 (+8) and a Dexterity of 10 (+0). The hand doesn't fill its space. When you cast the spell and as a bonus action on your su","higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the damage from the clenched fist option increases by 2d8 and the damage from the grasping hand increases by 2d6 for each slot level above 5th."},{"index":"arcane-lock","name":"Arcane Lock","level":2,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a closed door, window, gate, chest, or other entryway, and it becomes locked for the duration. You and the creatures you designate when you cast this spell can open the object normally. You can also set a password that, when spoken within 5 feet of the object, suppresses this spell for 1 minute. Otherwise, it is impassable until it is broken or the spell is dispelled or suppressed. Casting knock on the object suppresses arcane lock for 10 minutes. While affected by this spell, the obje"},{"index":"arcane-sword","name":"Arcane Sword","level":7,"school":"Evocation","castingTime":"1 action","range":"60 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You create a sword-shaped plane of force that hovers within range. It lasts for the duration. When the sword appears, you make a melee spell attack against a target of your choice within 5 feet of the sword. On a hit, the target takes 3d10 force damage. Until the spell ends, you can use a bonus action on each of your turns to move the sword up to 20 feet to a spot you can see and repeat this attack against the same target or a different one.","damageType":"Force","damageAtSlot":{"7":"3d10"}},{"index":"arcanists-magic-aura","name":"Arcanist's Magic Aura","level":2,"school":"Illusion","castingTime":"1 action","range":"Touch","duration":"24 hours","concentration":false,"ritual":false,"components":"VSM","desc":"You place an illusion on a creature or an object you touch so that divination spells reveal false information about it. The target can be a willing creature or an object that isn't being carried or worn by another creature. When you cast the spell, choose one or both of the following effects. The effect lasts for the duration. If you cast this spell on the same creature or object every day for 30 days, placing the same effect on it each time, the illusion lasts until it is dispelled. ***False Au"},{"index":"astral-projection","name":"Astral Projection","level":9,"school":"Necromancy","castingTime":"1 hour","range":"10 feet","duration":"Special","concentration":false,"ritual":false,"components":"VSM","desc":"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell fails and the casting is wasted if you are already on that plane). The material body you leave behind is unconscious and in a state of suspended animation; it doesn't need food or air and doesn't age. Your astral body resembles your mortal form in almost every way, replicating your game statistics and possessions. The principal difference is the addition of a silvery cord that extends f"},{"index":"augury","name":"Augury","level":2,"school":"Divination","castingTime":"1 minute","range":"Self","duration":"Instantaneous","concentration":false,"ritual":true,"components":"VSM","desc":"By casting gem-inlaid sticks, rolling dragon bones, laying out ornate cards, or employing some other divining tool, you receive an omen from an otherworldly entity about the results of a specific course of action that you plan to take within the next 30 minutes. The GM chooses from the following possible omens: - Weal, for good results - Woe, for bad results - Weal and woe, for both good and bad results - Nothing, for results that aren't especially good or bad The spell doesn't take into account"},{"index":"awaken","name":"Awaken","level":5,"school":"Transmutation","castingTime":"8 hours","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"After spending the casting time tracing magical pathways within a precious gemstone, you touch a Huge or smaller beast or plant. The target must have either no Intelligence score or an Intelligence of 3 or less. The target gains an Intelligence of 10. The target also gains the ability to speak one language you know. If the target is a plant, it gains the ability to move its limbs, roots, vines, creepers, and so forth, and it gains senses similar to a human's. Your GM chooses statistics appropria"},{"index":"bane","name":"Bane","level":1,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Up to three creatures of your choice that you can see within range must make charisma saving throws. Whenever a target that fails this saving throw makes an attack roll or a saving throw before the spell ends, the target must roll a d4 and subtract the number rolled from the attack roll or saving throw.","saveAbility":"cha","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each slot level above 1st."},{"index":"banishment","name":"Banishment","level":4,"school":"Abjuration","castingTime":"1 action","range":"60 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You attempt to send one creature that you can see within range to another plane of existence. The target must succeed on a charisma saving throw or be banished. If the target is native to the plane of existence you're on, you banish the target to a harmless demiplane. While there, the target is incapacitated. The target remains there until the spell ends, at which point the target reappears in the space it left or in the nearest unoccupied space if that space is occupied. If the target is native","saveAbility":"cha","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 5th level or higher, you can target one additional creature for each slot level above 4th."},{"index":"barkskin","name":"Barkskin","level":2,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"You touch a willing creature. Until the spell ends, the target's skin has a rough, bark-like appearance, and the target's AC can't be less than 16, regardless of what kind of armor it is wearing."},{"index":"beacon-of-hope","name":"Beacon of Hope","level":3,"school":"Abjuration","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"This spell bestows hope and vitality. Choose any number of creatures within range. For the duration, each target has advantage on wisdom saving throws and death saving throws, and regains the maximum number of hit points possible from any healing."},{"index":"bestow-curse","name":"Bestow Curse","level":3,"school":"Necromancy","castingTime":"1 action","range":"Touch","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You touch a creature, and that creature must succeed on a wisdom saving throw or become cursed for the duration of the spell. When you cast this spell, choose the nature of the curse from the following options: - Choose one ability score. While cursed, the target has disadvantage on ability checks and saving throws made with that ability score. - While cursed, the target has disadvantage on attack rolls against you. - While cursed, the target must make a wisdom saving throw at the start of each ","saveAbility":"wis","saveEffect":"none","higherLevel":"If you cast this spell using a spell slot of 4th level or higher, the duration is concentration, up to 10 minutes. If you use a spell slot of 5th level or higher, the duration is 8 hours. If you use a spell slot of 7th level or higher, the duration is 24 hours. If you use a 9th level spell slot, the spell lasts until it is dispelled. Using a spell slot of 5th level or higher grants a duration that doesn't require concentration."},{"index":"black-tentacles","name":"Black Tentacles","level":4,"school":"Conjuration","castingTime":"1 action","range":"90 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in the area into difficult terrain. When a creature enters the affected area for the first time on a turn or starts its turn there, the creature must succeed on a Dexterity saving throw or take 3d6 bludgeoning damage and be restrained by the tentacles until the spell ends. A creature that starts its turn in the area and is already restrained by the tentacles","damageType":"Bludgeoning","damageAtSlot":{"4":"3d6"},"saveAbility":"dex","saveEffect":"none","areaType":"cube","areaSize":20},{"index":"blade-barrier","name":"Blade Barrier","level":6,"school":"Evocation","castingTime":"1 action","range":"90 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VS","desc":"You create a vertical wall of whirling, razor-sharp blades made of magical energy. The wall appears within range and lasts for the duration. You can make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick. The wall provides three-quarters cover to creatures behind it, and its space is difficult terrain. When a creature enters the wall's area for the first time on a turn or starts its turn there, the crea","damageType":"Slashing","damageAtSlot":{"6":"6d10"},"saveAbility":"dex","saveEffect":"half","areaType":"line","areaSize":100},{"index":"bless","name":"Bless","level":1,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw.","higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each slot level above 1st."},{"index":"blight","name":"Blight","level":4,"school":"Necromancy","castingTime":"1 action","range":"30 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"Necromantic energy washes over a creature of your choice that you can see within range, draining moisture and vitality from it. The target must make a constitution saving throw. The target takes 8d8 necrotic damage on a failed save, or half as much damage on a successful one. The spell has no effect on undead or constructs. If you target a plant creature or a magical plant, it makes the saving throw with disadvantage, and the spell deals maximum damage to it. If you target a nonmagical plant tha","damageType":"Necrotic","damageAtSlot":{"4":"8d8","5":"9d8","6":"10d8","7":"11d8","8":"12d8","9":"13d8"},"saveAbility":"con","saveEffect":"half","higherLevel":"When you cast this spell using a spell slot of 5th level of higher, the damage increases by 1d8 for each slot level above 4th."},{"index":"blindness-deafness","name":"Blindness/Deafness","level":2,"school":"Necromancy","castingTime":"1 action","range":"30 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"V","desc":"You can blind or deafen a foe. Choose one creature that you can see within range to make a constitution saving throw. If it fails, the target is either blinded or deafened (your choice) for the duration. At the end of each of its turns, the target can make a constitution saving throw. On a success, the spell ends.","saveAbility":"con","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd."},{"index":"blink","name":"Blink","level":3,"school":"Transmutation","castingTime":"1 action","range":"Self","duration":"1 minute","concentration":false,"ritual":false,"components":"VS","desc":"Roll a d20 at the end of each of your turns for the duration of the spell. On a roll of 11 or higher, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell fails and the casting is wasted if you were already on that plane). At the start of your next turn, and when the spell ends if you are on the Ethereal Plane, you return to an unoccupied space of your choice that you can see within 10 feet of the space you vanished from. If no unoccupied space is available"},{"index":"blur","name":"Blur","level":2,"school":"Illusion","castingTime":"1 action","range":"Self","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"V","desc":"Your body becomes blurred, shifting and wavering to all who can see you. For the duration, any creature has disadvantage on attack rolls against you. An attacker is immune to this effect if it doesn't rely on sight, as with blindsight, or can see through illusions, as with truesight."},{"index":"branding-smite","name":"Branding Smite","level":2,"school":"Evocation","castingTime":"1 bonus action","range":"Self","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"V","desc":"The next time you hit a creature with a weapon attack before this spell ends, the weapon gleams with astral radiance as you strike. The attack deals an extra 2d6 radiant damage to the target, which becomes visible if it's invisible, and the target sheds dim light in a 5-foot radius and can't become invisible until the spell ends.","damageType":"Radiant","damageAtSlot":{"2":"2d6","3":"3d6","4":"4d6","5":"5d6","6":"6d6","7":"7d6","8":"8d6","9":"9d6"},"higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, the extra damage increases by 1d6 for each slot level above 2nd."},{"index":"burning-hands","name":"Burning Hands","level":1,"school":"Evocation","castingTime":"1 action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much damage on a successful one. The fire ignites any flammable objects in the area that aren't being worn or carried.","damageType":"Fire","damageAtSlot":{"1":"3d6","2":"4d6","3":"5d6","4":"6d6","5":"7d6","6":"8d6","7":"9d6","8":"10d6","9":"11d6"},"saveAbility":"dex","saveEffect":"half","areaType":"cone","areaSize":15,"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st."},{"index":"call-lightning","name":"Call Lightning","level":3,"school":"Conjuration","castingTime":"1 action","range":"120 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VS","desc":"A storm cloud appears in the shape of a cylinder that is 10 feet tall with a 60-foot radius, centered on a point you can see 100 feet directly above you. The spell fails if you can't see a point in the air where the storm cloud could appear (for example, if you are in a room that can't accommodate the cloud). When you cast the spell, choose a point you can see within range. A bolt of lightning flashes down from the cloud to that point. Each creature within 5 feet of that point must make a dexter","damageType":"Lightning","damageAtSlot":{"3":"3d10","4":"4d10","5":"5d10","6":"6d10","7":"7d10","8":"8d10","9":"9d10"},"areaType":"sphere","areaSize":5,"higherLevel":"When you cast this spell using a spell slot of 4th or higher level, the damage increases by 1d10 for each slot level above 3rd."},{"index":"calm-emotions","name":"Calm Emotions","level":2,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You attempt to suppress strong emotions in a group of people. Each humanoid in a 20-foot-radius sphere centered on a point you choose within range must make a charisma saving throw; a creature can choose to fail this saving throw if it wishes. If a creature fails its saving throw, choose one of the following two effects. You can suppress any effect causing  creatures must be within 30 feet of each other when you target them."},{"index":"chill-touch","name":"Chill Touch","level":0,"school":"Necromancy","castingTime":"1 action","range":"120 feet","duration":"1 round","concentration":false,"ritual":false,"components":"VS","desc":"You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can't regain hit points until the start of your next turn. Until then, the hand clings to the target. If you hit an undead target, it also has disadvantage on attack rolls against you until the end of your next turn. This spell's damage increases by 1d8 when you reach 5th level","damageType":"Necrotic","damageAtLevel":{"1":"1d8","5":"2d8","11":"3d8","17":"4d8"}},{"index":"circle-of-death","name":"Circle of Death","level":6,"school":"Necromancy","castingTime":"1 action","range":"150 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A sphere of negative energy ripples out in a 60-foot radius sphere from a point within range. Each creature in that area must make a constitution saving throw. A target takes 8d6 necrotic damage on a failed save, or half as much damage on a successful one.","damageType":"Necrotic","damageAtSlot":{"6":"8d6","7":"10d6","8":"12d6","9":"14d6"},"saveAbility":"con","saveEffect":"half","areaType":"sphere","areaSize":60,"higherLevel":"When you cast this spell using a spell slot of 7th level or higher, the damage increases by 2d6 for each slot level above 6th."},{"index":"clairvoyance","name":"Clairvoyance","level":3,"school":"Divination","castingTime":"10 minutes","range":"1 mile","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"You create an invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The sensor remains in place for the duration, and it can't be attacked or otherwise interacted with. When you cast the spell, you choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As your action, you can switch be"},{"index":"clone","name":"Clone","level":8,"school":"Necromancy","castingTime":"1 hour","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"This spell grows an inert duplicate of a living creature as a safeguard against death. This clone forms inside a sealed vessel and grows to full size and maturity after 120 days; you can also choose to have the clone be a younger version of the same creature. It remains inert and endures indefinitely, as long as its vessel remains undisturbed. At any time after the clone matures, if the original creature dies, its soul transfers to the clone, provided that the soul is free and willing to return."},{"index":"cloudkill","name":"Cloudkill","level":5,"school":"Conjuration","castingTime":"1 action","range":"120 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VS","desc":"You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog, ending the spell. Its area is heavily obscured. When a creature enters the spell's area for the first time on a turn or starts its turn there, that creature must make a constitution saving throw. The creature takes 5d8 poison damage on a failed save, or half as much damage on a successful o","damageType":"Poison","damageAtSlot":{"5":"5d8","6":"6d8","7":"7d8","8":"8d8","9":"9d8"},"saveAbility":"con","saveEffect":"half","areaType":"sphere","areaSize":20,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d8 for each slot level above 5th."},{"index":"color-spray","name":"Color Spray","level":1,"school":"Illusion","castingTime":"1 action","range":"Self","duration":"1 round","concentration":false,"ritual":false,"components":"VSM","desc":"A dazzling array of flashing, colored light springs from your hand. Roll 6d10; the total is how many hit points of creatures this spell can effect. Creatures in a 15-foot cone originating from you are affected in ascending order of their current hit points (ignoring unconscious creatures and creatures that can't see). Starting with the creature that has the lowest current hit points, each creature affected by this spell is blinded until the spell ends. Subtract each creature's hit points from th","areaType":"cone","areaSize":15,"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, roll an additional 2d10 for each slot level above 1st."},{"index":"command","name":"Command","level":1,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"1 round","concentration":false,"ritual":false,"components":"V","desc":"You speak a one-word command to a creature you can see within range. The target must succeed on a wisdom saving throw or follow the command on its next turn. The spell has no effect if the target is undead, if it doesn't understand your language, or if your command is directly harmful to it. Some typical commands and their effects follow. You might issue a command other than one described here. If you do so, the GM determines how the target behaves. If the target can't follow your command, the s","saveAbility":"wis","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, you can affect one additional creature for each slot level above 1st. The creatures must be within 30 feet of each other when you target them."},{"index":"commune","name":"Commune","level":5,"school":"Divination","castingTime":"1 minute","range":"Self","duration":"1 minute","concentration":false,"ritual":true,"components":"VSM","desc":"You contact your deity or a divine proxy and ask up to three questions that can be answered with a yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question. Divine beings aren't necessarily omniscient, so you might receive \"unclear\" as an answer if a question pertains to information that lies beyond the deity's knowledge. In a case where a one-word answer could be misleading or contrary to the deity's interests, the GM might offer a short phras"},{"index":"commune-with-nature","name":"Commune With Nature","level":5,"school":"Divination","castingTime":"1 minute","range":"Self","duration":"Instantaneous","concentration":false,"ritual":true,"components":"VS","desc":"You briefly become one with nature and gain knowledge of the surrounding territory. In the outdoors, the spell gives you knowledge of the land within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in dungeons and towns. You instantly gain knowledge of up to three facts of your choice about any of the following subjects as they relate to the area: - terrain and b"},{"index":"comprehend-languages","name":"Comprehend Languages","level":1,"school":"Divination","castingTime":"1 action","range":"Self","duration":"1 hour","concentration":false,"ritual":true,"components":"VSM","desc":"For the duration, you understand the literal meaning of any spoken language that you hear. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode secret messages in a text or a glyph, such as an arcane sigil, that isn't part of a written language."},{"index":"compulsion","name":"Compulsion","level":4,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"Creatures of your choice that you can see within range and that can hear you must make a wisdom saving throw. A target automatically succeeds on this saving throw if it can't be charmed. On a failed save, a target is affected by this spell. Until the spell ends, you can use a bonus action on each of your turns to designate a direction that is horizontal to you. Each affected target must use as much of its movement as possible to move in that direction on its next turn. It can take any action bef","saveAbility":"wis","saveEffect":"none"},{"index":"cone-of-cold","name":"Cone of Cold","level":5,"school":"Evocation","castingTime":"1 action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A blast of cold air erupts from your hands. Each creature in a 60-foot cone must make a constitution saving throw. A creature takes 8d8 cold damage on a failed save, or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.","damageType":"Cold","damageAtSlot":{"5":"8d8","6":"9d8","7":"10d8","8":"11d8","9":"12d8"},"saveAbility":"con","saveEffect":"half","areaType":"cone","areaSize":60,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d8 for each slot level above 5th."},{"index":"confusion","name":"Confusion","level":4,"school":"Enchantment","castingTime":"1 action","range":"90 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"This spell assaults and twists creatures' minds, spawning delusions and provoking uncontrolled action. Each creature in a 10-foot-radius sphere centered on a point you choose within range must succeed on a Wisdom saving throw when you cast this spell or be affected by it. An affected target can't n required by you), as long as they don't violate its alignment. If you don't issue any commands to the cele","higherLevel":"When you cast this spell using a 9th-level spell slot, you summon a celestial of challenge rating 5 or lower."},{"index":"conjure-elemental","name":"Conjure Elemental","level":5,"school":"Conjuration","castingTime":"1 minute","range":"90 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"You call forth an elemental servant. Choose an area of air, earth, fire, or water that fills a 10-foot cube within range. An elemental of challenge rating 5 or lower appropriate to the area you chose appears in an unoccupied space within 10 feet of it. For example, a fire elemental emerges from a bonfire, and an earth elemental rises up from the ground. The elemental disappears when it drops to 0 hit points or when the spell ends. The elemental is friendly to you and your companions for the dura","areaType":"cube","areaSize":10,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the challenge rating increases by 1 for each slot level above 5th."},{"index":"conjure-fey","name":"Conjure Fey","level":6,"school":"Conjuration","castingTime":"1 minute","range":"90 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VS","desc":"You summon a fey creature of challenge rating 6 or lower, or a fey spirit that takes the form of a beast of challenge rating 6 or lower. It appears in an unoccupied space that you can see within range. The fey creature disappears when it drops to 0 hit points or when the spell ends. The fey creature is friendly to you and your companions for the duration. Roll initiative for the creature, which has its own turns. It obeys any verbal commands that you issue to it (no action required by you), as l","higherLevel":"When you cast this spell using a spell slot of 7th level or higher, the challenge rating increases by 1 for each slot level above 6th."},{"index":"conjure-minor-elementals","name":"Conjure Minor Elementals","level":4,"school":"Conjuration","castingTime":"1 minute","range":"90 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VS","desc":"You summon elementals that appear in unoccupied spaces that you can see within range. You choose one the following options for what appears: - One elemental of challenge rating 2 or lower - Two elementals of challenge rating 1 or lower - Four elementals of challenge rating 1/2 or lower - Eight elementals of challenge rating 1/4 or lower. An elemental summoned by this spell disappears when it drops to 0 hit points or when the spell ends. The summoned creatures are friendly to you and your compani","higherLevel":"When you cast this spell using certain higher-level spell slots, you choose one of the summoning options above, and more creatures appear: twice as many with a 6th-level slot and three times as many with an 8th-level slot."},{"index":"conjure-woodland-beings","name":"Conjure Woodland Beings","level":4,"school":"Conjuration","castingTime":"1 action","range":"60 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"You summon fey creatures that appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears: - One fey creature of challenge rating 2 or lower - Two fey creatures of challenge rating 1 or lower - Four fey creatures of challenge rating 1/2 or lower - Eight fey creatures of challenge rating 1/4 or lower A summoned creature disappears when it drops to 0 hit points or when the spell ends. The summoned creatures are friendly to you and your companions","higherLevel":"When you cast this spell using certain higher-level spell slots, you choose one of the summoning options above, and more creatures appear: twice as many with a 6th-level slot and three times as many with an 8th-level slot."},{"index":"contact-other-plane","name":"Contact Other Plane","level":5,"school":"Divination","castingTime":"1 minute","range":"Self","duration":"1 minute","concentration":false,"ritual":true,"components":"V","desc":"You mentally contact a demigod, the spirit of a long-dead sage, or some other mysterious entity from another plane. Contacting this extraplanar intelligence can strain or even break your mind. When you cast this spell, make a DC 15 intelligence saving throw. On a failure, you take 6d6 psychic damage and are insane until you finish a long rest. While insane, you can't take actions, can't understand what other creatures say, can't read, and speak only in gibberish. A greater restoration spell cast","saveAbility":"int","saveEffect":"other"},{"index":"contagion","name":"Contagion","level":5,"school":"Necromancy","castingTime":"1 action","range":"Touch","duration":"7 days","concentration":false,"ritual":false,"components":"VS","desc":"Your touch inflicts disease. Make a melee spell attack against a creature within your reach. On a hit, you afflict the creature with a disease of your choice from any of the ones described below. At the end of each of the target's turns, it must make a constitution saving throw. After failing three of these saving throws, the disease's effects last for the duration, and the creature stops making these saves. After succeeding on three of these saving throws, the creature recovers from the disease","saveAbility":"con","saveEffect":"other"},{"index":"contingency","name":"Contingency","level":6,"school":"Evocation","castingTime":"10 minutes","range":"Self","duration":"10 days","concentration":false,"ritual":false,"components":"VSM","desc":"Choose a spell of 5th level or lower that you can cast, that has a casting time of 1 action, and that can target you. You cast that spell--called the contingent spell--as part of casting contingency, expending spell slots for both, but the contingent spell doesn't come into effect. Instead, it takes effect when a certain circumstance occurs. You describe that circumstance when you cast the two spells. For example, a contingency cast with water breathing might stipulate that water breathing comes"},{"index":"continual-flame","name":"Continual Flame","level":2,"school":"Evocation","castingTime":"1 action","range":"Touch","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"A flame, equivalent in brightness to a torch, springs forth from an object that you touch. The effect looks like a regular flame, but it creates no heat and doesn't use oxygen. A continual flame can be covered or hidden but not smothered or quenched."},{"index":"control-water","name":"Control Water","level":4,"school":"Transmutation","castingTime":"1 action","range":"300 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"Until the spell ends, you control any freestanding water inside an area you choose that is a cube up to 100 feet on a side. You can choose from any of the following effects when you cast this spell. As an action on your turn, you can repeat the same effect or choose a different one. ***Flood.*** You cause the water level of all standing water in the area to rise by as much as 20 feet. If the area includes a shore, the flooding water spills over onto dry land. If you choose an area in a large bod","damageType":"Bludgeoning","damageAtSlot":{"4":"2d8"},"saveAbility":"str","saveEffect":"half","areaType":"cube","areaSize":100},{"index":"control-weather","name":"Control Weather","level":8,"school":"Transmutation","castingTime":"10 minutes","range":"Self","duration":"Up to 8 hours","concentration":true,"ritual":false,"components":"VSM","desc":"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell. Moving to a place where you don't have a clear path to the sky ends the spell early. When you cast the spell, you change the current weather conditions, which are determined by the GM based on the climate and season. You can change precipitation, temperature, and wind. It takes 1d4 x 10 minutes for the new conditions to take effect. Once they do so, you can change the conditions again"},{"index":"counterspell","name":"Counterspell","level":3,"school":"Abjuration","castingTime":"1 reaction","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"S","desc":"You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a success, the creature's spell fails and has no effect.","higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the interrupted spell has no effect if its level is less than or equal to the level of the spell slot you used."},{"index":"create-food-and-water","name":"Create Food and Water","level":3,"school":"Conjuration","castingTime":"1 action","range":"30 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You create 45 pounds of food and 30 gallons of water on the ground or in containers within range, enough to sustain up to fifteen humanoids or five steeds for 24 hours. The food is bland but nourishing, and spoils if uneaten after 24 hours. The water is clean and doesn't go bad."},{"index":"create-undead","name":"Create Undead","level":6,"school":"Necromancy","castingTime":"1 minute","range":"10 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You can cast this spell only at night. Choose up to three corpses of Medium or Small humanoids within range. Each corpse becomes a ghoul under your control. (The GM has game statistics for these creatures.) As a bonus action on each of your turns, you can mentally command any creature you anima nd material that you have seen before. The duration depends on the object's material. If the object is composed of multiple materials, use the shortest durati","areaType":"cube","areaSize":5,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the cube increases by 5 feet for each slot level above 5th."},{"index":"cure-wounds","name":"Cure Wounds","level":1,"school":"Evocation","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the healing increases by 1d8 for each slot level above 1st."},{"index":"dancing-lights","name":"Dancing Lights","level":0,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You create up to four torch-sized lights within range, making them appear as torches, lanterns, or glowing orbs that hover in the air for the duration. You can also combine the four lights into one glowing vaguely humanoid form of Medium size. Whichever form you choose, each light sheds dim light in a 10-foot radius. As a bonus action on your turn, you can move the lights up to 60 feet to a new spot within range. A light must be within 20 feet of another light created by this spell, and a light "},{"index":"darkness","name":"Darkness","level":2,"school":"Evocation","castingTime":"1 action","range":"60 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VM","desc":"Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. The darkness spreads around corners. A creature with darkvision can't see through this darkness, and nonmagical light can't rners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it.","areaType":"sphere","areaSize":20,"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the radius of the fog increases by 20 feet for each slot level above 1st."},{"index":"forbiddance","name":"Forbiddance","level":6,"school":"Abjuration","castingTime":"10 minutes","range":"Touch","duration":"24 hours","concentration":false,"ritual":true,"components":"VSM","desc":"You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can't teleport into the area or use portals, such as those created by the gate spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, Ethereal Plane, Feywild, Shadowfell, or the plane shift spell. In addition, the spell damages type","areaType":"cube","areaSize":40000},{"index":"forcecage","name":"Forcecage","level":7,"school":"Evocation","castingTime":"1 action","range":"100 feet","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"An immobile, invisible, cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose. A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the","areaType":"cube","areaSize":20},{"index":"foresight","name":"Foresight","level":9,"school":"Divination","castingTime":"1 minute","range":"Touch","duration":"8 hours","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target can't be surprised and has advantage on attack rolls, ability checks, and saving throws. Additionally, other creatures have disadvantage on attack rolls against the target for the duration. This spell immediately ends if you cast it again before its duration ends."},{"index":"freedom-of-movement","name":"Freedom of Movement","level":4,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a willing creature. For the duration, the target's movement is unaffected by difficult terrain, and spells and other magical effects can neither reduce the target's speed nor cause the target to be paralyzed or restrained. The target can also spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature that has it grappled. Finally, being underwater imposes no penalties on the target's movement or attacks."},{"index":"freezing-sphere","name":"Freezing Sphere","level":6,"school":"Evocation","castingTime":"1 action","range":"300 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A frigid globe of cold energy streaks from your fingertips to a point of your choice within range, where it explodes in a 60-foot-radius sphere. Each creature within the area must make a constitution saving throw. On a failed save, a creature takes 10d6 cold damage. On a successful save, it takes half as much damage. If the globe strikes a body of water or a liquid that is principally water (not including water-based creatures), it freezes the liquid to a depth of 6 inches over an area 30 feet s","damageType":"Cold","damageAtSlot":{"6":"10d6"},"saveAbility":"con","saveEffect":"half","areaType":"sphere","areaSize":60,"higherLevel":"When you cast this spell using a spell slot of p to the same level as the slot you use for the glyph of warding."},{"index":"goodberry","name":"Goodberry","level":1,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"Up to ten berries appear in your hand and are infused with magic for the duration. A creature can use its action to eat one berry. Eating a berry restores 1 hit point, and the berry provides enough nourishment to sustain a creature for a day. The berries lose their potency if they have not been consumed within 24 hours of the casting of this spell."},{"index":"grease","name":"Grease","level":1,"school":"Conjuration","castingTime":"1 action","range":"60 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"VSM","desc":"Slick grease covers the ground in a 10-foot square centered on a point within range and turns it into difficult terrain for the duration. When the grease appears, each creature standing in its area must succeed on a dexterity saving throw or fall prone. A creature that enters the area or ends its turn there must also succeed on a dexterity saving throw or fall prone.","saveAbility":"dex","saveEffect":"none","areaType":"cube","areaSize":10},{"index":"greater-invisibility","name":"Greater Invisibility","level":4,"school":"Illusion","castingTime":"1 action","range":"Touch","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person."},{"index":"greater-restoration","name":"Greater Restoration","level":5,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You imbue a creature you touch with positive energy to undo a debilitating effect. You can reduce the target's exhaust ch","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one ability check of its choice. It can roll the die before or after making the ability check. The spell then ends."},{"index":"guiding-bolt","name":"Guiding Bolt","level":1,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"1 round","concentration":false,"ritual":false,"components":"VS","desc":"A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 4d6 radiant damage, and the next attack roll made against this target before the end of your next turn has advantage, thanks to the mystical dim light glittering on the target until then.","damageType":"Radiant","damageAtSlot":{"1":"4d6","2":"5d6","3":"6d6","4":"7d6","5":"8d6","6":"9d6","7":"10d6","8":"11d6","9":"12d6"},"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st."},{"index":"gust-of-wind","name":"Gust of Wind","level":2,"school":"Evocation","castingTime":"1 action","range":"Self","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"A line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the spell's duration. Each creature that starts its turn in the line must succeed on a strength saving throw or be pushed 15 feet away from you in a direction following the line. Any creature in the line must spend 2 feet of movement for every 1 foot it moves when moving closer to you. The gust disperses gas or vapor, and it extinguishes candles, torches, and similar unprotected flames in the area. ","saveAbility":"str","saveEffect":"none","areaType":"line","areaSize":60},{"index":"hallow","name":"Hallow","level":5,"school":"Evocation","castingT
