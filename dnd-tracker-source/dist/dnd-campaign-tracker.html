range":"90 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Choose a creature you can see and reach. The target must make a saving throw of Wisdom or be paralyzed for the duration of the spell. This spell has no effect against the undead. At the end of each round, the target can make a new saving throw of Wisdom. If successful, the spell ends for the creature.","saveAbility":"wis","saveEffect":"none","higherLevel":"When you cast this spell using a level 6 or higher location, you can target an additional creature for each level of location beyond the fifth. The creatures must be within 30 feet o f each other when you target them."},{"index":"hold-person","name":"Hold Person","level":2,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Choose a humanoid that you can see within range. The target must succeed on a wisdom saving throw or be paralyzed for the duration. At the end of each of its turns, the target can make another wisdom saving throw. On a success, the spell ends on the target.","saveAbility":"wis","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional humanoid for each slot level above 2nd. The humanoids must be within 30 feet of each other when you target them."},{"index":"holy-aura","name":"Holy Aura","level":8,"school":"Abjuration","castingTime":"1 action","range":"Self","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Divine light washes out from you and coalesces in a soft radiance in a 30-foot radius around you. Creatures of your choice in that radius when you cast this spell shed dim light in a 5-foot radius and have advantage on all saving throws, and other creatures have disadvantage on attack rolls against them until the spell ends. In addition, when a fiend or an undead hits an affected creature with a melee attack, the aura flashes with brilliant light. The attacker must succeed on a constitution savi","areaType":"sphere","areaSize":30},{"index":"hunters-mark","name":"Hunter's Mark","level":1,"school":"Divination","castingTime":"1 bonus action","range":"90 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"V","desc":"You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Wisdom (Perception) or Wisdom (Survival) check you make to find it. If the target drops to 0 hit points before this spell ends, you can use a bonus action on a subsequent turn of yours to mark a new creature.","higherLevel":"When you cast this spell using a spell slot of 3rd or 4th level, you can maintain your concentration on the spell for up to 8 hours. When you use a spell slot of 5th level or higher, you can maintain your concentration on the spell for up to 24 hours."},{"index":"hypnotic-pattern","name":"Hypnotic Pattern","level":3,"school":"Illusion","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"SM","desc":"You create a twisting pattern of colors that weaves through the air inside a 30-foot cube within range. The pattern appears for a moment and vanishes. Each creature in the area who sees the pattern must make a wisdom saving throw. On a failed save, the creature becomes charmed for the duration. While charmed by this spell, the creature is incapacitated and has a speed of 0. The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out ","saveAbility":"wis","saveEffect":"none"},{"index":"ice-storm","name":"Ice Storm","level":4,"school":"Evocation","castingTime":"1 action","range":"300 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A hail of rock-hard ice pounds to the ground in a 20-foot-radius, 40-foot-high cylinder centered on a point within range. Each creature in the cylinder must make a dexterity saving throw. A creature takes 2d8 bludgeoning damage and 4d6 cold damage on a failed save, or half as much damage on a successful one. Hailstones turn the storm's area of effect into difficult terrain until the end of your next turn.","damageType":"Bludgeoning","damageAtSlot":{"4":"2d8 + 4d6","5":"3d8 + 4d6","6":"4d8 + 4d6","7":"5d8 + 4d6","8":"6d8 + 4d6","9":"7d8 + 4d6"},"saveAbility":"dex","saveEffect":"half","areaType":"cylinder","areaSize":20,"higherLevel":"When you cast this spell using a spell slot of 5th level or higher, the bludgeoning damage increases by 1d8 for each slot level above 4th."},{"index":"identify","name":"Identify","level":1,"school":"Divination","castingTime":"1 minute","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":true,"components":"VSM","desc":"You choose one object that you must touch throughout the casting of the spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement to use, and how many charges it has, if any. You learn whether any spells are affecting the item and what they are. If the item was created by a spell, you learn which spell created it. If you instead touch a creature throughout the casting, you learn what spells, if any, are currently "},{"index":"illusory-script","name":"Illusory Script","level":1,"school":"Illusion","castingTime":"1 minute","range":"Touch","duration":"10 days","concentration":false,"ritual":true,"components":"SM","desc":"You write on parchment, paper, or some other suitable writing material and imbue it with a potent illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, you can cause the writing to appear to be an entirely d"},{"index":"imprisonment","name":"Imprisonment","level":9,"school":"Abjuration","castingTime":"1 minute","range":"30 feet","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"You create a magical restraint to hold a creature that you can see within range. The target must succeed on a wisdom saving throw or be bound by the spell; if it succeeds, it is immune to this spell if you cast it again. While affected by this spell, the creature doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the target. When you cast the spell, you choose one of the following forms of imprisonment. ***Burial.*** The target is entombed far ","saveAbility":"wis","saveEffect":"none"},{"index":"incendiary-cloud","name":"Incendiary Cloud","level":8,"school":"Conjuration","castingTime":"1 action","range":"150 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"A swirling cloud of smoke shot through with white-hot embers appears in a 20-foot-radius sphere centered on a point within range. The cloud spreads around corners and is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it. When the cloud appears, each creature in it must make a dexterity saving throw. A creature takes 10d8 fire damage on a failed save, or half as much damage on a successful one. A creature must also m","damageType":"Fire","damageAtSlot":{"8":"10d8"},"saveAbility":"dex","saveEffect":"half","areaType":"sphere","areaSize":20},{"index":"inflict-wounds","name":"Inflict Wounds","level":1,"school":"Necromancy","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage.","damageType":"Necrotic","damageAtSlot":{"1":"3d10","2":"4d10","3":"5d10","4":"6d10","5":"7d10","6":"8d10","7":"9d10","8":"10d10","9":"11d10"},"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st."},{"index":"insect-plague","name":"Insect Plague","level":5,"school":"Conjuration","castingTime":"1 action","range":"300 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"Swarming, biting locusts fill a 20-foot-radius sphere centered on a point you choose within range. The sphere spreads around corners. The sphere remains for the duration, and its area is lightly obscured. The sphere's area is difficult terrain. When the area appears, each creature in it must make a constitution saving throw. A creature takes 4d10 piercing damage on a failed save, or half as much damage on a successful one. A creature must also make this saving throw when it enters the spell's ar","damageType":"Piercing","damageAtSlot":{"5":"4d10","6":"5d10","7":"6d10","8":"7d10","9":"8d10"},"saveAbility":"con","saveEffect":"half","areaType":"sphere","areaSize":20,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d10 for each slot level above 5th."},{"index":"instant-summons","name":"Instant Summons","level":6,"school":"Conjuration","castingTime":"1 minute","range":"Touch","duration":"Until dispelled","concentration":false,"ritual":true,"components":"VSM","desc":"You touch an object weighing 10 pounds or less whose longest dimension is 6 feet or less. The spell leaves an invisible mark on its surface and invisibly inscribes the name of the item on the sapphire you use as the material component. Each time you cast this spell, you must use a different sapphire. At any time thereafter, you can use your action to speak the item's name and crush the sapphire. The item instantly appears in your hand regardless of physical or planar distances, and the spell end"},{"index":"invisibility","name":"Invisibility","level":2,"school":"Illusion","castingTime":"1 action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person. The spell ends for a target that attacks or casts a spell.","higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd."},{"index":"irresistible-dance","name":"Irresistible Dance","level":6,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"V","desc":"Choose one creature that you can see within range. The target begins a comic dance in place: shuffling, tapping its feet, and capering for the duration. Creatures that can't be charmed are immune to this spell. A dancing creature must use all its movement to dance without leaving its space and has disadvantage on dexterity saving throws and attack rolls. While the target is affected by this spell, other creatures have advantage on attack rolls against it. As an action, a dancing creature makes a"},{"index":"jump","name":"Jump","level":1,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"1 minute","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a creature. The creature's jump distance is tripled until the spell ends."},{"index":"knock","name":"Knock","level":2,"school":"Transmutation","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access. A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked. If you choose a target that is held shut with arcane lock, that spell is suppressed for 10 minutes, during which time the t"},{"index":"legend-lore","name":"Legend Lore","level":5,"school":"Divination","castingTime":"10 minutes","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"Name or describe a person, place, or object. The spell brings to your mind a brief summary of the significant lore about the thing you named. The lore might consist of current tales, forgotten stories, or even secret lore that has never been widely known. If the thing you named isn't of legendary importance, you gain no information. The more information you already have about the thing, the more precise and detailed the information you receive is. The information you learn is accurate but might "},{"index":"lesser-restoration","name":"Lesser Restoration","level":2,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned."},{"index":"levitate","name":"Levitate","level":2,"school":"Transmutation","castingTime":"1 action","range":"60 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"One creature or object of your choice that you can see within range rises vertically, up to 20 feet, and remains suspended there for the duration. The spell can levitate a target that weighs up to 500 pounds. An unwilling creature that succeeds on a constitution saving throw is unaffected. The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target's altitude"},{"index":"light","name":"Light","level":0,"school":"Evocation","castingTime":"1 action","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VM","desc":"You touch one object that is no larger than 10 feet in any dimension. Until the spell ends, the object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. The light can be colored as you like. Completely covering the object with something opaque blocks the light. The spell ends if you cast it again or dismiss it as an action. If you target an object held or worn by a hostile creature, that creature must succeed on a dexterity saving throw to avoid the spell.","saveAbility":"dex","saveEffect":"none"},{"index":"lightning-bolt","name":"Lightning Bolt","level":3,"school":"Evocation","castingTime":"1 action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in the line must make a dexterity saving throw. A creature takes 8d6 lightning damage on a failed save, or half as much damage on a successful one. The lightning ignites flammable objects in the area that aren't being worn or carried.","damageType":"Lightning","damageAtSlot":{"3":"8d6","4":"9d6","5":"10d6","6":"11d6","7":"12d6","8":"13d6","9":"14d6"},"saveAbility":"dex","saveEffect":"half","areaType":"line","areaSize":100,"higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd."},{"index":"locate-animals-or-plants","name":"Locate Animals or Plants","level":2,"school":"Divination","castingTime":"1 action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":true,"components":"VSM","desc":"Describe or name a specific kind of beast or plant. Concentrating on the voice of nature in your surroundings, you learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present."},{"index":"locate-creature","name":"Locate Creature","level":4,"school":"Divination","castingTime":"1 action","range":"Self","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"Describe or name a creature that is familiar to you. You sense the direction to the creature's location, as long as that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement. The spell can locate a specific creature known to you, or the nearest creature of a specific kind (such as a human or a unicorn), so long as you have seen such a creature up close--within 30 feet--at least once. If the creature you described or named is in a different form,"},{"index":"locate-object","name":"Locate Object","level":2,"school":"Divination","castingTime":"1 action","range":"Self","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"Describe or name an object that is familiar to you. You sense the direction to the object's location, as long as that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement. The spell can locate a specific object known to you, as long as you have seen it up close--within 30 feet--at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon. This sp"},{"index":"longstrider","name":"Longstrider","level":1,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a creature. The target's speed increases by 10 feet until the spell ends.","higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each spell slot above 1st."},{"index":"mage-armor","name":"Mage Armor","level":1,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"8 hours","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action."},{"index":"mage-hand","name":"Mage Hand","level":0,"school":"Conjuration","castingTime":"1 action","range":"30 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"VS","desc":"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration or until you dismiss it as an action. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again. You can use your action to control the hand. You can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial. You can move the hand up to 30 feet each time you u"},{"index":"magic-circle","name":"Magic Circle","level":3,"school":"Abjuration","castingTime":"1 minute","range":"10 feet","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"You create a 10-foot radius, 20-foot-tall cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear whenever the cylinder intersects with the floor or other surface. Choose one or more of the following types of creatures: celestials, elementals, fey, fiends, or undead. The circle affects a creature of the chosen type in the following ways: - The creature can't willingly enter the cylinder by nonmagical means. If the creature tries to use tel","saveAbility":"cha","saveEffect":"other","areaType":"cylinder","areaSize":10,"higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1 hour for each slot level above 3rd."},{"index":"magic-jar","name":"Magic Jar","level":6,"school":"Necromancy","castingTime":"1 minute","range":"Self","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"Your body falls into a catatonic state as your soul leaves it and enters the container you used for the spell's material component. While your soul inhabits the container, you are aware of your surroundings as if you were in the container's space. You can't move or use reactions. The only action you can take is to project your soul up to 100 feet out of the container, either returning to your living body (and ending the spell) or attempting to possess a humanoids body. You can attempt to possess","saveAbility":"cha","saveEffect":"other"},{"index":"magic-missile","name":"Magic Missile","level":1,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.","damageType":"Force","damageAtSlot":{"1":"3d4 + 3","2":"4d4 + 4","3":"5d4 + 5","4":"6d4 + 6","5":"7d4 + 7","6":"8d4 + 8","7":"9d4 + 9","8":"10d4 + 10","9":"11d4 + 11"},"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, the spell creates one more dart for each slot level above 1st."},{"index":"magic-mouth","name":"Magic Mouth","level":2,"school":"Illusion","castingTime":"1 minute","range":"30 feet","duration":"Until dispelled","concentration":false,"ritual":true,"components":"VSM","desc":"You plant a message to an object in the range of the spell. The message is verbalized when the trigger conditions are met. Choose an object that you see, and that is not worn or carried by another creature. Then say the message, which should not exceed 25 words but listening can take up to 10 minutes. Finally, establish the circumstances that trigger the spell to deliver your message. When these conditions are satisfied, a magical mouth appears on the object and it articulates the message imitat"},{"index":"magic-weapon","name":"Magic Weapon","level":2,"school":"Transmutation","castingTime":"1 bonus action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VS","desc":"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls.","higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the bonus increases to +2. When you use a spell slot of 6th level or higher, the bonus increases to +3."},{"index":"magnificent-mansion","name":"Magnificent Mansion","level":7,"school":"Conjuration","castingTime":"1 minute","range":"300 feet","duration":"24 hours","concentration":false,"ritual":false,"components":"VSM","desc":"You conjure an extradimensional dwelling in range that lasts for the duration. You choose where its one entrance is located. The entrance shimmers faintly and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the portal remains open. You can open or close the portal if you are within 30 feet of it. While closed, the portal is invisible. Beyond the portal is a magnificent foyer with numerous chambers beyo","areaType":"cube","areaSize":5},{"index":"major-image","name":"Major Image","level":3,"school":"Illusion","castingTime":"1 action","range":"120 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot cube. The image appears at a spot that you can see within range and lasts for the duration. It seems completely real, including sounds, smells, and temperature appropriate to the thing depicted. You can't create sufficient heat or cold to cause damage, a sound loud enough to deal thunder damage or deafen a creature, or a smell that might sicken a creature (like a troglodyte's stench).","higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the spell lasts until dispelled, without requiring your concentration."},{"index":"mass-cure-wounds","name":"Mass Cure Wounds","level":5,"school":"Conjuration","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"A wave of healing energy washes out from a point of your choice within range. Choose up to six creatures in a 30-foot-radius sphere centered on that point. Each target regains hit points equal to 3d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","areaType":"sphere","areaSize":30,"higherLevel":"When you cast this spell using a spell slot of 6th level or higher, the healing increases by 1d8 for each slot level above 5th."},{"index":"mass-heal","name":"Mass Heal","level":9,"school":"Conjuration","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"A flood of healing energy flows from you into injured creatures around you. You restore up to 700 hit points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell are also cured of all diseases and any effect making them blinded or deafened. This spell has no effect on undead or constructs."},{"index":"mass-healing-word","name":"Mass Healing Word","level":3,"school":"Evocation","castingTime":"1 bonus action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"As you call out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the healing increases by 1d4 for each slot level above 3rd."},{"index":"mass-suggestion","name":"Mass Suggestion","level":6,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"24 hours","concentration":false,"ritual":false,"components":"VM","desc":"You suggest a course of activity (limited to a sentence or two) and magically influence up to twelve creatures of your choice that you can see within range and that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act automatically negates the effec","saveAbility":"wis","saveEffect":"none","higherLevel":"When you cast this spell using a 7th-level spell slot, the duration is 10 days. When you use an 8th-level spell slot, the duration is 30 days. When you use a 9th-level spell slot, the duration is a year and a day."},{"index":"maze","name":"Maze","level":8,"school":"Conjuration","castingTime":"1 action","range":"60 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VS","desc":"You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze. The target can use its action to  objects if you are familiar with the target and know it is beyond the barrier. Magical silence, 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood blocks the spell. The spell doesn't have to follow a straight line and can travel freely around corners or "},{"index":"meteor-swarm","name":"Meteor Swarm","level":9,"school":"Evocation","castingTime":"1 action","range":"1 mile","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius sphere centered on each point you choose must make a dexterity saving throw. The sphere spreads around corners. A creature takes 20d6 fire damage and 20d6 bludgeoning damage on a failed save, or half as much damage on a successful one. A creature in the area of more than one fiery burst is affected only once. The spell damages objects in the area and ignites flammable o","damageType":"Fire","damageAtSlot":{"9":"20d6 + 20d6"},"saveAbility":"dex","saveEffect":"half","areaType":"sphere","areaSize":40},{"index":"mind-blank","name":"Mind Blank","level":8,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"24 hours","concentration":false,"ritual":false,"components":"VS","desc":"Until the spell ends, one willing creature you touch is immune to psychic damage, any effect that would sense its emotions or read its thoughts, divination spells, and the charmed condition. The spell even foils wish spells and spells or effects of similar power used to affect the target's mind or to gain information about the target."},{"index":"minor-illusion","name":"Minor Illusion","level":0,"school":"Illusion","castingTime":"1 action","range":"30 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"SM","desc":"You create a sound or an image of an object within range that lasts for the duration. The illusion also ends if you dismiss ents":"S","desc":"You become invisible at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends if you attack or cast a spell. You can use your action to move your illusory double up to twice your speed and make it gesture, speak, and behave in whatever way you choose. You can see through its eyes and hear through its ears as if you were located where it is. On each of your turns as a bonus action, you can switch from using its se"},{"index":"misty-step","name":"Misty Step","level":2,"school":"Conjuration","castingTime":"1 bonus action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see."},{"index":"modify-memory","name":"Modify Memory","level":5,"school":"Enchantment","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You attempt to reshape another creature's memories. One creature that you can see must make a wisdom saving throw. If you are fighting the creature, it has advantage on the saving throw. On a failed save, the target becomes charmed by you for the duration. The charmed target is incapacitated and unaware of its surroundings, though it can still hear you. If it takes any damage or is targeted by another spell, this spell ends, and none of the target's memories are modified. While this charm lasts,","saveAbility":"wis","saveEffect":"none","higherLevel":"If you cast this spell using a spell slot of 6th level or higher, you can alter the target's memories of an event that took place up to 7 days ago (6th level), 30 days ago (7th level), 1 year ago (8th level), or any time in the creature's past (9th level)."},{"index":"moonbeam","name":"Moonbeam","level":2,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 bject no larger than 10 feet in any dimension. The target can't be targeted by any divination magic or perceived through magical scrying sensors."},{"index":"pass-without-trace","name":"Pass Without Trace","level":2,"school":"Abjuration","castingTime":"1 action","range":"Self","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"A veil of shadows and silence radiates from you, masking you and your companions from detection. For the duration, each creature you choose within 30 feet of you (including you) has a +10 bonus to Dexterity (Stealth) checks and can't be tracked except by magical means. A creature that receives this bonus leaves behind no tracks or other traces of its passage."},{"index":"passwall","name":"Passwall","level":5,"school":"Transmutation","castingTime":"1 action","range":"30 feet","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"A passage appears at a point of your choice that you can see on a wooden, plaster, or stone surface (such as a wall, a ceiling, or a floor) within range, and lasts for the duration. You choose the opening's dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it. When the opening disappears, any creatures or objects still in the passage created by the spell are safely ejected to an unoccupied space nearest to the surface on w"},{"index":"phantasmal-killer","name":"Phantasmal Killer","level":4,"school":"Illusion","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"You tap into the nightmares of a creature you can see within range and create an illusory manifestation of its deepest fears, visible only to that creature. The target must make a wisdom saving throw. On a failed save, the target becomes frightened for the duration. At the start of each of the target's turns before the spell ends, the target must succeed on a wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends.","damageType":"Psychic","damageAtSlot":{"4":"4d10"},"saveAbility":"wis","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of 5th level or higher, the damage increases by 1d10 for each slot level above 4th."},{"index":"phantom-steed","name":"Phantom Steed","level":3,"school":"Illusion","castingTime":"1 minute","range":"30 feet","duration":"1 hour","concentration":false,"ritual":true,"components":"VS","desc":"A Large quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, but it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed. For the duration, you or a creature you choose can ride the steed. The creature uses the statistics for a riding horse, except it has a speed of 100 feet and can travel 10 "},{"index":"planar-ally","name":"Planar Ally","level":6,"school":"Conjuration","castingTime":"10 minutes","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You beseech an otherworldly entity for aid. The being must be known to you: a god, a primordial, a demon prince, or some other being of cosmic power. That entity sends a celestial, an elemental, or a fiend loyal to it to aid you, making the creature appear in an unoccupied space within range. If you know a specific creature's name, you can speak that name when you cast this spell to request that creature, though you might get a different creature anyway (GM's choice). When the creature appears, "},{"index":"planar-binding","name":"Planar Binding","level":5,"school":"Abjuration","castingTime":"1 hour","range":"60 feet","duration":"24 hours","concentration":false,"ritual":false,"components":"VSM","desc":"With this spell, you attempt to bind a celestial, an elemental, a fey, or a fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of an inverted magic circle in order to keep it trapped while this spell is cast.) At the completion of the casting, the target must make a charisma saving throw. On a failed save, it is bound to serve you for the duration. If the creature was summoned or created by anot","saveAbility":"cha","saveEffect":"none","higherLevel":"When you cast this spell using a spell slot of a higher level, the duration increases to 10 days with a 6th-level slot, to 30 days with a 7th-level slot, to 180 days with an 8th-level slot, and to a year and a day with a 9th-level spell slot."},{"index":"plane-shift","name":"Plane Shift","level":7,"school":"Conjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination. If you are trying to reach the City of Brass, for example, you might arrive in its Street of Steel, before its Gate of Ashes, or looking at the city from across th","saveAbility":"cha","saveEffect":"none"},{"index":"plant-growth","name":"Plant Growth","level":3,"school":"Transmutation","castingTime":"1 action","range":"150 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"This spell channels vitality into plants within a specific area. There are two possible uses for the spell, granting either immediate or long-term benefits. If you cast this spell using 1 action, choose a point within range. All normal plants in a 100-foot radius centered on that point become thick and overgrown. A creature moving through the area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell's area from being affected. If"},{"index":"poison-spray","name":"Poison Spray","level":0,"school":"Conjuration","castingTime":"1 action","range":"10 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You extend your hand toward a creature you can see within range and project a puff of noxious gas from your palm. The creature must succeed on a constitution saving throw or take 1d12 poison damage. This spell's damage increases by 1d12 when you reach 5th level (2d12), 11th level (3d12), and 17th level (4d12).","damageType":"Poison","damageAtLevel":{"1":"1d12","5":"2d12","11":"3d12","17":"4d12"},"saveAbility":"con","saveEffect":"none"},{"index":"polymorph","name":"Polymorph","level":4,"school":"Transmutation","castingTime":"1 action","range":"60 feet","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a wisdom saving throw to avoid the effect. A shapechanger automatically succeeds on this saving throw. The transformation lasts for the duration, or until the target drops to 0 hit points or dies. The new form can be any beast whose challenge rating is equal to or less than the target's (or the target's level, if it doesn't have a challenge rating). The target's game statistics, includ","saveAbility":"wis","saveEffect":"none"},{"index":"power-word-kill","name":"Power Word Kill","level":9,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"You utter a word of power that can compel one creature you can see within range to die instantly. If the creature you choose has 100 hit points or fewer, it dies. Otherwise, the spell has no effect."},{"index":"power-word-stun","name":"Power Word Stun","level":8,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"You speak a word of power that can overwhelm the mind of one creature you can see within range, leaving it dumbfounded. If the target has 150 hit points or fewer, it is stunned. Otherwise, the spell has no effect. The stunned target must make a constitution saving throw at the end of each of its turns. On a successful save, this stunning effect ends."},{"index":"prayer-of-healing","name":"Prayer of Healing","level":2,"school":"Evocation","castingTime":"10 minutes","range":"30 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"Up to six creatures of your choice that you can see within range each regain hit points equal to 2d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, the healing increases by 1d8 for each slot level above 2nd."},{"index":"prestidigitation","name":"Prestidigitation","level":0,"school":"Transmutation","castingTime":"1 action","range":"10 feet","duration":"1 hour","concentration":false,"ritual":false,"components":"VS","desc":"This spell is a minor magical trick that novice spellcasters use for practice. You create one of the following magical effects within 'range': You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor. You instantaneously light or snuff out a candle, a torch, or a small campfire. You instantaneously clean or soil an object no larger than 1 cubic foot. You chill, warm, or flavor up to 1 cubic foot of nonliving material fo"},{"index":"prismatic-spray","name":"Prismatic Spray","level":7,"school":"Evocation","castingT Once the illu","areaType":"cube","areaSize":30},{"index":"project-image","name":"Project Image","level":7,"school":"Illusion","castingTime":"1 action","range":"500 miles","duration":"Up to 24 hours","concentration":true,"ritual":false,"components":"VSM","desc":"You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you but is intangible. If the illusion takes any damage, it disappears, and the spell ends. You can use your action to move this illusion up to twice your speed, and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly. You can see throu"},{"index":"protection-from-energy","name":"Protection From Energy","level":3,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VS","desc":"For the duration, the willing creature you touch has resistance to one damage type of your choice: acid, cold, fire, lightning, or thunder."},{"index":"protection-from-evil-and-good","name":"Protection from Evil and Good","level":1,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"Until the spell ends, one willing creature you touch is protected against certain types of creatures: aberrations, celestials, elementals, fey, fiends, and undead. The protection grants several benefits. Creatures of those types have disadvantage on attack rolls against the target. The target also can't be charmed, frightened, or possessed by them. If the target is already charmed, frightened, or possessed by such a creature, the target has advantage on any new saving throw against the relevant "},{"index":"protection-from-poison","name":"Protection from Poison","level":2,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VS","desc":"You touch a creature. If it is poisoned, you neutralize the poison. If more than one poison afflicts the target, you neutralize one poison that you know is present, or you neutralize one at random. For the duration, the target has advantage on saving throws against being poisoned, and it has resistance to poison damage."},{"index":"purify-food-and-drink","name":"Purify Food and Drink","level":1,"school":"Transmutation","castingTime":"1 action","range":"10 feet","duration":"Instantaneous","concentration":false,"ritual":true,"components":"VS","desc":"All nonmagical food and drink within a 5-foot radius sphere centered on a point of your choice within range is purified and rendered free of poison and disease."},{"index":"raise-dead","name":"Raise Dead","level":5,"school":"Necromancy","castingTime":"1 hour","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You return a dead creature you touch to life, provided that it has been dead no longer than 10 days. If the creature's soul is both willing and at liberty to rejoin the body, the creature returns to life with 1 hit point. This spell also neutralizes any poisons and cures nonmagical diseases that affected the creature at the time it died. This spell doesn't, however, remove magical diseases, curses, or similar effects; if these aren't first removed prior to casting the spell, they take effect whe"},{"index":"ray-of-enfeeblement","name":"Ray of Enfeeblement","level":2,"school":"Necromancy","castingTime":"1 action","range":"60 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VS","desc":"A black beam of enervating energy springs from your finger toward a creature within range. Make a ranged spell attack against the target. On a hit, the target deals only half damage with weapon attacks that use Strength until the spell ends. At the end of each of the target's turns, it can make a constitution saving throw against the spell. On a success, the spell ends.","saveAbility":"con","saveEffect":"none"},{"index":"ray-of-frost","name":"Ray of Frost","level":0,"school":"Evocation","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 cold damage, and its speed is reduced by 10 feet until the start of your next turn. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","damageType":"Cold","damageAtLevel":{"1":"1d8","5":"2d8","11":"3d8","17":"4d8"}},{"index":"regenerate","name":"Regenerate","level":7,"school":"Transmutation","castingTime":"1 minute","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a creature and stimulate its natural healing ability. The target regains 4d8 + 15 hit points. For the duration of the spell, the target regains 1 hit point at the start of each of its turns (10 hit points each minute). The target's severed body members (fingers, legs, tails, and so on), if any, are restored after 2 minutes. If you have the severed part and hold it to the stump, the spell instantaneously causes the limb to knit to the stump."},{"index":"reincarnate","name":"Reincarnate","level":5,"school":"Transmutation","castingTime":"1 hour","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a dead humanoid or a piece of a dead humanoid. Provided that the creature has been dead no longer than 10 days, the spell forms a new adult body for it and then calls the soul to enter that body. If the target's soul isn't free or willing to do so, the spell fails. The magic fashions a new body for the creature to inhabit, which likely causes the creature's race to change. The GM rolls a d 100 and consults the following table to determine what form the creature takes when restored to l"},{"index":"remove-curse","name":"Remove Curse","level":3,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's attunement to the object so it can be removed or discarded."},{"index":"resilient-sphere","name":"Resilient Sphere","level":4,"school":"Evocation","castingTime":"1 action","range":"30 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"A sphere of shimmering force encloses a creature or object of Large size or smaller within range. An unwilling creature must make a dexterity saving throw. On a failed save, the creature is enclosed for the duration. Nothing--not physical objects, energy, or other spell effects--can pass through the barrier, in or out, though a creature in the sphere can breathe there. The sphere is immune to all damage, and a creature or object inside can't be damaged by attacks or effects originating from outs","saveAbility":"dex","saveEffect":"none"},{"index":"resistance","name":"Resistance","level":0,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends."},{"index":"resurrection","name":"Resurrection","level":7,"school":"Necromancy","castingTime":"1 hour","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a dead creature that has been dead for no more than a century, that didn't die of old age, and that isn't undead. If its soul is free and willing, the target returns to life with all its hit points. This spell neutralizes any poisons and cures normal diseases afflicting the creature when it died. It doesn't, however, remove magical diseases, curses, and the like; if such effects aren't removed prior to casting the spell, they afflict the target on its return to life. This spell closes "},{"index":"reverse-gravity","name":"Reverse Gravity","level":7,"school":"Transmutation","castingTime":"1 action","range":"100 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"This spell reverses gravity in a 50-foot-radius, 100-foot high cylinder centered on a point within range. All creatures and objects that aren't somehow anchored to the ground in the area fall upward and reach the top of the area when you cast this spell. A creature can make a dexterity saving throw to grab onto a fixed object it can reach, thus avoiding the fall. If some solid object (such as a ceiling) is encountered in this fall, falling objects and creatures strike it just as they would durin","saveAbility":"dex","saveEffect":"other","areaType":"cylinder","areaSize":50},{"index":"revivify","name":"Revivify","level":3,"school":"Conjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a creature that has died within the last minute. That creature returns to life with 1 hit point. This spell can't return to life a creature that has died of old age, nor can it restore any missing body parts."},{"index":"rope-trick","name":"Rope Trick","level":2,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a length of rope that is up to 60 feet long. One end of the rope then rises into the air until the whole rope hangs perpendicular to the ground. At the upper end of the rope, an invisible entrance opens to an extradimensional space that lasts until the spell ends. The extradimensional space can be reached by climbing to the top of the rope. The space can hold as many as eight Medium or smaller creatures. The rope can be pulled into the space, making the rope disappear from view outside"},{"index":"sacred-flame","name":"Sacred Flame","level":0,"school":"Evocation","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a dexterity saving throw or take 1d8 radiant damage. The target gains no benefit from cover for this saving throw. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","damageType":"Radiant","damageAtLevel":{"1":"1d8","5":"2d8","11":"3d8","17":"4d8"},"saveAbility":"dex","saveEffect":"none"},{"index":"sanctuary","name":"Sanctuary","level":1,"school":"Abjuration","castingTime":"1 bonus action","range":"30 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"VSM","desc":"You ward a creature within range against attack. Until the spell ends, any creature who targets the warded creature with an attack or a harmful spell must first make a wisdom saving throw. On a failed save, the creature must choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from area effects, such as the explosion of a fireball. If the warded creature makes an attack or casts a spell that affects an enemy creature, this spell ends."},{"index":"scorching-ray","name":"Scorching Ray","level":2,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 fire damage.","damageType":"Fire","damageAtSlot":{"2":"2d6"},"higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, you create one additional ray for each slot level above 2nd."},{"index":"scrying","name":"Scrying","level":5,"school":"Divination","castingTime":"10 minutes","range":"Self","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"You can see and hear a particular creature you choose that is on the same plane of existence as you. The target must make a wisdom saving throw, which is modified by how well you know the target and the sort of physical connection you have to it. If a target knows you're casting this spell, it can fail the saving throw voluntarily if it wants to be observed. | Knowledge | Save Modifier | |---|---| | Secondhand (you have heard of the target) | +5 | | Firsthand (you have met the target) | +0 | | F","saveAbility":"wis","saveEffect":"none"},{"index":"secret-chest","name":"Secret Chest","level":4,"school":"Conjuration","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You hide a chest, and all its contents, on the Ethereal Plane. You must touch the chest and the miniature replica that serves as a material component for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet). While the chest remains on the Ethereal Plane, you can use an action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by using "},{"index":"see-invisibility","name":"See Invisibility","level":2,"school":"Divination","castingTime":"1 action","range":"Self","duration":"1 hour","concentration":false,"ritual":false,"components":"VSM","desc":"For the duration of the spell, you see invisible creatures and objects as if they were visible, and you can see through Ethereal. The ethereal objects and creatures appear ghostly translucent."},{"index":"seeming","name":"Seeming","level":5,"school":"Illusion","castingTime":"1 action","range":"30 feet","duration":"8 hours","concentration":false,"ritual":false,"components":"VS","desc":"This spell allows you to change the appearance of any number of creatures that you can see within range. You give each target you choose a new, illusory appearance. An unwilling target can make a charisma saving throw, and if it succeeds, it is unaffected by this spell. The spell disguises physical appearance as well as clothing, armor, weapons, and equipment. You can make each creature seem 1 foot shorter or taller and appear thin, fat, or in between. You can't change a target's body type, so y"},{"index":"sending","name":"Sending","level":3,"school":"Evocation","castingTime":"1 action","range":"Unlimited","duration":"1 round","concentration":false,"ritual":false,"components":"VSM","desc":"You send a short message of twenty-five words or less to a creature with which you are familiar. The creature hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables creatures with Intelligence scores of at least 1 to understand the meaning of your message. You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent c"},{"index":"sequester","name":"Sequester","level":7,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"By means of this spell, a willing creature or an object can be hidden away, safe from detection for the duration. When you cast the spell and touch the target, it becomes invisible and can't be targeted by divination spells or perceived through scrying sensors created by divination spells. If the target is a creature, it falls into a state of suspended animation. Time ceases to flow for it, and it doesn't grow older. You can set a condition for the spell to end early. The condition can be anythi"},{"index":"shapechange","name":"Shapechange","level":9,"school":"Transmutation","castingTime":"1 action","range":"Self","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"You assume the form of a different creature for the duration. The new form can be of any creature with a challenge rating equal to your level or lower. The creature can't be a construct or an undead, and you must have seen the sort of creature at least once. You transform into an average example of that creature, one without any class levels or the Spellcasting trait. Your game statistics are replaced by the statistics of the chosen creature, though you retain your alignment and Intelligence, Wi"},{"index":"shatter","name":"Shatter","level":2,"school":"Evocation","castingTime":"1 action","range":"60 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"A sudden loud ringing noise, painfully intense, erupts from a point of your choice within range. Each creature in a 10-foot-radius sphere centered on that point must make a Constitution saving throw. A creature takes 3d8 thunder damage on a failed save, or half as much damage on a successful one. A creature made of inorganic material such as stone, crystal, or metal has disadvantage on this saving throw. A non-magical item that is not worn or carried also suffers damage if it is in the area of t","damageType":"Thunder","damageAtSlot":{"2":"3d8","3":"4d8","4":"5d8","5":"6d8","6":"7d8","7":"8d8","8":"9d8","9":"10d8"},"saveAbility":"con","saveEffect":"half","areaType":"sphere","areaSize":10,"higherLevel":"When you cast this spell using a 3 or higher level spell slot, the damage of the spell increases by 1d8 for each level of higher spell slot 2."},{"index":"shield","name":"Shield","level":1,"school":"Abjuration","castingTime":"1 reaction","range":"Self","duration":"1 round","concentration":false,"ritual":false,"components":"VS","desc":"An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile."},{"index":"shield-of-faith","name":"Shield of Faith","level":1,"school":"Abjuration","castingTime":"1 bonus action","range":"60 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration."},{"index":"shillelagh","name":"Shillelagh","level":0,"school":"Transmutation","castingTime":"1 bonus action","range":"Touch","duration":"1 minute","concentration":false,"ritual":false,"components":"VSM","desc":"The wood of a club or a quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. The weapon also becomes magical, if it isn't already. The spell ends if you cast it again or if you let go of the weapon."},{"index":"shocking-grasp","name":"Shocking Grasp","level":0,"school":"Evocation","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"Lightning springs from your hand to deliver a shock to a creature you try to touch. Make a melee spell attack against the target. You have advantage on the attack roll if the target is wearing armor made of metal. On a hit, the target takes 1d8 lightning damage, and it can't take reactions until the start of its next turn. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","damageType":"Lightning","damageAtLevel":{"1":"1d8","5":"2d8","11":"3d8","17":"4d8"}},{"index":"silence","name":"Silence","level":2,"school":"Illusion","castingTime":"1 action","range":"120 feet","duration":"Up to 10 minutes","concentration":true,"ritual":true,"components":"VS","desc":"For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it. Casting a spell that includes a verbal component is impossible there.","areaType":"sphere","areaSize":20},{"index":"silent-image","name":"Silent Image","level":1,"school":"Illusion","castingTime":"1 action","range":"60 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects. You can use your action to cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an i","areaType":"cube","areaSize":15},{"index":"simulacrum","name":"Simulacrum","level":7,"school":"Illusion","castingTime":"12 hours","range":"Touch","duration":"Until dispelled","concentration":false,"ritual":false,"components":"VSM","desc":"You shape an illusory duplicate of one beast or humanoid that is within range for the entire casting time of the spell. The duplicate is a creature, partially real and formed from ice or snow, and it can take actions and otherwise be affected as a normal creature. It appears to be the same as the original, but it has half the creature's hit point maximum and is formed without any equipment. Otherwise, the illusion uses all the statistics of the creature it duplicates. The simulacrum is friendly "},{"index":"sleep","name":"Sleep","level":1,"school":"Enchantment","castingTime":"1 action","range":"90 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"VSM","desc":"This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point you choose within range are affected in ascending order of their current hit points (ignoring unconscious creatures). Starting with the creature that has the lowest current hit points, each creature affected by this spell falls unconscious until the spell ends, the sleeper takes damage, or someone uses an action to shake or slap the","damageAtSlot":{"1":"5d8"},"areaType":"sphere","areaSize":20,"higherLevel":"When you cast this spell using a spell slot of 2nd level or higher, roll an additional 2d8 for each slot level above 1st."},{"index":"sleet-storm","name":"Sleet Storm","level":3,"school":"Conjuration","castingTime":"1 action","range":"150 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"Until the spell ends, freezing rain and sleet fall in a 20-foot-tall cylinder with a 40-foot radius centered on a point you choose within range. The area is heavily obscured, and exposed flames in the area are doused. The ground in the area is covered with slick ice, making it difficult terrain. When a creature enters the spell's area for the first time on a turn or starts its turn there, it must make a dexterity saving throw. On a failed save, it falls prone. If a creature is concentrating in t","areaType":"cylinder","areaSize":40},{"index":"slow","name":"Slow","level":3,"school":"Transmutation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You alter time around up to six creatures of your choice in a 40-foot cube within range. Each target must succeed on a wisdom saving throw or be affected by this spell for the duration. An affected target's speed is halved, it takes a -2 penalty to AC and dexterity saving throws, and it can't use reactions. On its turn, it can use either an action or a bonus action, not both. Regardless of the creature's abilities or magic items, it can't make more than one melee or ranged attack during its turn","saveAbility":"wis","saveEffect":"none","areaType":"cube","areaSize":40},{"index":"spare-the-dying","name":"Spare the Dying","level":0,"school":"Necromancy","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VS","desc":"You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs."},{"index":"speak-with-animals","name":"Speak with Animals","level":1,"school":"Divination","castingTime":"1 action","range":"Self","duration":"10 minutes","concentration":false,"ritual":true,"components":"VS","desc":"You gain the ability to comprehend and verbally communicate with beasts for the duration. The knowledge and awareness of many beasts is limited by their intelligence, but at a minimum, beasts can give you information about nearby locations and monsters, including whatever they can perceive or have perceived within the past day. You might be able to persuade a beast to perform a small favor for you, at the GM's discretion."},{"index":"speak-with-dead","name":"Speak with Dead","level":3,"school":"Necromancy","castingTime":"1 action","range":"10 feet","duration":"10 minutes","concentration":false,"ritual":false,"components":"VSM","desc":"You grant the semblance of life and intelligence to a corpse of your choice within range, allowing it to answer the questions you pose. The corpse must still have a mouth and can't be undead. The spell fails if the corpse was the target of this spell within the last 10 days. Until the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no co"},{"index":"speak-with-plants","name":"Speak with Plants","level":3,"school":"Transmutation","castingTime":"1 action","range":"Self","duration":"10 minutes","concentration":false,"ritual":false,"components":"VS","desc":"You imbue plants within 30 feet of you with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances. You can also turn difficult terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrai","areaType":"sphere","areaSize":30},{"index":"spider-climb","name":"Spider Climb","level":2,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed."},{"index":"spike-growth","name":"Spike Growth","level":2,"school":"Transmutation","castingTime":"1 action","range":"150 feet","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"The ground in a 20-foot radius centered on a point within range twists and sprouts hard spikes and thorns. The area becomes difficult terrain for the duration. When a creature moves into or within the area, it takes 2d4 piercing damage for every 5 feet it travels. The transformation of the ground is camouflaged to look natural. Any creature that can't see the area at the time the spell is cast can make a Wisdom (Perception) check against your spell save DC to recognize the terrain as hazardous b","areaType":"cylinder","areaSize":20},{"index":"spirit-guardians","name":"Spirit Guardians","level":3,"school":"Conjuration","castingTime":"1 action","range":"Self","duration":"Up to 10 minutes","concentration":true,"ritual":false,"components":"VSM","desc":"You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell, you can designate any number of creatures you can see to be unaffected by it. An affected creature's speed is halved in the area, and when the creature enters the area for the first time on a turn or starts its turn there, it must make a wisdom s","higherLevel":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d8 for each slot level above 3rd."},{"index":"spiritual-weapon","name":"Spiritual Weapon","level":2,"school":"Evocation","castingTime":"1 bonus action","range":"60 feet","duration":"1 minute","concentration":false,"ritual":false,"components":"VS","desc":"You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier. As a bonus action on your turn, you can move the weapon up to 20 feet and repeat the attack against a creature within 5 feet of it. The weapon can take whatever form you choose. Clerics ","damageType":"Force","damageAtSlot":{"2":"1d8 + MOD","3":"1d8 + MOD","4":"2d8 + MOD","5":"2d8 + MOD","6":"3d8 + MOD","7":"3d8 + MOD","8":"4d8 + MOD","9":"4d8 + MOD"},"higherLevel":"When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8 for every two slot levels above the 2nd."},{"index":"stinking-cloud","name":"Stinking Cloud","level":3,"school":"Conjuration","castingTime":"1 action","range":"90 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"You create a 20-foot-radius sphere of yellow, nauseating gas centered on a point within range. The cloud spreads around corners, and its area is heavily obscured. The cloud lingers in the air for the duration. Each creature that is completely within the cloud at the start of its turn must make a constitution saving throw against poison. On a failed save, the creature spends its action that turn retching and reeling. Creatures that don't need to breathe or are immune to poison automatically succe","saveAbility":"con","saveEffect":"none","areaType":"sphere","areaSize":20},{"index":"stone-shape","name":"Stone Shape","level":4,"school":"Transmutation","castingTime":"1 action","range":"Touch","duration":"Instantaneous","concentration":false,"ritual":false,"components":"VSM","desc":"You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape that suits your purpose. So, for example, you could shape a large rock into a weapon, idol, or coffer, or make a small passage through a wall, as long as the wall is less than 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible"},{"index":"stoneskin","name":"Stoneskin","level":4,"school":"Abjuration","castingTime":"1 action","range":"Touch","duration":"Up to 1 hour","concentration":true,"ritual":false,"components":"VSM","desc":"This spell turns the fle
