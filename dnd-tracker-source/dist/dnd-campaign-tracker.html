        <details class="rules-sub">
          <summary><span>Multiple-monster multiplier</span></summary>
          <div class="rules-sub-body">
            <div class="ref-table">${multRows}</div>
            <div class="hint" style="margin-top:6px;">Shift one bracket up (more dangerous) if the party has fewer than 3 characters, or one bracket down if it has 6 or more.</div>
          </div>
        </details>
      </div>
    </details>
  `;
}

function renderSpellsByClassSection(){
  const classes = state.srdClasses||[];
  const spells = state.srdSpellIndex||[];
  const classMap = state.spellClassMap||{};
  const blocks = classes.map(cls=>{
    if(!cls.spellAbility){
      return `
        <details class="rules-sub">
          <summary><span>${escapeHtml(cls.name)}</span></summary>
          <div class="rules-sub-body"><div class="hint">${escapeHtml(SPELL_NONCASTER_NOTE[cls.index] || 'No spellcasting.')}</div></div>
        </details>`;
    }
    const classSpells = spells.filter(s=> (classMap[s.index]||[]).includes(cls.index));
    const byLevel = {};
    classSpells.forEach(s=>{ (byLevel[s.level] = byLevel[s.level]||[]).push(s); });
    const levelBlocks = Object.keys(byLevel).map(Number).sort((a,b)=>a-b).map(lvl=>{
      const list = byLevel[lvl].slice().sort((a,b)=>a.name.localeCompare(b.name));
      const items = list.map(s=>{
        const meta = spellStatLine(s);
        const higher = s.higherLevel ? `<div style="margin-top:6px;"><em>At Higher Levels.</em> ${escapeHtml(s.higherLevel)}</div>` : '';
        return `<details class="spell-ref-item">
          <summary><span class="spell-ref-name">${escapeHtml(s.name)}</span><span class="spell-ref-meta">${escapeHtml(s.school)}${meta?' · '+escapeHtml(meta):''}</span></summary>
          <div class="spell-ref-item-body">${escapeHtml(s.desc||'')}${higher}</div>
        </details>`;
      }).join('');
      const label = lvl===0 ? 'Cantrips' : `Level ${lvl}`;
      return `<div class="spell-ref-level"><div class="spell-ref-level-label">${label} (${list.length})</div>${items}</div>`;
    }).join('');
    return `
      <details class="rules-sub">
        <summary><span>${escapeHtml(cls.name)}</span><span class="hint" style="margin:0;">${classSpells.length} spells · ${escapeHtml(SPELL_ABILITY_LABELS[cls.spellAbility]||cls.spellAbility)} casting</span></summary>
        <div class="rules-sub-body">${levelBlocks}</div>
      </details>`;
  }).join('');
  return `
    <details class="rules-section">
      <summary><span>Spells by Class</span></summary>
      <div class="rules-body">
        <div class="hint" style="margin-bottom:8px;">Every spell in the embedded SRD library, grouped by class spell list and level. Third-caster subclasses (Eldritch Knight, Arcane Trickster) pull from the Wizard list, noted under Fighter/Rogue below.</div>
        ${blocks}
      </div>
    </details>
  `;
}

function renderWeaponsSection(){
  const byIndex = {};
  (state.srdEquipmentIndex||[]).forEach(e=>{ byIndex[e.index] = e; });
  const blocks = Object.keys(WEAPON_CATEGORIES).map(cat=>{
    const rows = WEAPON_CATEGORIES[cat].map(idx=>byIndex[idx]).filter(Boolean).map(w=>`
      <div class="equip-ref-row">
        <span class="equip-ref-name">${escapeHtml(w.name)}</span>
        <span class="equip-ref-detail">${escapeHtml((w.summary||'').replace(/^Weapon\s*·\s*/,''))}</span>
        <span class="equip-ref-cost">${escapeHtml(w.cost)} · ${escapeHtml(w.weight)}</span>
      </div>`).join('');
    return `
      <details class="rules-sub">
        <summary><span>${cat}</span><span class="hint" style="margin:0;">${WEAPON_CATEGORIES[cat].length} weapons</span></summary>
        <div class="rules-sub-body">${rows}</div>
      </details>`;
  }).join('');
  return `
    <details class="rules-section">
      <summary><span>Weapons</span></summary>
      <div class="rules-body">
        <div class="hint" style="margin-bottom:8px;">Damage die, damage type, and properties for every SRD weapon, split into the four proficiency categories.</div>
        ${blocks}
      </div>
    </details>
  `;
}

function renderArmorSection(){
  const byIndex = {};
  (state.srdEquipmentIndex||[]).forEach(e=>{ byIndex[e.index] = e; });
  const blocks = Object.keys(ARMOR_CATEGORIES).map(cat=>{
    const rows = ARMOR_CATEGORIES[cat].map(idx=>byIndex[idx]).filter(Boolean).map(a=>{
      const strMin = ARMOR_STR_MIN[a.index];
      const stealthDisadv = ARMOR_STEALTH_DISADV.has(a.index);
      const notes = [];
      if(strMin) notes.push(`Str ${strMin} req.`);
      if(stealthDisadv) notes.push('Stealth disadv.');
      return `
      <div class="equip-ref-row">
        <span class="equip-ref-name">${escapeHtml(a.name)}</span>
        <span class="equip-ref-detail">${escapeHtml((a.summary||'').replace(/^Armor\s*·\s*/,''))}${notes.length?' · '+notes.join(', '):''}</span>
        <span class="equip-ref-cost">${escapeHtml(a.cost)} · ${escapeHtml(a.weight)}</span>
      </div>`;
    }).join('');
    return `
      <details class="rules-sub">
        <summary><span>${cat}</span><span class="hint" style="margin:0;">${ARMOR_CATEGORIES[cat].length} items</span></summary>
        <div class="rules-sub-body">${rows}</div>
      </details>`;
  }).join('');
  return `
    <details class="rules-section">
      <summary><span>Armor</span></summary>
      <div class="rules-body">
        <div class="hint" style="margin-bottom:8px;">Base AC formula, cost, and weight for every SRD armor type. Strength requirements and Stealth disadvantage are standard PHB values, included for convenience.</div>
        ${blocks}
      </div>
    </details>
  `;
}

function renderConditionsRefSection(){
  const rows = (state.srdConditions||[]).map(c=>`
    <details class="rules-sub">
      <summary><span>${escapeHtml(c.name)}</span></summary>
      <div class="rules-sub-body"><div class="hint" style="line-height:1.5;">${escapeHtml(c.desc)}</div></div>
    </details>`).join('');
  return `
    <details class="rules-section">
      <summary><span>Conditions</span></summary>
      <div class="rules-body">
        ${rows}
      </div>
    </details>
  `;
}

function renderFeatsRefSection(){
  const rows = FEATS.map(f=>{
    let tag = '';
    if(f.bonuses) tag = summarizeItemBonuses(f.bonuses);
    if(f.abilityChoice){
      const opts = f.abilityChoice.options.map(o=>o.toUpperCase()).join('/');
      const piece = `+${f.abilityChoice.amount} ${opts}${f.abilityChoice.grantsSaveProf ? ' (+ save proficiency)' : ''}`;
      tag = tag ? `${tag} · ${piece}` : piece;
    }
    if(f.hpPerLevel){
      const piece = `+${f.hpPerLevel} max HP now, and again each level`;
      tag = tag ? `${tag} · ${piece}` : piece;
    }
    return `
    <details class="rules-sub">
      <summary><span>${escapeHtml(f.name)}</span>${tag ? `<span class="hint" style="margin:0;">${escapeHtml(tag)}</span>` : ''}</summary>
      <div class="rules-sub-body"><div class="hint" style="line-height:1.5;">${escapeHtml(f.desc)}</div></div>
    </details>`;
  }).join('');
  return `
    <details class="rules-section">
      <summary><span>Feats</span><span class="hint" style="margin:0;">${FEATS.length} curated PHB feats</span></summary>
      <div class="rules-body">
        <div class="hint" style="margin-bottom:8px;">The full list built into the tracker's "Add feat" picker on each character's Ability Scores card, for quick browsing without having to search one at a time. Half-feats (ability-score bump) and always-on bonuses are tagged next to the name; everything else is a flavor/mechanical effect the table adjudicates directly. Homebrew feats are always an option too, from the same picker.</div>
        ${rows}
      </div>
    </details>
  `;
}

function renderRules(){
  return `
    <div class="card">
      <h3>📖 Rules Reference</h3>
      <div class="hint" style="margin-bottom:10px;">Pulled from the same embedded SRD data used everywhere else in this tool — no network needed. Click a section to expand it; open as many at once as you like.</div>
      ${renderAbilityRefSection()}
      ${renderFeatsRefSection()}
      ${renderCombatBasicsSection()}
      ${renderExplorationSection()}
      ${renderEncounterBuildingSection()}
      ${renderSpellcastingBasicsSection()}
      ${renderSpellsByClassSection()}
      ${renderWeaponsSection()}
      ${renderArmorSection()}
      ${renderConditionsRefSection()}
    </div>
  `;
}

// ---- Battle Initiative Order (Dice tab) ----
function renderBattleInitiative(){
  const c = state.campaign;
  const combatants = [
    ...c.characters.filter(ch=>['alive','unconscious'].includes(ch.status)).map(ch=>({ kind:'pc', ref:ch, idx:c.characters.indexOf(ch) })),
    ...c.enemies.filter(en=>en.status==='alive').map(en=>({ kind:'enemy', ref:en, idx:c.enemies.indexOf(en) }))
  ];

  const rows = combatants.map(({kind,ref,idx})=>{
    const dexMod = abilityMod(ref.abilities.dex);
    const base = kind==='pc' ? `characters.${idx}` : `enemies.${idx}`;
    const gearBonus = kind==='pc' ? equippedItemInitiativeBonus(ref) : 0;
    return `<div class="item-row" style="flex-wrap:wrap;">
      <strong style="flex:1;min-width:110px;color:${kind==='pc'?'var(--brass)':'var(--ember)'}">${escapeHtml(ref.name)}</strong>
      <span class="hint" style="width:70px;">DEX ${fmtMod(dexMod)}</span>
      <input type="number" data-bind="${base}.initiativeBonus" data-type="number" value="${ref.initiativeBonus||0}" style="width:56px;" title="${kind==='pc' ? 'Bonus from feats or class features (equipped-item bonuses are added automatically from Inventory)' : 'Bonus from traits, magic, etc.'}">
      ${gearBonus ? `<span class="hint" title="From equipped inventory items">+${gearBonus} gear</span>` : ''}
      <select data-bind="${base}.initiativeMode" data-type="text" style="width:120px;">
        <option value="normal" ${(ref.initiativeMode||'normal')==='normal'?'selected':''}>Normal</option>
        <option value="adv" ${ref.initiativeMode==='adv'?'selected':''}>Advantage</option>
        <option value="disadv" ${ref.initiativeMode==='disadv'?'selected':''}>Disadvantage</option>
      </select>
      <label style="display:inline-flex;align-items:center;gap:4px;text-transform:none;font-size:11px;">
        <input type="checkbox" data-bind="${base}.surprised" data-type="checkbox" ${ref.surprised?'checked':''} style="width:auto;"> surprised
      </label>
    </div>`;
  }).join('');

  const ordered = computeInitiativeOrder(c);
  const anyRolled = ordered.some(({ref})=>ref.initiative!=null);
  const combatActive = !!c.combat;
  const current = combatActive ? currentCombatRef(c) : null;

  const resultRows = ordered.map(({kind,ref},i)=>{
    const breakdown = state.battleInitBreakdown[ref.id];
    const isCurrent = current && current.id===ref.id && current.kind===kind;
    return `<div class="roll-log-row" style="align-items:center;flex-wrap:wrap;${isCurrent?'background:var(--panel-2);border-radius:6px;box-shadow:inset 3px 0 0 var(--brass);':''}">
      <span>${isCurrent?'▶ ':''}<strong style="color:${kind==='pc'?'var(--brass)':'var(--ember)'}">${i+1}. ${escapeHtml(ref.name)}</strong>${ref.surprised?' <span class="hint" style="color:var(--ember);">😮 surprised — no turn until round 2</span>':''}</span>
      <span>${ref.initiative==null?'—':ref.initiative}${breakdown?` <span class="hint">(${escapeHtml(breakdown)})</span>`:''}</span>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <h3>Battle Initiative Order</h3>
      <div class="hint" style="margin-bottom:8px;">Rolls initiative for everyone currently active in the Party and Enemies tabs, all at once, and lines up the turn order. The ability-score bonus is automatic, and so is any bonus from an equipped item marked with an initiative bonus in that character's Inventory (a "+2 gear" tag shows up below when that applies). Anything else — a feat, a class feature not tied to an item — goes in the bonus box (roll with Advantage/Disadvantage there too, for things like a barbarian's danger sense). If someone's caught off guard this round — an ambush, a failed group sneak — check "surprised": they still get a place in line, but skip acting or reacting until their second turn.</div>
      ${rows || '<div class="empty-note">No active party members or enemies to roll for yet — check the Party and Enemies tabs.</div>'}
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" data-action="roll-battle-initiative">🎲 Roll Battle Initiative</button>
        ${anyRolled ? `<button class="btn" data-action="clear-battle-initiative">Clear Order</button>` : ''}
        ${anyRolled && !combatActive ? `<button class="btn primary" data-action="start-combat">▶ Start Combat</button>` : ''}
        ${combatActive ? `<span class="hint" style="align-self:center;">Combat is running — use the bar up top to step through turns.</span>` : ''}
      </div>
      ${anyRolled ? `<div class="roll-log" style="margin-top:12px;">${resultRows}</div><div class="hint" style="margin-top:6px;">Ties are broken by the higher DEX modifier.</div>` : ''}
    </div>
  `;
}

// ---- Battle Console (Dice Roller tab, only shown once combat is actually running) ----
// A single place to see and act on whoever's turn it currently is, without hopping to the Party or
// Enemies tab — HP, AC, action economy, and every attack/spell they can take right now. Every button
// here dispatches the exact same data-action handlers as the Party/Enemies sheets (roll-weapon-attack,
// cast-spell, roll-attack, hp-step/enemy-hp-step) and reuses their render helpers (renderCastControls,
// renderWeaponAttackRow, renderEnemyAttackRow) — this file only adds a compact *view* onto the same
// state and the same business logic, never a second copy of either. The full sheet (skills, feats,
// conditions, inventory editing) still lives on those tabs, same as before.

function renderBattleConsole(){
  const c = state.campaign;
  if(!c.combat) return '';
  const cur = currentCombatRef(c);
  if(!cur) return '';
  const { kind, ref } = cur;
  const idx = kind==='pc' ? c.characters.indexOf(ref) : c.enemies.indexOf(ref);
  const aliveEnemies = (c.enemies||[]).filter(en=>en.status==='alive');

  const ac = kind==='pc' ? effectiveAC(ref) : ref.ac;
  const hpPct = Math.max(0, Math.min(100, (ref.hp.current/Math.max(1,ref.hp.max))*100));
  const hpColor = hpPct<25?'var(--ember)':(hpPct<60?'var(--brass)':'var(--moss)');
  const hpAction = kind==='pc' ? 'hp-step' : 'enemy-hp-step';

  const actionChip = (label, used, action)=>`
    <button class="btn ${used?'danger':'primary'}" data-action="${action}" title="Auto-marked when this ${kind==='pc'?'character':'enemy'} attacks or casts — click to correct it by hand (e.g. Extra Attack, an off-turn reaction, or a feature that doesn't cost the normal action).">
      ${label}: ${used ? '✓ used' : 'available'}
    </button>`;

  const body = kind==='pc' ? renderBattleConsolePc(ref, idx, aliveEnemies) : renderBattleConsoleEnemy(ref, idx);

  return `
    <div class="card" style="border-color:var(--brass);">
      <h3>⚔ ${escapeHtml(ref.name)}'s turn <span class="hint" style="display:inline;">(${kind==='pc'?'party':'enemy'} · round ${c.combat.round})</span></h3>
      <div class="row" style="align-items:center;flex-wrap:wrap;">
        <div class="col" style="max-width:220px;">
          <label>HP</label>
          <div class="hp-row">
            <button class="step-btn dmg" data-action="${hpAction}" data-idx="${idx}" data-amt="-1">−</button>
            <strong style="font-family:var(--font-mono);white-space:nowrap;">${ref.hp.current}/${ref.hp.max}${ref.hp.temp?'+'+ref.hp.temp:''}</strong>
            <button class="step-btn heal" data-action="${hpAction}" data-idx="${idx}" data-amt="1">+</button>
          </div>
          <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${hpPct}%;background:${hpColor};"></div></div>
        </div>
        <div class="col" style="max-width:70px;"><label>AC</label><strong style="font-family:var(--font-mono);color:var(--brass);">${ac}</strong></div>
        <div class="col" style="flex:none;">
          <label>Action economy</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${actionChip('Action', ref.actionUsed, 'toggle-current-action')}
            ${actionChip('Bonus Action', ref.bonusActionUsed, 'toggle-current-bonus-action')}
          </div>
        </div>
      </div>
      ${body}
    </div>
  `;
}

function renderBattleConsolePc(ch, idx, aliveEnemies){
  ensureCharacterExtras(ch);
  const base = `characters.${idx}`;

  const slotLevels = [1,2,3,4,5,6,7,8,9].filter(lv=>(ch.spellcasting.slots[lv]||{}).max>0);
  const slotSummary = slotLevels.length
    ? slotLevels.map(lv=>{ const s = ch.spellcasting.slots[lv]; return `<span class="hint" style="font-family:var(--font-mono);margin-right:10px;">Lv${lv} ${s.current}/${s.max}</span>`; }).join('')
    : `<span class="hint">No spell slots.</span>`;

  const weaponRows = ch.inventory.map((it,i)=>{
    ensureItemAtkFields(it);
    const row = renderWeaponAttackRow(ch, idx, it, i, aliveEnemies);
    if(!row) return '';
    return `<div class="item-row" style="flex-wrap:wrap;"><strong style="flex-basis:100%;">${escapeHtml(it.name)}</strong>${row}</div>`;
  }).join('');

  const knownSpellRows = ch.spells.map((sp,i)=>{
    ensureSpellCastFields(sp);
    const meta = sp.index ? (state.srdSpellIndex||[]).find(s=>s.index===sp.index) : null;
    const statLine = spellStatLine(meta);
    return `<div class="spell-row" style="flex-wrap:wrap;">
      <span style="flex:1;min-width:100px;">${escapeHtml(sp.name)} <span class="hint" style="display:inline;">Lv${sp.level}</span></span>
      ${statLine ? `<div class="hint" style="flex-basis:100%;color:var(--brass-dim);font-family:var(--font-mono);">${escapeHtml(statLine)}</div>` : ''}
      ${renderCastControls(ch, idx, sp, meta, 'known', `${base}.spells.${i}`, `data-source="known" data-spell-idx="${i}"`, aliveEnemies)}
    </div>`;
  }).join('');

  const grantedSpellRows = allGrantedSpellsWithPaths(ch).map(({sourceType,sourceId,sourceName,spell:gs,path})=>{
    ensureSpellCastFields(gs);
    const meta = gs.index ? (state.srdSpellIndex||[]).find(s=>s.index===gs.index) : null;
    const statLine = spellStatLine(meta);
    const icon = sourceType==='feat' ? '⭐' : '🔮';
    return `<div class="spell-row" style="flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line);">
      <span style="flex:1;min-width:100px;">${icon} ${escapeHtml(gs.name)} <span class="hint" style="display:inline;">Lv${gs.level}</span></span>
      ${statLine ? `<div class="hint" style="flex-basis:100%;color:var(--brass-dim);font-family:var(--font-mono);">${escapeHtml(statLine)}</div>` : ''}
      ${renderCastControls(ch, idx, gs, meta, sourceType, `${base}.${path}`, `data-source="${sourceType}" data-source-id="${sourceId}" data-spell-id="${gs.id}"`, aliveEnemies)}
    </div>`;
  }).join('');

  const nothingToShow = !weaponRows && !knownSpellRows && !grantedSpellRows;

  return `
    <div class="hint" style="margin:8px 0;">Spell slots: ${slotSummary}</div>
    ${weaponRows ? `<label style="margin-top:6px;">Equipped weapons</label>${weaponRows}` : ''}
    ${(knownSpellRows || grantedSpellRows) ? `<label style="margin-top:6px;">Spells</label>${knownSpellRows}${grantedSpellRows}` : ''}
    ${nothingToShow ? '<div class="empty-note">No equipped weapons or known spells yet — add some on the Party tab.</div>' : ''}
    <div class="hint" style="margin-top:8px;">Full sheet, skills, conditions, and inventory editing are on the Party tab.</div>
  `;
}

// Always-visible (not gated on active combat) quick-glance strip of every party member's and
// enemy's HP, so a quick "who's actually hurt" check doesn't require leaving the Dice Roller tab.
// Clicking a chip jumps straight to that character/enemy's full sheet, same as clicking it in its
// own tab's chip row — a shortcut on top of the same select-char/select-enemy state, not a new copy.
function renderCombatantHpStrip(){
  const c = state.campaign;
  if(!c.characters.length && !c.enemies.length) return '';
  const curTurn = c.combat ? currentCombatRef(c) : null;
  const chip = (kind, ref)=>{
    const isCurrent = curTurn && curTurn.kind===kind && curTurn.id===ref.id;
    const cls = kind==='pc' ? 'char-chip' : 'char-chip enemy-chip';
    return `<div class="${cls} status-${ref.status}" data-action="${kind==='pc'?'jump-to-char':'jump-to-enemy'}" data-id="${ref.id}" style="cursor:pointer;${isCurrent?'box-shadow:inset 0 0 0 2px var(--brass);':''}">
      <span>${escapeHtml(ref.name)}</span>
      <span class="hp-tag">${ref.hp.current}/${ref.hp.max}${ref.hp.temp?('+'+ref.hp.temp):''}</span>
    </div>`;
  };
  return `
    <div class="card">
      <h3>Party &amp; Enemy HP</h3>
      <div class="char-chips" style="margin-bottom:0;">
        ${c.characters.map(ch=>chip('pc', ch)).join('')}
        ${c.enemies.map(en=>chip('enemy', en)).join('')}
      </div>
    </div>
  `;
}

function renderBattleConsoleEnemy(en, idx){
  const attackRows = (en.attacks||[]).map((atk,i)=>renderEnemyAttackRow(en, idx, atk, i)).join('');
  ensureLegendaryFields(en);
  const legendaryHint = en.legendaryActionsMax>0
    ? `<div class="hint" style="margin-top:8px;">Legendary actions used: <strong style="color:${(en.legendaryActionsUsed||0)>=en.legendaryActionsMax?'var(--ember)':'var(--brass)'};">${en.legendaryActionsUsed||0}/${en.legendaryActionsMax}</strong> — spend or reset them on the Enemies tab.</div>`
    : '';

  return `
    <label style="margin-top:8px;">Attacks</label>
    ${attackRows || '<div class="empty-note">No attacks defined — add some on the Enemies tab.</div>'}
    ${legendaryHint}
    <div class="hint" style="margin-top:8px;">Full stat block, traits, and conditions are on the Enemies tab.</div>
  `;
}

function onBindChange(e){
  const el = e.target;
  const path = el.dataset.bind;
  const type = el.dataset.type;
  scheduleAutosave();
  if(state.armedAction) state.armedAction = null; // editing anything else cancels a pending delete confirm
  if(type==='abilitybonus'){
    const keys = path.split('.'); // characters.<idx>.abilityBonusChoice.plus2|plus1
    const cIdx = Number(keys[1]);
    const slot = keys[3];
    const ch = state.campaign.characters[cIdx];
    ensureAbilityBonusChoice(ch);
    ch.abilityBonusChoice[slot] = el.value || null;
    render();
    return;
  }
  if(type==='featability'){
    const keys = path.split('.'); // characters.<idx>.feats.<i>.abilityChoice.selected
    const cIdx = Number(keys[1]);
    const fIdx = Number(keys[3]);
    const ch = state.campaign.characters[cIdx];
    const feat = ch.feats[fIdx];
    feat.abilityChoice.selected = el.value || null;
    if(feat.abilityChoice.grantsSaveProf && feat.abilityChoice.selected){
      ch.savingThrowProfs[feat.abilityChoice.selected] = true;
    }
    render();
    return;
  }
  if(type==='baseability'){
    const keys = path.split('.'); // characters.<idx>.baseAbilities.<key>
    const cIdx = Number(keys[1]);
    const abilKey = keys[3];
    const ch = state.campaign.characters[cIdx];
    const raw = Math.max(8, Math.min(15, Number(el.value)||8));
    let spent = 0;
    ABILITY_KEYS.forEach(k=>{ spent += POINT_BUY_COST[k===abilKey ? raw : ch.baseAbilities[k]] ?? 0; });
    if(spent > POINT_BUY_BUDGET){
      showToast('Not enough points left — lower another score first');
      render(); // re-render reverts the input to the last valid value
      return;
    }
    ch.baseAbilities[abilKey] = raw;
    render();
    return;
  }
  if(type==='rechargeslot'){
    // enemies.<idx>.attacks.<i>.recharge — blank means "no recharge, at-will". Editing the
    // threshold also resets availability to true, since changing it mid-fight is a build tweak,
    // not a "the attack just got used" event.
    const val = el.value==='' ? null : Math.max(1, Math.min(6, Number(el.value)||6));
    setPath(state.campaign, path, val);
    setPath(state.campaign, path.replace(/\.recharge$/, '.rechargeAvailable'), true);
    render();
    return;
  }
  if(type==='target'){
    // enemies.<idx>.attacks.<i>.__target — a synthetic field, not a real one: the select's value
    // is "pc:ID" / "npc:ID" / "", parsed here into the two real fields (targetKind/targetId) that
    // actually live on the attack.
    const basePath = path.replace(/\.__target$/, '');
    const val = el.value;
    if(!val){
      setPath(state.campaign, basePath+'.targetKind', null);
      setPath(state.campaign, basePath+'.targetId', null);
    } else {
      const sep = val.indexOf(':');
      setPath(state.campaign, basePath+'.targetKind', val.slice(0,sep));
      setPath(state.campaign, basePath+'.targetId', val.slice(sep+1));
    }
    render();
    return;
  }
  let value;
  if(type==='number') value = el.value===''? 0 : Number(el.value);
  else if(type==='checkbox') value = el.checked;
  else value = el.value;
  setPath(state.campaign, path, value);
  // Typing a positive HP value directly (not just using the +/- stepper) should also clear death
  // saves — regaining any HP resets them regardless of how the HP got there.
  const hpMatch = path.match(/^characters\.(\d+)\.hp\.current$/);
  if(hpMatch && value > 0){
    const ch = state.campaign.characters[Number(hpMatch[1])];
    if(ch){ ensureCharacterExtras(ch); ch.deathSaves = { successes:0, failures:0 }; }
  }
  // don't full re-render on plain text/number edits to avoid disrupting flow;
  // but re-render when it affects computed display (abilities, hp, status, level)
  if(/abilities|hp\.|status$|level$|spellcasting|initiative|surprised$|equipped$|bonuses\.|asiBonuses|feats\.|grantsSpells\.|skillProfs\.|deathSaves|weight$|legendaryActionsMax|hasCombatStats|attackType|castAtLevel$|atkAbility$|atkProficient$|saveBonus$/.test(path)){
    render();
  }
}

async function onClick(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const c = state.campaign;

  // First click on a confirm-guarded action just arms it and stops here; the matching handler
  // below only runs once the same button is clicked again inside the confirm window.
  if(CONFIRM_ACTIONS.has(action)){
    const key = armKeyFor(action, btn.dataset.idx ?? btn.dataset.id);
    if(!isArmed(action, btn.dataset.idx ?? btn.dataset.id)){
      state.armedAction = { key, armedAt: Date.now() };
      render();
      return;
    }
    state.armedAction = null;
  } else if(state.armedAction){
    state.armedAction = null; // clicking anything else cancels a pending confirm
  }
  scheduleAutosave();

  if(action==='set-tab'){ state.activeTab = btn.dataset.tab; render(); }

  else if(action==='select-char'){ state.activeCharId = btn.dataset.id; render(); }
  else if(action==='jump-to-char'){ state.activeTab = 'party'; state.activeCharId = btn.dataset.id; render(); }
  else if(action==='jump-to-enemy'){ state.activeTab = 'enemies'; state.activeEnemyId = btn.dataset.id; render(); }

  else if(action==='add-char'){
    const ch = blankCharacter('New Adventurer');
    c.characters.push(ch);
    state.activeCharId = ch.id;
    render();
  }

  else if(action==='remove-char'){
    const idx = Number(btn.dataset.idx);
    const removed = c.characters[idx];
    await saveSnapshotSilent('(auto) before removing '+(removed?.name||'character'));
    c.characters.splice(idx,1);
    state.activeCharId = c.characters.length ? c.characters[0].id : null;
    showToast('Character removed (safety snapshot saved first)');
    render();
  }

  else if(action==='hp-step'){
    const idx = Number(btn.dataset.idx);
    const amt = Number(btn.dataset.amt);
    const ch = c.characters[idx];
    ch.hp.current = Math.max(0, Math.min(ch.hp.max, ch.hp.current + amt));
    if(ch.hp.current > 0){ ensureCharacterExtras(ch); ch.deathSaves = { successes:0, failures:0 }; }
    render();
  }

  else if(action==='short-rest'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    const diceInput = document.getElementById('shortRestDice-'+idx);
    const spend = Math.max(0, Math.min(ch.hitDice.current, Number(diceInput ? diceInput.value : 0) || 0));
    let healed = 0;
    if(spend>0){
      const dieSides = parseInt(String(ch.hitDice.die||'d8').replace(/[^\d]/g,''),10) || 8;
      const conMod = abilityMod(ch.abilities.con);
      for(let i=0;i<spend;i++){
        const roll = 1+Math.floor(Math.random()*dieSides);
        healed += Math.max(0, roll+conMod);
      }
      ch.hitDice.current -= spend;
      ch.hp.current = Math.min(ch.hp.max, ch.hp.current + healed);
      if(ch.hp.current > 0){ ensureCharacterExtras(ch); ch.deathSaves = { successes:0, failures:0 }; }
      state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — short rest (${spend}x ${ch.hitDice.die})`, total: healed, breakdown: `${spend}x d${dieSides} ${fmtMod(conMod)} each` });
      persistDiceLog();
    }
    resetGrantedSpellUsesByCadence(ch, 'short rest');
    if(ch.classIndex==='warlock') resetSpellSlotsCurrent(ch);
    showToast(spend>0 ? `${ch.name} spends ${spend} hit dice, heals ${healed} HP.` : `${ch.name} takes a short rest — short-rest resources refreshed.`);
    render();
  }

  else if(action==='toggle-death-success'){
    const idx = Number(btn.dataset.idx), pos = Number(btn.dataset.pos);
    const ch = c.characters[idx];
    ensureCharacterExtras(ch);
    ch.deathSaves.successes = (ch.deathSaves.successes === pos+1) ? pos : pos+1;
    render();
  }
  else if(action==='toggle-death-failure'){
    const idx = Number(btn.dataset.idx), pos = Number(btn.dataset.pos);
    const ch = c.characters[idx];
    ensureCharacterExtras(ch);
    ch.deathSaves.failures = (ch.deathSaves.failures === pos+1) ? pos : pos+1;
    if(ch.deathSaves.failures>=3 && ch.status!=='dead'){ ch.status='dead'; showToast(`${ch.name} has died.`); }
    render();
  }
  else if(action==='roll-death-save'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    ensureCharacterExtras(ch);
    const roll = 1+Math.floor(Math.random()*20);
    let msg;
    if(roll===20){
      ch.hp.current = 1;
      ch.deathSaves = { successes:0, failures:0 };
      if(ch.status==='unconscious') ch.status = 'alive';
      msg = `${ch.name} rolled a natural 20 on their death save — regains 1 HP and wakes up!`;
    } else if(roll===1){
      ch.deathSaves.failures = Math.min(3, ch.deathSaves.failures+2);
      msg = `${ch.name} rolled a natural 1 — that's two failures (${ch.deathSaves.failures}/3).`;
    } else if(roll>=10){
      ch.deathSaves.successes = Math.min(3, ch.deathSaves.successes+1);
      msg = `${ch.name} rolled ${roll} — success (${ch.deathSaves.successes}/3).`;
    } else {
      ch.deathSaves.failures = Math.min(3, ch.deathSaves.failures+1);
      msg = `${ch.name} rolled ${roll} — failure (${ch.deathSaves.failures}/3).`;
    }
    if(ch.deathSaves.failures>=3 && roll!==20){ ch.status='dead'; msg += ' Three failures — they have died.'; }
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — death save`, total: roll, breakdown: `d20 ${roll}` });
    persistDiceLog();
    showToast(msg);
    render();
  }

  else if(action==='clear-concentration'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    ensureCharacterExtras(ch);
    ch.concentratingOn = '';
    render();
  }
  else if(action==='roll-concentration-check'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    ensureCharacterExtras(ch);
    const dmgInput = document.getElementById('concDamage-'+idx);
    const dmg = Math.max(0, Number(dmgInput ? dmgInput.value : 0) || 0);
    const dc = Math.max(10, Math.floor(dmg/2));
    const conMod = abilityMod(ch.abilities.con);
    const prof = ch.savingThrowProfs.con ? profBonus(ch.level) : 0;
    const warCaster = hasFeat(ch, 'war-caster');
    let roll, rollDetail;
    if(warCaster){

      id: uid('roll'), timestamp: Date.now(),

      showToast(`${ch.name} loses concentration${ch.concentratingOn?' on '+ch.concentratingOn:''} — rolled ${total} vs DC ${dc}.`);

  else if(action==='add-custom-spell'){

  else if(action==='cast-spell'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    const source = btn.dataset.source; // 'known' | 'item' | 'feat'
    let sp, consumeResource, resourceLabel;
    if(source==='known'){
      const si = Number(btn.dataset.spellIdx);
      sp = ch.spells[si];
      if(!sp) return;
      ensureSpellCastFields(sp);
      if((sp.level||0) > 0){
        const slot = ch.spellcasting.slots[sp.castAtLevel];
        if(!slot || slot.current<=0){ showToast(`No level ${sp.castAtLevel} slots remaining.`); return; }
        consumeResource = ()=>{ slot.current -= 1; };
        resourceLabel = `spends a level ${sp.castAtLevel} slot`;
      } else {
        consumeResource = ()=>{};
        resourceLabel = 'at-will cantrip';
      }
    } else {
      const holders = source==='feat' ? (ch.feats||[]) : (ch.inventory||[]);
      const holder = holders.find(h=>h.id===btn.dataset.sourceId);
      if(!holder) return;
      sp = (holder.grantsSpells||[]).find(g=>g.id===btn.dataset.spellId);
      if(!sp) return;
      ensureSpellCastFields(sp);
      if(!sp.atWill && (sp.usesCurrent||0)<=0){ showToast(`No uses of ${sp.name} left.`); return; }
      consumeResource = ()=>{ if(!sp.atWill) sp.usesCurrent = Math.max(0, sp.usesCurrent-1); };
      resourceLabel = sp.atWill ? 'at-will' : `spends a charge (${holder.name})`;
    }

    const meta = sp.index ? (state.srdSpellIndex||[]).find(s=>s.index===sp.index) : null;
    const castLevel = (sp.level||0) > 0 ? (Number(sp.castAtLevel)||sp.level) : 0;
    let target = null, targetLabel = '';
    if(sp.targetKind==='enemy' && sp.targetId){
      target = c.enemies.find(x=>x.id===sp.targetId);
      if(target) targetLabel = target.name;
    }
    if(target && target.status!=='alive'){
      showToast(`${target.name} is already down — pick a new target.`);
      return;
    }

    const bonus = spellAttackBonus(ch), dc = spellSaveDC(ch);
    if(bonus===null){ showToast(`${ch.name} has no spellcasting ability set (see Spellcasting card).`); return; }

    // Every remaining path below actually completes the cast — mark action economy once here rather
    // than at each of the branches' individual consumeResource() calls. Bonus-action spells (e.g.
    // Healing Word) are read from the SRD castingTime field; anything without SRD data (homebrew/
    // custom spells) defaults to the Action, same as a normal attack.
    markTurnActionUsed(c, ch, !!(meta && meta.castingTime && meta.castingTime.includes('bonus action')));

    const dmgFormula = spellDamageForCast(meta, castLevel, ch.level);
    const hasSave = !!(meta && meta.saveAbility);

    if(!meta || (!hasSave && !dmgFormula)){
      // No SRD metadata, or a known utility/buff spell with nothing to auto-roll — just spend the
      // resource and log the cast.
      consumeResource();
      if(meta && meta.concentration) ch.concentratingOn = sp.name;
      showToast(`${ch.name} casts ${sp.name} (${resourceLabel}).`);
      render();
      return;
    }

    if(hasSave){
      let saveTotal=null, passed=null;
      if(target){
        const roll = 1+Math.floor(Math.random()*20);
        const tgtMod = abilityMod(target.abilities[meta.saveAbility]);
        const tgtBonus = target.saveBonus||0;
        saveTotal = roll+tgtMod+tgtBonus;
        passed = saveTotal >= dc;
        state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${targetLabel} — save vs ${ch.name}'s ${sp.name} (DC ${dc})`, total: saveTotal, breakdown: `d20 ${roll} ${fmtMod(tgtMod)} ${meta.saveAbility.toUpperCase()}${tgtBonus?(' '+fmtMod(tgtBonus)+' bonus'):''}` });
      }
      let dmgTotal = 0;
      if(dmgFormula){
        dmgTotal = rollDiceFormula(dmgFormula);
        state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — ${sp.name} (damage${meta.damageType?' · '+meta.damageType:''})`, total: dmgTotal, breakdown: dmgFormula });
      }
      consumeResource();
      if(meta.concentration) ch.concentratingOn = sp.name;
      if(target && dmgTotal>0){
        let applied = dmgTotal;
        if(passed) applied = meta.saveEffect==='half' ? Math.floor(dmgTotal/2) : 0;
        let died = false;
        if(applied>0) died = applyDamageToTarget(target, 'enemy', applied).died;
        if(died){
          advanceIfCurrentTurnDied(c, target);
          showToast(`${targetLabel} is slain by ${sp.name}!`);
        } else {
          showToast(`${targetLabel} ${passed?'succeeds':'fails'} the save${applied>0?` — takes ${applied} damage`:(passed?' — no damage':' — effect per spell text, no damage auto-applied')}.`);
        }
      } else {
        showToast(`${ch.name} casts ${sp.name} (${resourceLabel}).`);
      }
      persistDiceLog();
      render();
      return;
    }

    // Spell attack roll (no saveAbility, but has structured damage — e.g. Fire Bolt, Eldritch Blast, Guiding Bolt).
    const { d20, detail } = rollD20Mode(state.adv);
    const attackTotal = d20 + bonus;
    let isHit = null, hitNote = '';
    if(target){
      isHit = attackTotal >= (target.ac||10);
      hitNote = ` vs ${targetLabel}'s AC ${target.ac} — ${isHit?'HIT':'MISS'}`;

    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — ${sp.name} (spell attack${hitNote})`, total: attackTotal, breakdown: `${detail} ${fmtMod(bonus)}` });
    consumeResource();
    if(meta.concentration) ch.concentratingOn = sp.name;
    if(isHit===false){
      showToast(`${sp.name} misses ${targetLabel}.`);
      persistDiceLog();
      render();
      return;
    }
    const dmgTotal = rollDiceFormula(dmgFormula);
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — ${sp.name} (damage${meta.damageType?' · '+meta.damageType:''})`, total: dmgTotal, breakdown: dmgFormula });
    if(target){
      const { died } = applyDamageToTarget(target, 'enemy', dmgTotal);
      if(died) advanceIfCurrentTurnDied(c, target);
      showToast(died ? `${targetLabel} is slain by ${sp.name}!` : `${targetLabel} takes ${dmgTotal} damage.`);

    if(isHit===false){
      showToast(`${it.name||'Attack'} misses ${targetLabel}.`);
      persistDiceLog();
      render();
      return;
    }
    const dmgMod = abilityMod(ch.abilities[abilityKey]);
    const dmgFormula = parsed.damage + (dmgMod ? (dmgMod>0?'+':'')+dmgMod : '');
    const dmgTotal = rollDiceFormula(dmgFormula);
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${ch.name} — ${it.name||'weapon'} (damage${parsed.damageType?' · '+parsed.damageType:''})`, total: dmgTotal, breakdown: dmgFormula });

    const hpGain = computeLevelUpHpGain(ch);

    let toastMsg = `Level ${ch.level}! +${hpGain} HP`;
    if(slotsApplied) toastMsg += ', spell slots updated';
    if(getAsiLevels(ch.classIndex).includes(ch.level) && !ch.asiLevelsUsed.includes(ch.level)){
      state.levelUpPicker = { charIdx: idx, level: ch.level, mode:'choose', asiSplit:false };
      toastMsg += ' — ASI/feat available below';
    }
    showToast(toastMsg);
    render();
  }
  else if(action==='levelup-mode'){
    if(!state.levelUpPicker) return;
    state.levelUpPicker.mode = btn.dataset.mode;
    state.levelUpPicker.asiSplit = false;
    render();
  }
  else if(action==='levelup-asi-split'){
    if(!state.levelUpPicker) return;
    state.levelUpPicker.asiSplit = btn.dataset.split === '1';
    render();
  }
  else if(action==='confirm-asi'){
    const picker = state.levelUpPicker;
    if(!picker) return;
    const ch = c.characters[picker.charIdx];
    ensureLevelingFields(ch);
    const aSel = document.getElementById('asiSelectA');
    const bSel = document.getElementById('asiSelectB');
    const a = aSel ? aSel.value : '';
    const b = picker.asiSplit && bSel ? bSel.value : '';
    if(!a || (picker.asiSplit && (!b || b===a))){
      showToast(picker.asiSplit ? 'Pick two different abilities' : 'Pick an ability');
      return;
    }
    if(picker.asiSplit){
      ch.asiBonuses[a] = (ch.asiBonuses[a]||0) + 1;
      ch.asiBonuses[b] = (ch.asiBonuses[b]||0) + 1;
    } else {
      ch.asiBonuses[a] = (ch.asiBonuses[a]||0) + 2;
    }
    ch.plainAsiPicks = (ch.plainAsiPicks||0) + 1;
    ch.asiLevelsUsed.push(picker.level);
    state.levelUpPicker = null;
    showToast('Ability Score Improvement applied');
    render();
  }
  else if(action==='pick-levelup-feat'){
    const picker = state.levelUpPicker;
    if(!picker) return;
    const ch = c.characters[picker.charIdx];
    addFeatToCharacter(ch, btn.dataset.featKey, picker.level);
    ch.asiLevelsUsed.push(picker.level);
    state.levelUpPicker = null;
    render();
  }
  else if(action==='skip-levelup-choice'){
    state.levelUpPicker = null;
    render();
  }
  else if(action==='autofill-slots'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    const applied = applySpellSlotsForLevel(ch);
    showToast(applied ? `Spell slots updated for level ${ch.level}` : "This class's slots aren't auto-tracked here — edit them manually below");
    render();
  }
  else if(action==='add-feat'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    if(featSlotsUsed(ch) >= featSlotsEarned(ch)){
      showToast(`No feat/ASI slots left at level ${ch.level} — ${featSlotsUsed(ch)}/${featSlotsEarned(ch)} already used. Level up further, or remove one to swap it.`);
      return;
    }
    addFeatToCharacter(ch, btn.dataset.featKey, ch.level);
    const searchInput = document.querySelector(`[data-feat-search="${idx}"]`);
    if(searchInput) searchInput.value = '';
    const resultsDiv = document.getElementById('featResults-'+idx);
    if(resultsDiv){ resultsDiv.innerHTML=''; resultsDiv.classList.remove('open'); }
    render();
  }
  else if(action==='add-custom-feat'){
    const idx = Number(btn.dataset.idx);
    const ch = c.characters[idx];
    if(featSlotsUsed(ch) >= featSlotsEarned(ch)){
      showToast(`No feat/ASI slots left at level ${ch.level} — ${featSlotsUsed(ch)}/${featSlotsEarned(ch)} already used. Level up further, or remove one to swap it.`);
      return;
    }
    addFeatToCharacter(ch, '__custom', ch.level);
    render();
  }
  else if(action==='remove-feat'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    c.characters[idx].feats.splice(item,1);
    render();
  }

  else if(action==='select-enemy'){ state.activeEnemyId = btn.dataset.id; render(); }

  else if(action==='spawn-preset'){
    const sel = document.getElementById('presetSelect');
    const qtyInput = document.getElementById('presetQty');
    const preset = MONSTER_PRESETS.find(p=>p.key===sel.value);
    if(!preset) return;
    const qty = Math.max(1, Math.min(30, Number(qtyInput.value)||1));
    state.enemyQty = qty;
    const existingOfType = c.enemies.filter(en=>en.presetKey===preset.key).length;
    let lastId = null;
    for(let i=1;i<=qty;i++){
      const label = qty>1 || existingOfType>0 ? `${preset.name} ${existingOfType+i}` : preset.name;
      const en = enemyFromPreset(preset, label);
      c.enemies.push(en);
      lastId = en.id;
    }
    state.activeEnemyId = lastId;
    render();
  }

  else if(action==='add-custom-enemy'){
    const en = blankEnemy('New Enemy');
    c.enemies.push(en);
    state.activeEnemyId = en.id;
    render();
  }

  else if(action==='remove-enemy'){
    const idx = Number(btn.dataset.idx);
    c.enemies.splice(idx,1);
    state.activeEnemyId = c.enemies.length ? c.enemies[0].id : null;
    render();
  }

  else if(action==='clear-enemies'){
    await saveSnapshotSilent('(auto) before clearing enemies');
    c.enemies = [];
    state.activeEnemyId = null;
    showToast('Enemies cleared (safety snapshot saved first)');
    render();
  }

  else if(action==='copy-enemy-prompt'){
    const block = "Generate D&D 5e enemies for my tracker.\n\n" + ENEMY_IMPORT_SCHEMA_DOC +
      "\n\nRequest: [describe how many enemies, what kind/theme, and roughly what level or CR they should challenge — replace this line before sending]";
    copyToClipboard(block);
    showToast('Copied — paste into a Claude chat and fill in your request');
  }

  else if(action==='import-enemies-json'){
    const area = document.getElementById('enemyJsonImportArea');
    const raw = area ? area.value.trim() : '';
    if(!raw){ showToast('Paste some enemy JSON first'); return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ showToast('Not valid JSON — check for stray text outside the [ ] brackets'); return; }
    const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.enemies) ? parsed.enemies : null);
    if(!list){ showToast('Expected a JSON array of enemies (or {"enemies":[...]})'); return; }
    if(!list.length){ showToast('That array is empty'); return; }
    await saveSnapshotSilent('(auto) before enemy import');
    const added = list.map((obj,i)=>enemyFromImportObject(obj,i));
    c.enemies.push(...added);
    state.activeEnemyId = added[added.length-1].id;
    await persistCurrent();
    if(area) area.value = '';
    showToast(`Added ${added.length} enem${added.length===1?'y':'ies'} (safety snapshot saved first)`);
    render();
  }

  else if(action==='enemy-hp-step'){
    const idx = Number(btn.dataset.idx);
    const amt = Number(btn.dataset.amt);
    const en = c.enemies[idx];
    en.hp.current = Math.max(0, Math.min(en.hp.max, en.hp.current + amt));
    if(en.hp.current===0 && en.status==='alive') en.status = 'dead';
    render();
  }

  else if(action==='roll-enemy-initiative'){
    const idx = Number(btn.dataset.idx);
    applyInitiativeRoll(c.enemies[idx]);
    render();
  }
  else if(action==='roll-all-initiative'){
    c.enemies.forEach(applyInitiativeRoll);
    state.enemySort = 'initiative';
    render();
  }
  else if(action==='toggle-enemy-sort'){
    state.enemySort = state.enemySort==='initiative' ? 'added' : 'initiative';
    render();
  }

  else if(action==='roll-char-initiative'){
    const idx = Number(btn.dataset.idx);
    applyInitiativeRoll(c.characters[idx]);
    render();
  }

  else if(action==='roll-battle-initiative'){
    const combatants = [
      ...c.characters.filter(ch=>['alive','unconscious'].includes(ch.status)),
      ...c.enemies.filter(en=>en.status==='alive')
    ];
    combatants.forEach(applyInitiativeRoll);
    render();
  }
  else if(action==='clear-battle-initiative'){
    c.characters.forEach(ch=>{ ch.initiative = null; });
    c.enemies.forEach(en=>{ en.initiative = null; });
    state.battleInitBreakdown = {};
    render();
  }

  else if(action==='start-combat'){
    const ordered = computeInitiativeOrder(c);
    if(!ordered.length){ showToast('Roll initiative for at least one combatant first.'); return; }
    onNewCombatRound(c); // fresh fight, fresh legendary-action pools
    c.combat = { round: 1, turnIndex: 0, order: ordered.map(({kind,ref})=>({id:ref.id, kind, name:ref.name})) };
    resetActionEconomy(ordered[0].ref);
    showToast(`Combat started — round 1, ${ordered[0].ref.name}'s turn.`);
    render();
  }
  else if(action==='next-turn'){ advanceCombatTurn(c, 1); render(); }
  else if(action==='prev-turn'){ advanceCombatTurn(c, -1); render(); }
  else if(action==='toggle-current-action'){
    const cur = currentCombatRef(c);
    if(cur) cur.ref.actionUsed = !cur.ref.actionUsed;
    render();
  }
  else if(action==='toggle-current-bonus-action'){
    const cur = currentCombatRef(c);
    if(cur) cur.ref.bonusActionUsed = !cur.ref.bonusActionUsed;
    render();
  }
  else if(action==='end-combat'){ c.combat = null; render(); }

  else if(action==='add-enemy-attack'){
    const idx = Number(btn.dataset.idx);
    c.enemies[idx].attacks.push({id:uid('atk'), name:'', toHit:0, damage:'', damageType:'', notes:'', recharge:null, rechargeAvailable:true});
    render();
  }
  else if(action==='remove-enemy-attack'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    c.enemies[idx].attacks.splice(item,1);
    render();
  }
  else if(action==='roll-attack'){
    const idx = Number(btn.dataset.idx), ai = Number(btn.dataset.atk);
    const en = c.enemies[idx];
    const atk = en.attacks[ai];
    ensureAttackFields(atk);
    if(atk.recharge!=null && !atk.rechargeAvailable){ showToast(`${atk.name||'That attack'} hasn't recharged yet.`); return; }
    markTurnActionUsed(c, en, false); // enemy attacks are treated as the Action, same simplification as PC weapon attacks

    // Resolve the chosen target (if any) to its live character/NPC object.
    let target = null, targetLabel = '';
    if(atk.targetKind && atk.targetId){
      target = atk.targetKind==='pc'
        ? c.characters.find(x=>x.id===atk.targetId)
        : c.npcs.find(x=>x.id===atk.targetId);
      if(target) targetLabel = target.name;
    }

    if(atk.attackType==='save'){
      // Save-based attack (e.g. a spell): target rolls, then damage applies based on the result.
      const dc = Number(atk.saveDC)||10;
      let saveTotal = null, passed = null;
      if(target){
        const roll = 1+Math.floor(Math.random()*20);
        let detail, mod;
        if(atk.targetKind==='pc'){
          mod = abilityMod(target.abilities[atk.saveAbility]);
          const prof = target.savingThrowProfs[atk.saveAbility] ? profBonus(target.level) : 0;
          saveTotal = roll+mod+prof;
          detail = `d20 ${roll} ${fmtMod(mod)} ${atk.saveAbility.toUpperCase()} save${prof?(' '+fmtMod(prof)+' prof'):''}`;
        } else {
          const bonus = target.saveBonus||0;
          saveTotal = roll+bonus;
          detail = `d20 ${roll}${bonus?(' '+fmtMod(bonus)+' (generic NPC bonus, not ability-specific)'):' (no ability scores tracked for NPCs)'}`;
        }
        passed = saveTotal >= dc;
        state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${targetLabel} — save vs ${en.name}'s ${atk.name||'attack'} (DC ${dc})`, total: saveTotal, breakdown: detail });
      }
      const dmgTotal = rollDiceFormula(atk.damage);
      state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${en.name} — ${atk.name||'attack'} (damage${atk.damageType?' · '+atk.damageType:''})`, total: dmgTotal, breakdown: atk.damage||'' });
      if(atk.recharge!=null) atk.rechargeAvailable = false;
      if(target){
        let applied = dmgTotal;
        if(passed){
          if(atk.saveEffect==='half') applied = Math.floor(dmgTotal/2);
          else applied = 0; // 'none', or 'other' — don't guess at a non-damage effect, DM checks notes
        }
        if(applied>0) applyDamageToTarget(target, atk.targetKind, applied);
        showToast(`${targetLabel} ${passed?'succeeds':'fails'} the save${applied>0?` — takes ${applied} damage`:(passed?' — no damage':' — effect per notes, no damage auto-applied')}.`);
      }
      persistDiceLog();
      render();
      return;
    }

    // Attack-roll based (the original behavior) — now checks hit/miss vs a target's AC when one's picked.
    const toHit = Number(atk.toHit)||0;
    const { d20, detail } = rollD20Mode(state.adv);
    const attackTotal = d20 + toHit;
    let isHit = null, hitNote = '';
    if(target){
      const ac = atk.targetKind==='pc' ? effectiveAC(target) : (target.ac||10);
      isHit = attackTotal >= ac;
      hitNote = ` vs ${targetLabel}'s AC ${ac} — ${isHit?'HIT':'MISS'}`;
    }
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${en.name} — ${atk.name||'attack'} (to hit${hitNote})`, total: attackTotal, breakdown: `${detail} ${fmtMod(toHit)}` });
    if(atk.recharge!=null) atk.rechargeAvailable = false;
    if(isHit===false){
      showToast(`${targetLabel} avoids the hit.`);
      persistDiceLog();
      render();
      return;
    }
    const dmgTotal = rollDiceFormula(atk.damage);
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${en.name} — ${atk.name||'attack'} (damage${atk.damageType?' · '+atk.damageType:''})`, total: dmgTotal, breakdown: atk.damage||'' });
    if(target){
      applyDamageToTarget(target, atk.targetKind, dmgTotal);
      showToast(`${targetLabel} takes ${dmgTotal} damage.`);
    }
    persistDiceLog();
    render();
  }
  else if(action==='roll-recharge'){
    const idx = Number(btn.dataset.idx), ai = Number(btn.dataset.atk);
    const en = c.enemies[idx];
    const atk = en.attacks[ai];
    const roll = 1+Math.floor(Math.random()*6);
    const threshold = atk.recharge||6;
    const success = roll >= threshold;
    atk.rechargeAvailable = success;
    state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label: `${en.name} — ${atk.name||'attack'} recharge`, total: roll, breakdown: `d6 ${roll} (needs ${threshold}+)` });
    persistDiceLog();
    showToast(success ? `${atk.name||'It'} recharges!` : `${atk.name||'It'} stays spent.`);
    render();
  }
  else if(action==='add-legendary-action'){
    const idx = Number(btn.dataset.idx);
    const en = c.enemies[idx];
    ensureLegendaryFields(en);
    en.legendaryActions.push({ id: uid('legact'), name:'', desc:'', cost:1 });
    render();
  }
  else if(action==='remove-legendary-action'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    c.enemies[idx].legendaryActions.splice(item,1);
    render();
  }
  else if(action==='use-legendary-action'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    const en = c.enemies[idx];
    const la = en.legendaryActions[item];
    const cost = la.cost||1;
    if((en.legendaryActionsUsed||0) + cost > (en.legendaryActionsMax||0)){ showToast('Not enough legendary actions left this round.'); return; }
    en.legendaryActionsUsed = (en.legendaryActionsUsed||0) + cost;
    showToast(`${en.name} uses ${la.name||'a legendary action'} (${en.legendaryActionsUsed}/${en.legendaryActionsMax} used this round).`);
    render();
  }
  else if(action==='reset-legendary'){
    const idx = Number(btn.dataset.idx);
    c.enemies[idx].legendaryActionsUsed = 0;
    render();
  }
  else if(action==='add-enemy-trait'){
    const idx = Number(btn.dataset.idx);
    c.enemies[idx].traits.push({id:uid('trait'), name:'', desc:''});
    render();
  }
  else if(action==='remove-enemy-trait'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    c.enemies[idx].traits.splice(item,1);
    render();
  }
  else if(action==='add-enemy-condition'){
    const idx = Number(btn.dataset.idx);
    const sel = document.getElementById('enemyCondSelect-'+idx);
    const val = sel ? sel.value : '';
    if(!val) return;
    const en = c.enemies[idx];
    if(val==='__custom'){
      en.conditions.push({id:uid('cond'), conditionIndex:'custom', name:'Custom condition', duration:'', level:null, custom:true});
    } else {
      const meta = (state.srdConditions||[]).find(x=>x.index===val);
      en.conditions.push({id:uid('cond'), conditionIndex:val, name: meta?meta.name:val, duration:'', level: val==='exhaustion'?1:null, custom:false});
    }
    render();
  }
  else if(action==='remove-enemy-condition'){
    const idx = Number(btn.dataset.idx), item = Number(btn.dataset.item);
    c.enemies[idx].conditions.splice(item,1);
    render();
  }

  else if(action==='add-quest'){
    c.questLog.push({id:uid('quest'), title:'', status:'active', notes:''});
    render();
  }
  else if(action==='remove-quest'){
    const item = Number(btn.dataset.item);
    c.questLog.splice(item,1);
    render();
  }

  else if(action==='add-npc'){
    c.npcs.push(blankNpc(''));
    render();
  }
  else if(action==='remove-npc'){
    const item = Number(btn.dataset.item);
    c.npcs.splice(item,1);
    render();
  }

  else if(action==='add-session'){
    const nextNumber = c.sessions.length ? Math.max(...c.sessions.map(s=>s.number||0)) + 1 : (c.sessionNumber||1);
    c.sessions.push({ id: uid('sess'), number: nextNumber, date: c.inGameDate||'', recap:'' });
    render();
  }
  else if(action==='remove-session'){
    const item = Number(btn.dataset.item);
    c.sessions.splice(item,1);
    render();
  }

  else if(action==='roll'){
    const sides = Number(btn.dataset.sides);
    doRoll(1, sides, 0, `d${sides}`);
  }
  else if(action==='roll-custom'){
    const count = Number(document.getElementById('diceCount').value)||1;
    const sides = Number(document.getElementById('diceSides').value)||20;
    const mod = Number(document.getElementById('diceMod').value)||0;
    const label = document.getElementById('diceLabel').value || `${count}d${sides}${mod?fmtMod(mod):''}`;
    doRoll(count, sides, mod, label);
  }
  else if(action==='set-adv'){ state.adv = btn.dataset.adv; render(); }
  else if(action==='clear-dice-log'){ state.diceLog = []; await persistDiceLog(); render(); }

  else if(action==='load-snap'){ await loadSnapshot(btn.dataset.id); }
  else if(action==='delete-snap'){ await deleteSnapshot(btn.dataset.id); }

  else if(action==='copy-export'){
    const json = JSON.stringify(state.campaign, null, 2);
    copyToClipboard(json); showToast('Copied JSON to clipboard');
  }
  else if(action==='copy-ai-prompt'){
    const json = JSON.stringify(state.campaign, null, 2);
    const block = "Here is the current campaign state, using this schema:\n\n" + SCHEMA_DOC +
      "\n\nCurrent state:\n```json\n" + json + "\n```\n\nPick up the session from this state. When you export updated state at a checkpoint, return the full CampaignState as a single fenced json block matching this exact schema, nothing else.";
    copyToClipboard(block); showToast('Copied AI-DM prompt block');
  }
  else if(action==='do-import'){
    const raw = document.getElementById('importArea').value;
    try{
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.characters)) throw new Error('bad shape');
      await saveSnapshotSilent('(auto) before import');
      state.campaign = normalizeCampaign(parsed);
      await persistCurrent();
      showToast('Imported and saved');
      render();
    }catch(err){
      showToast('Import failed — check the JSON');
    }
  }

  else if(action==='save-snapshot'){
    btn.classList.add('stamping');
    setTimeout(()=>btn.classList.remove('stamping'), 350);
    const auto = 'Session ' + c.sessionNumber + ' — ' + fmtDate(Date.now());
    await saveSnapshot(auto);
  }
}

function doRoll(count, sides, mod, label){
  const rolls = [];
  for(let i=0;i<count;i++) rolls.push(1+Math.floor(Math.random()*sides));
  let total, breakdown;
  if(sides===20 && count===1 && state.adv!=='normal'){
    const r2 = 1+Math.floor(Math.random()*20);
    const chosen = state.adv==='adv' ? Math.max(rolls[0],r2) : Math.min(rolls[0],r2);
    total = chosen + mod;
    breakdown = `[${rolls[0]}, ${r2}] ${state.adv==='adv'?'take higher':'take lower'} ${mod?fmtMod(mod):''}`;
  } else {
    const sum = rolls.reduce((a,b)=>a+b,0);
    total = sum + mod;
    breakdown = `[${rolls.join(', ')}]${mod?(' '+fmtMod(mod)):''}`;
  }
  state.diceLog.unshift({ id: uid('roll'), timestamp: Date.now(), label, total, breakdown });
  persistDiceLog();
  render();
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

loadInitial();
loadSrdBundle();
})();
</script>
</body>
