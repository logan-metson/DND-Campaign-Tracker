s, you create illusory creatures in their minds, visible only to them. Each creature in a 30-foot-radius sphere centered on a point of your choice within range must make a wisdom saving throw. On a failed save, a creature becomes frightened for the duration. The illusion calls on the creature's deepest fears, manifesting its worst nightmares as an implacable threat. At the start of each of the frightened creature's turns, it must succeed on a wi","saveAbility":"wis","saveEffect":"none","areaType":"sphere","areaSize":30},{"index":"wind-walk","name":"Wind Walk","level":6,"school":"Transmutation","castingTime":"1 minute","range":"30 feet","duration":"8 hours","concentration":false,"ritual":false,"components":"VSM","desc":"You and up to ten willing creatures you can see within range assume a gaseous form for the duration, appearing as wisps of cloud. While in this cloud form, a creature has a flying speed of 300 feet and has resistance to damage from nonmagical weapons. The only actions a creature can take in this form are the Dash action or to revert to its normal form. Reverting takes 1 minute, during which time a creature is incapacitated and can't move. Until the spell ends, a creature can revert to cloud form"},{"index":"wind-wall","name":"Wind Wall","level":3,"school":"Evocation","castingTime":"1 action","range":"120 feet","duration":"Up to 1 minute","concentration":true,"ritual":false,"components":"VSM","desc":"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration. When the wall appears, each creature within its area must make a strength saving throw. A creature takes 3d8 bludgeoning damage on a failed save, or half as much damage on a successful one. The strong wind keep","damageType":"Bludgeoning","damageAtSlot":{"3":"3d8"},"saveAbility":"str","saveEffect":"half","areaType":"line","areaSize":50},{"index":"wish","name":"Wish","level":9,"school":"Conjuration","castingTime":"1 action","range":"Self","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"Wish is the mightiest spell a mortal creature can cast. By simply speaking aloud, you can alter the very foundations of reality in accord with your desires. The basic use of this spell is to duplicate any other spell of 8th level or lower. You don't need to meet any requirements in that spell, including costly components. The spell simply takes effect. Alternatively, you can create one of the following effects of your choice: - You create one object of up to 25,000 gp in value that isn't a magic"},{"index":"word-of-recall","name":"Word of Recall","level":6,"school":"Conjuration","castingTime":"1 action","range":"5 feet","duration":"Instantaneous","concentration":false,"ritual":false,"components":"V","desc":"You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect. You must designate a sanctuary by casting this spell within a location, such as a temple, dedicated to or strongly linked to your deity. If you","areaType":"sphere","areaSize":5},{"index":"zone-of-truth","name":"Zone of Truth","level":2,"school":"Enchantment","castingTime":"1 action","range":"60 feet","duration":"10 minutes","concentration":false,"ritual":false,"components":"VS","desc":"You create a magical zone that guards against deception in a 15-foot-radius sphere centered on a point of your choice within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there must make a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether each creature succeeds or fails on its saving throw. An affected creature is aware of the spell and can thus avoid answer","areaType":"sphere","areaSize":15}],"conditions":[{"index":"blinded","name":"Blinded","desc":"- A blinded creature can't see and automatically fails any ability check that requires sight. - Attack rolls against the creature have advantage, and the creature's attack rolls have disadvantage."},{"index":"charmed","name":"Charmed","desc":"- A charmed creature can't attack the charmer or target the charmer with harmful abilities or magical effects. - The charmer has advantage on any ability check to interact socially with the creature."},{"index":"deafened","name":"Deafened","desc":"- A deafened creature can't hear and automatically fails any ability check that requires hearing."},{"index":"frightened","name":"Frightened","desc":"- A frightened creature has disadvantage on ability checks and attack rolls while the source of its fear is within line of sight. - The creature can't willingly move closer to the source of its fear."},{"index":"grappled","name":"Grappled","desc":"- A grappled creature's speed becomes 0, and it can't benefit from any bonus to its speed. - The condition ends if the grappler is incapacitated (see the condition). - The condition also ends if an effect removes the grappled creature from the reach of the grappler or grappling effect, such as when a creature is hurled away by the thunderwave spell."},{"index":"incapacitated","name":"Incapacitated","desc":"- An incapacitated creature can't take actions or reactions."},{"index":"invisible","name":"Invisible","desc":"- An invisible creature is impossible to see without the aid of magic or a special sense. For the purpose of hiding, the creature is heavily obscured. The creature's location can be detected by any noise it makes or any tracks it leaves. - Attack rolls against the creature have disadvantage, and the creature's attack rolls have advantage."},{"index":"paralyzed","name":"Paralyzed","desc":"- A paralyzed creature is incapacitated (see the condition) and can't move or speak. - The creature automatically fails Strength and Dexterity saving throws. - Attack rolls against the creature have advantage. - Any attack that hits the creature is a critical hit if the attacker is within 5 feet of the creature."},{"index":"petrified","name":"Petrified","desc":"- A petrified creature is transformed, along with any nonmagical object it is wearing or carrying, into a solid inanimate substance (usually stone). Its weight increases by a factor of ten, and it ceases aging. - The creature is incapacitated (see the condition), can't move or speak, and is unaware of its surroundings. - Attack rolls against the creature have advantage. - The creature automatically fails Strength and Dexterity saving throws. - The creature has resistance to all damage. - The creature is immune to poison and disease, although a poison or disease already in its system is suspended, not neutralized."},{"index":"poisoned","name":"Poisoned","desc":"- A poisoned creature has disadvantage on attack rolls and ability checks."},{"index":"prone","name":"Prone","desc":"- A prone creature's only movement option is to crawl, unless it stands up and thereby ends the condition. - The creature has disadvantage on attack rolls. - An attack roll against the creature has advantage if the attacker is within 5 feet of the creature. Otherwise, the attack roll has disadvantage."},{"index":"restrained","name":"Restrained","desc":"- A restrained creature's speed becomes 0, and it can't benefit from any bonus to its speed. - Attack rolls against the creature have advantage, and the creature's attack rolls have disadvantage. - The creature has disadvantage on Dexterity saving throws."},{"index":"stunned","name":"Stunned","desc":"- A stunned creature is incapacitated (see the condition), can't move, and can speak only falteringly. - The creature automatically fails Strength and Dexterity saving throws. - Attack rolls against the creature have advantage."},{"index":"unconscious","name":"Unconscious","desc":"- An unconscious creature is incapacitated (see the condition), can't move or speak, and is unaware of its surroundings. - The creature drops whatever it's holding and falls prone. - The creature automatically fails Strength and Dexterity saving throws. - Attack rolls against the creature have advantage. - Any attack that hits the creature is a critical hit if the attacker is within 5 feet of the creature."},{"index":"exhaustion","name":"Exhaustion","desc":"Some special abilities and environmental hazards, such as starvation and the long-term effects of freezing or scorching temperatures, can lead to a special condition called exhaustion. Exhaustion is measured in six levels. An effect can give a creature one or more levels of exhaustion, as specified in the effect's description. 1 - Disadvantage on ability checks 2 - Speed halved 3 - Disadvantage on attack rolls and saving throws 4 - Hit point maximum halved 5 - Speed reduced to 0 6 - Death If an already exhausted creature suffers another effect that causes exhaustion, its current level of exhaustion increases by the amount specified in the effect's description. A creature suffers the effect of its current level of exhaustion as well as all lower levels. For example, a creature suffering level 2 exhaustion has its speed halved and has disadvantage on ability checks. An effect that removes exhaustion reduces its level as specified in the effect's description, with all exhaustion effects ending if a creature's exhaustion level is reduced below 1. Finishing a long rest reduces a creature's exhaustion level by 1, provided that the creature has also ingested some food and drink."}],"equipment":[{"index":"club","name":"Club","cost":"1 sp","weight":"2 lb","summary":"Weapon \u00b7 1d4 Bludgeoning \u00b7 Light, Monk"}, // ---------- storage helpers ----------
// Backed by the browser's own localStorage — this app runs as a plain local file in a normal
// browser, not inside a hosted sandbox with a window.storage API, so persistence has to be something
// every browser actually provides. Keys are namespaced under STORAGE_PREFIX since some browsers
// (Chrome in particular) pool all file:// pages into one shared storage bucket rather than one per
// file — the prefix keeps this app's keys from ever colliding with some unrelated local HTML file's.
// `shared` is kept only for call-site compatibility with the old API; nothing here ever uses it.
const STORAGE_PREFIX = 'dnd-tracker:';

async function safeGet(key, shared=false){
  try{ return localStorage.getItem(STORAGE_PREFIX + key); }
  catch(e){ return null; }
}
async function safeSet(key, value, shared=false){
  try{ localStorage.setItem(STORAGE_PREFIX + key, value); return true; }
  catch(e){ return false; } // e.g. quota exceeded, or storage disabled entirely (private browsing in some browsers)
}
async function safeDelete(key, shared=false){
  try{ localStorage.removeItem(STORAGE_PREFIX + key); return true; }
  catch(e){ return false; }
}
async function safeList(prefix, shared=false){
  try{
    const full = STORAGE_PREFIX + prefix;
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(full)===0) keys.push(k.slice(STORAGE_PREFIX.length));
    }
    return keys;
  } catch(e){ return []; }
}

// ---------- D&D 5e SRD data (embedded at build time — no runtime network dependency at all) ----------
let SRD_BUNDLE = null;

function loadSrdBundle(){
  try{
    const el = document.getElementById('srd-bundle');
    SRD_BUNDLE = JSON.parse(el.textContent);
  }catch(e){
    SRD_BUNDLE = { spells: [], conditions: [], equipment: [], classes: [], races: [], subclasses: [] };
  }
  state.srdConditions = SRD_BUNDLE.conditions;
  state.srdSpellIndex = SRD_BUNDLE.spells;       // full records: index,name,level,school,castingTime,range,duration,concentration,ritual,components,desc
  state.srdEquipmentIndex = SRD_BUNDLE.equipment; // full records: index,name,cost,weight,summary
  state.srdClasses = SRD_BUNDLE.classes || [];    // index,name,hitDie,savingThrows[],spellAbility
  state.srdRaces = SRD_BUNDLE.races || [];        // index,name,speed,size,abilityBonuses[],languages[],traits[]
  state.srdSubclasses = SRD_BUNDLE.subclasses || []; // index,name,classIndex
  try{
    const clsEl = document.getElementById('srd-spell-classes');
    state.spellClassMap = JSON.parse(clsEl.textContent); // { spellIndex: [classIndex,...] } — which classes can learn/prepare each spell
  }catch(e){
    state.spellClassMap = {};
  }
  state.srdLoading = false;
  render();
}

// Third-caster subclasses draw from the Wizard spell list per RAW, even though this tool otherwise
// treats subclass as a name-only free-text field (no other mechanical SRD data backs it). Matched by
// name text since that's all we store for subclass.
const THIRD_CASTER_SUBCLASS_LISTS = {
  'eldritch knight': 'wizard',
  'arcane trickster': 'wizard'
};
function classSpellListFor(ch){
  // Returns the SRD class index whose spell list should be used to filter the spell search for this
  // character, or null if we don't have list data for their class/subclass (custom class, non-caster
  // with no matching third-caster subclass, etc.) — callers should show everything when this is null.
  if(ch.classIndex && (state.srdClasses||[]).some(c=>c.index===ch.classIndex && c.spellAbility)) return ch.classIndex;
  const subclassName = (ch.subclass||'').toLowerCase();
  for(const key in THIRD_CASTER_SUBCLASS_LISTS){
    if(subclassName.includes(key)) return THIRD_CASTER_SUBCLASS_LISTS[key];
  }
  return null;
}

// Plain synchronous lookups, not async — the SRD bundle is fully in memory (see js/01's header),
// there's nothing here to actually await. Kept non-async so callers never cross a real suspension
// point over what's just an array lookup.
function getSpellDetail(index){
  return (state.srdSpellIndex||[]).find(s=>s.index===index) || null;
}

function getEquipmentDetail(index){
  return (state.srdEquipmentIndex||[]).find(s=>s.index===index) || null;
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

    initiativeMode: 'normal', // 'normal' | 'adv' | 'disadv'

    notes: ''

}

function blankCampaign(){

    campaignName: 'Untitled Campaign',

    initiativeMode: 'normal', // 'normal' | 'adv' | 'disadv'
    surprised: false,
    status: 'alive', // alive | dead | fled | other
    notes: ''

}

// A lightweight, non-adversarial roster entry — hirelings, animal companions, town contacts,
// anyone the party deals with who isn't a combat opponent. Deliberately much thinner than a full
// Character or Enemy sheet: no inventory, spells, or leveling, just enough to remember who's who
// and (optionally) track HP/AC for a companion that might actually take hits.
function blankNpc(name){
  return {
    id: uid('npc'),
    name: name || 'New NPC',
    role: '',          // freeform — e.g. "Blacksmith", "Hired guide", "Ranger's animal companion"
    disposition: 'friendly', // 'friendly' | 'neutral' | 'wary' | 'ally'
    hasCombatStats: false,   // toggles showing hp/ac — off by default, since most NPCs are just narrative
    hp: { current: 10, max: 10 },
    ac: 10,
    saveBonus: 0, // generic flat bonus for auto-rolled saving throws vs an enemy's save-based attack — NPCs don't track full ability scores, so this is one approximate number rather than six precise ones
    notes: ''
  };
}
function ensureNpcFields(npc){
  if(npc.role===undefined) npc.role = '';
  if(npc.disposition===undefined) npc.disposition = 'friendly';
  if(npc.hasCombatStats===undefined) npc.hasCombatStats = false;
  if(!npc.hp) npc.hp = { current:10, max:10 };
  if(npc.ac===undefined) npc.ac = 10;
  if(npc.saveBonus===undefined) npc.saveBonus = 0;
  if(npc.notes===undefined) npc.notes = '';
}

const WARLOCK_PACT_SLOTS = { // Pact Magic — all slots share a single level, unlike other casters
  1:{count:1,level:1}, 2:{count:2,level:1}, 3:{count:2,level:2}, 4:{count:2,level:2}, 5:{count:2,level:3},

};
const FULL_CASTERS = ['bard','cleric','druid','sorcerer','wizard'];
const HALF_CASTERS = ['paladin','ranger'];

// Ability Score Improvement levels per class — Fighter and Rogue get extra ones beyond the default set.
const ASI_LEVELS = {
  fighter: [4,6,8,12,14,16,19],
  rogue: [4,8,10,12,16,19],
  default: [4,8,12,16,19]
};
function getAsiLevels(classIndex){ return ASI_LEVELS[classIndex] || ASI_LEVELS.default; }

// Standard PHB Character Advancement table — total XP needed to REACH each level (index = level).
// Index 0 is unused so CHARACTER_XP_TABLE[level] reads naturally.
const CHARACTER_XP_TABLE = [
  null, 0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000,
  85000, 100000, 120000, 140000, 165000, 195000, 225000, 265000, 305000, 355000
];
// Highest level a given total XP qualifies for (capped at 20).
function levelForXp(xp){
  let lvl = 1;
  for(let l=2; l<=20; l++){ if((xp||0) >= CHARACTER_XP_TABLE[l]) lvl = l; else break; }
  return lvl;
}

function hitDieAverage(dieStr){
  const n = parseInt(String(dieStr||'d8').replace(/[^\d]/g,''),10) || 8;
  return Math.floor(n/2) + 1;
}
function computeLevelUpHpGain(ch){
  const conMod = abilityMod(ch.abilities.con);
  let gain = Math.max(1, hitDieAverage(ch.hitDice.die) + conMod);
  if((ch.feats||[]).some(f=>f.key==='tough')) gain += 2; // Tough: +2 max HP every level, on top of the normal roll
  return gain;
}
function applySpellSlotsForLevel(ch){
  // Auto-fills spell slot maxima (and tops current up to match, like a fresh long rest) from class +
  // level, for the classes whose progression this tool knows. Returns false and leaves slots untouched
  // for classes it doesn't recognize (non-casters, third-casters) — those stay manually editable.
  const classIndex = ch.classIndex;
  if(!classIndex) return false;
  const lvl = Math.max(1, Math.min(20, ch.level||1));
  if(classIndex==='warlock'){
    const w = WARLOCK_PACT_SLOTS[lvl];
    for(let sl=1; sl<=9; sl++){ ch.spellcasting.slots[sl] = {current:0,max:0}; }
    ch.spellcasting.slots[w.level] = { current: w.count, max: w.count };
    return true;
  }
  let table = null;
  if(FULL_CASTERS.includes(classIndex)) table = FULL_CASTER_SLOTS[lvl];
  else if(HALF_CASTERS.includes(classIndex)) table = HALF_CASTER_SLOTS[lvl];
  if(!table) return false;
  table.forEach((max,i)=>{ ch.spellcasting.slots[i+1] = { current: max, max }; });
  for(let sl=table.length+1; sl<=9; sl++){ ch.spellcasting.slots[sl] = {current:0,max:0}; }
  return true;
}

function featFlatBonus(entity, key){
  return (entity && entity.feats ? entity.feats : []).reduce((sum,f)=> sum + ((f.bonuses && f.bonuses[key]) || 0), 0);
}
// Checks for a specific built-in feat by its key (e.g. 'war-caster') — used for feats whose effect
// isn't a flat numeric bonus (those go through featFlatBonus/featAbilityBonus instead) but changes
// how a roll works, like War Caster granting advantage on concentration saves.
function hasFeat(entity, key){
  return (entity && entity.feats ? entity.feats : []).some(f=>f.key===key);
}
function featAbilityBonus(ch, key){
  return (ch.feats||[]).reduce((sum,f)=>{
    if(f.abilityChoice && f.abilityChoice.selected===key) return sum + (f.abilityChoice.amount||0);
    return sum;
  },0);
}
function ensureLevelingFields(ch){
  if(!ch.feats) ch.feats = [];
  if(!ch.asiBonuses) ch.asiBonuses = {str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(!ch.asiLevelsUsed) ch.asiLevelsUsed = [];
  if(ch.plainAsiPicks===undefined) ch.plainAsiPicks = 0; // guided-flow "just take +2/+1" picks — tracked separately from feats so the two can be added together for the ASI/feat budget without double-counting
}
// How many total ASI-or-feat choices this character has earned by their current level, and how
// many they've spent. "Earned" comes straight from the class's ASI level table; "spent" is feats
// actually on the sheet (however they were added) plus guided-flow "plain ASI" picks — the
// character-sheet's direct ASI-editor boxes (for building an already-leveled character from
// scratch) are a deliberate manual override and aren't counted here, same as point buy doesn't
// second-guess a hand-typed ability score.
function featSlotsEarned(ch){
  return getAsiLevels(ch.classIndex).filter(l=>l<=(ch.level||1)).length;
}
function featSlotsUsed(ch){
  return (ch.feats||[]).length + (ch.plainAsiPicks||0);
}
// Backfills fields added after initial release (skills, death saves, concentration, background/
// alignment/languages) so campaigns saved/exported before these existed still load cleanly.
function ensureCharacterExtras(ch){
  if(!ch.skillProfs){
    ch.skillProfs = {};
    SKILL_LIST.forEach(sk=>{ ch.skillProfs[sk.key] = false; });
  } else {
    SKILL_LIST.forEach(sk=>{ if(ch.skillProfs[sk.key]===undefined) ch.skillProfs[sk.key] = false; });
  }
  if(!ch.deathSaves) ch.deathSaves = { successes:0, failures:0 };
  if(ch.concentratingOn===undefined) ch.concentratingOn = '';
  if(ch.background===undefined) ch.background = '';
  if(ch.alignment===undefined) ch.alignment = '';
  if(ch.languages===undefined) ch.languages = '';
}
function skillModifier(ch, skillDef){
  ensureCharacterExtras(ch);
  const abilMod = abilityMod(ch.abilities[skillDef.ability]);
  return abilMod + (ch.skillProfs[skillDef.key] ? profBonus(ch.level) : 0);
}
function passiveScore(ch, skillDef){ return 10 + skillModifier(ch, skillDef); }

// Standard (non-variant) 5e carrying capacity — Strength score x 15 — used only as a visible
// reference against total carried weight. Deliberately informational only (no automatic speed
// penalty applied anywhere) to keep this optional-rule territory out of the DM's hands only if
// they want it there — casual tables can just ignore the bar entirely.
function carryCapacity(ch){ return Math.max(0, (ch.abilities.str||0) * 15); }
function totalCarriedWeight(ch){
  return (ch.inventory||[]).reduce((sum,it)=> sum + (Number(it.weight)||0) * (Number(it.qty)||1), 0);
}
function encumbranceStatus(ch){
  const cap = carryCapacity(ch); // max carrying capacity, Str score x 15
  const weight = totalCarriedWeight(ch);
  let label = 'Unencumbered', color = 'var(--moss)';
  if(cap>0 && weight > cap){ label = 'Over Max Capacity'; color = 'var(--ember)'; }
  else if(cap>0 && weight > cap*(2/3)){ label = 'Heavily Encumbered'; color = 'var(--ember)'; } // >10x Str
  else if(cap>0 && weight > cap/3){ label = 'Encumbered'; color = 'var(--brass)'; } // >5x Str
  return { cap, weight, label, color, pct: cap>0 ? Math.min(100,(weight/cap)*100) : 0 };
}
function addFeatToCharacter(ch, key, sourceLevel){
  ensureLevelingFields(ch);
  let def, custom=false;
  if(key==='__custom'){
    def = { name:'New Feat', desc:'' };
    custom = true;
  } else {
    def = FEATS.find(f=>f.key===key);
  }
  if(!def) return;
  const entry = {
    id: uid('feat'), key: custom?null:def.key, name: def.name, desc: def.desc||'',
    sourceLevel: sourceLevel || ch.level, custom,
    bonuses: def.bonuses ? {...def.bonuses} : null,
    abilityChoice: def.abilityChoice ? {
      options: def.abilityChoice.options, amount: def.abilityChoice.amount,
      grantsSaveProf: !!def.abilityChoice.grantsSaveProf,
      selected: def.abilityChoice.options.length===1 ? def.abilityChoice.options[0] : null
    } : null,
    grantsSpells: []
  };
  ch.feats.push(entry);
  if(entry.abilityChoice && entry.abilityChoice.selected && entry.abilityChoice.grantsSaveProf){
    ch.savingThrowProfs[entry.abilityChoice.selected] = true;
  }
  if(def.hpPerLevel){
    const bump = def.hpPerLevel * Math.max(1, ch.level||1);
    ch.hp.max += bump; ch.hp.current += bump;
    showToast(`${def.name}: +${bump} max HP applied`);
  } else if(!custom){
    showToast(`${def.name} added`);
  }
  return entry;
}

function rollD20Mode(mode){
  const r1 = 1+Math.floor(Math.random()*20);
  if(mode!=='adv' && mode!=='disadv') return { d20:r1, detail:`d20 ${r1}` };
  const r2 = 1+Math.floor(Math.random()*20);
  const chosen = mode==='adv' ? Math.max(r1,r2) : Math.min(r1,r2);
  return { d20:chosen, detail:`d20 ${r1}/${r2}→${chosen}` };
}

function rollDiceFormula(formula){
  // Parses simple "NdM+K" / "NdM-K" / "NdM" strings and rolls them.
  if(!formula) return 0;
  const m = String(formula).trim().match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if(!m) return Number(formula)||0;
  const n = Number(m[1]), sides = Number(m[2]), mod = m[3]?Number(m[3]):0;
  let total = mod;
  for(let i=0;i<n;i++) total += 1+Math.floor(Math.random()*sides);
  return Math.max(1,total);
}

// Sorted turn order for both the one-shot Battle Initiative display and for starting the
// persistent round/turn tracker — kept as a single source of truth so the two never disagree.
// Returns [{kind:'pc'|'enemy', ref, idx}], sorted by initiative desc, ties broken by DEX modifier.
function computeInitiativeOrder(c){
  const combatants = [
    ...c.characters.filter(ch=>['alive','unconscious'].includes(ch.status)).map(ch=>({ kind:'pc', ref:ch, idx:c.characters.indexOf(ch) })),
    ...c.enemies.filter(en=>en.status==='alive').map(en=>({ kind:'enemy', ref:en, idx:c.enemies.indexOf(en) }))
  ];
  return combatants.sort((a,b)=>{
    const ai = a.ref.initiative, bi = b.ref.initiative;
    if(ai==null && bi==null) return 0;
    if(ai==null) return 1;
    if(bi==null) return -1;
    if(bi!==ai) return bi-ai;
    return abilityMod(b.ref.abilities.dex) - abilityMod(a.ref.abilities.dex);
  });
}
// Looks up the live character/enemy object behind the current turn in an active combat.combat —
// by id rather than array index, so it stays correct even if characters/enemies get reordered.
// Returns null if there's no active combat, or if that combatant no longer exists (e.g. removed).
function currentCombatRef(camp){
  const combat = camp.combat;
  if(!combat || !combat.order || !combat.order.length) return null;
  const entry = combat.order[combat.turnIndex];
  if(!entry) return null;
  const ref = entry.kind==='pc'
    ? (camp.characters||[]).find(x=>x.id===entry.id)
    : (camp.enemies||[]).find(x=>x.id===entry.id);
  return ref ? { id:entry.id, kind:entry.kind, ref } : null;
}
// Resets legendary-action usage for every enemy that has any, at the start of a fresh round.
// A simplification of the RAW "recharges at the start of its own turn" for a casual table — close
// enough, and a manual Reset button on each enemy covers the rest.
function onNewCombatRound(camp){
  (camp.enemies||[]).forEach(en=>{ if((en.legendaryActionsMax||0) > 0) en.legendaryActionsUsed = 0; });
}
// Action/bonus action refresh at the start of THIS combatant's own turn (not tied to round
// boundaries — see advanceCombatTurn and start-combat, the only two places a turn actually begins).
function resetActionEconomy(ref){
  if(!ref) return;
  ref.actionUsed = false;
  ref.bonusActionUsed = false;
}
// Moves the turn pointer forward (dir=1) or back (dir=-1), rolling over into the next/previous
// round at the ends of the order. Skips past any combatant that's been removed since combat
// started (currentCombatRef returns null for them) and past any enemy that's since died or fled
// (a corpse doesn't get a turn) — bounded so it can't loop forever if the whole order has gone
// stale or the fight's already over. PCs are never skipped this way, even unconscious ones, since
// they still have death saves to roll on their turn.
function advanceCombatTurn(camp, dir){
  const combat = camp.combat;
  if(!combat || !combat.order.length) return;
  const n = combat.order.length;
  let guard = 0;
  let cur;
  do {
    combat.turnIndex += dir;
    if(combat.turnIndex >= n){ combat.turnIndex = 0; combat.round += 1; onNewCombatRound(camp); }
    if(combat.turnIndex < 0){ combat.turnIndex = n-1; combat.round = Math.max(1, combat.round-1); }
    guard++;
    cur = currentCombatRef(camp);
  } while((!cur || (cur.kind==='enemy' && cur.ref.status!=='alive')) && guard <= n+1);
  if(cur) resetActionEconomy(cur.ref);
}
// Only tracks action economy for whoever the combat tracker currently has "up" — an attack/cast
// made outside anyone's active turn (no combat running, or off-turn) doesn't touch these flags at
// all, since there's no turn for it to be accidentally-double-spent against.
function markTurnActionUsed(camp, entity, isBonusAction){
  const cur = currentCombatRef(camp);
  if(!cur || cur.ref !== entity) return;
  if(isBonusAction) entity.bonusActionUsed = true; else entity.actionUsed = true;
}

function enemyFromPreset(preset, label){
  const e = blankEnemy(label || preset.name);
  e.presetKey = preset.key;
  e.groupLabel = preset.name;
  e.role = preset.name;
  e.cr = preset.cr;
  e.xp = preset.xp;
  e.ac = preset.ac;
  e.speed = preset.speed;
  e.abilities = { ...preset.abilities };
  const rolled = rollDiceFormula(preset.hitDice);
  e.hp.max = rolled; e.hp.current = rolled;
  e.attacks = (preset.attacks||[]).map(a=>({ id: uid('atk'), name:a.name, toHit:a.toHit, damage:a.damage, damageType:a.damageType||'', notes:a.notes||'', recharge:null, rechargeAvailable:true }));
  e.traits = (preset.traits||[]).map(t=>({ id: uid('trait'), name:t.name, desc:t.desc||'' }));
  return e;
}

propriate, and applies damage — upcast damage is read from the SRD's own per-slot-level numbers when present), inventory:[{id,index (5e SRD equipment index or null if custom),name,qty,equipped:bool,tags (freeform: category/damage/AC/properties summary, cost included as text),weight (number, lb per single unit — qty multiplies it; auto-parsed from SRD data when picked, defaults to 0 for custom items until set, used only for the Encumbrance display),bonuses:{ac,speed,initiative,str,dex,con,int,wis,cha} (all numbers, default 0 — flat bonuses this item grants while equipped, e.g. a ring of protection is bonuses.ac:1; automatically summed into the character's effective AC/speed/abilities/initiative whenever equipped is true, ignored otherwise), atkAbility:'auto'|'str'|'dex' and atkProficient:bool and targetKind:'enemy'|null and targetId (only relevant while equipped and the tags contain a parseable 'NdM' weapon-damage pattern — the tracker's Attack button then rolls to-hit and damage against the chosen enemy; 'auto' resolves to a Finesse weapon's better of STR/DEX, DEX for true ranged weapons, STR otherwise), grantsSpells:[{id,index (SRD spell index or null if custom),name,level,school,usesCurrent,usesMax,resetsOn:'long rest'|'short rest'|'dawn'|'other',atWill:bool,targetKind:'enemy'|null,targetId}] (free castings the item itself grants regardless of the wearer's class/spell list, e.g. a Ring of Fireball with usesMax:1, resetsOn:'long rest' — only surfaced in the character's spell list while equipped is true; usesCurrent decrements on use and is restored to usesMax by the tracker's reset control; atWill:true means unlimited uses and usesCurrent/usesMax are ignored)}], gold, conditions:[{id,conditionIndex (one of the 15 SRD conditions e.g. 'poisoned','exhaustion', or 'custom'),name,duration (freeform, e.g. '3 rounds'),level (1-6, only used for exhaustion)}], status:'alive'|'unconscious'|'dead'|'ghost'|'other', statusNote, initiative (number or null — this fight's rolled initiative total), initiativeBonus (manual catch-all number for class features NOT tied to a feat or inventory item — feat bonuses like Alert's +5 are tracked per-feat instead and summed in automatically), initiativeMode ('normal'|'adv'|'disadv' — whether the initiative d20 is rolled with advantage/disadvantage, e.g. a Barbarian's Feral Instinct), surprised (bool — true if this combatant is caught unaware at the start of the current fight and so skips actions/reactions on their first turn), notes }\n" +

is round), legendaryActions:[{id,name,desc,cost (how many legendary actions it spends, default 1)}], lairAction (freeform reference note, not mechanically tracked — triggers on initiative count 20 per standard rules), conditions: same shape as Character.conditions, initiative (number or null), initiativeBonus (manual catch-all number for traits/magic items affecting initiative), initiativeMode ('normal'|'adv'|'disadv'), surprised (bool — true if caught unaware at the start of the fight), status:'alive'|'dead'|'fled'|'other', notes }\n" +

// A lighter, enemy-only schema for the "Quick Add from JSON" flow — deliberately smaller than the
// full Enemy shape documented in SCHEMA_DOC above, since asking an AI DM chat for a fast batch of
// mid-session mooks shouldn't require re-explaining legendary actions, recharge mechanics, etc.
// every field here maps directly onto blankEnemy(); anything omitted just falls back to the default.
const ENEMY_IMPORT_SCHEMA_DOC = "Return ONLY a JSON array (no prose, no markdown code fences, no commentary) of enemy objects matching this shape — every field is optional except name, missing fields fall back to sensible defaults:\n" +
"[{ name (string), groupLabel (string, e.g. 'Cultists' — shared tag for a batch), role (string, e.g. 'Leader'), cr (string, e.g. '1/4' or '2'), xp (number), ac (number), hp (either a plain number for max=current, or {current,max}), speed (number, feet), abilities:{str,dex,con,int,wis,cha} (numbers, default 10 each), saveBonus (number, default 0), attacks:[{name,toHit (number),damage (dice string e.g. '1d6+2'),damageType,notes,recharge (number 1-6 or omit for at-will)}], traits:[{name,desc}], legendaryActionsMax (number, omit or 0 for none), legendaryActions:[{name,desc,cost}], lairAction (string), notes (string) }]\n" +
"Keep stat blocks roughly balanced for the requested challenge/CR using normal 5e monster-building guidelines. Match the tone/theme requested.";

// Builds a full tracker Enemy from one loosely-shaped object out of that JSON array (or hand-written
// JSON in the same shape) — fills every field blankEnemy() expects, then runs it through the same
// ensureCombatFields() normalization real enemies get, so nothing downstream (attack rolls, legendary
// action UI, etc.) has to special-case an imported enemy.
function enemyFromImportObject(obj, indexInBatch){
  obj = obj && typeof obj==='object' ? obj : {};
  const en = blankEnemy(obj.name ? String(obj.name) : `Imported Enemy ${indexInBatch+1}`);
  if(obj.groupLabel!=null) en.groupLabel = String(obj.groupLabel);
  if(obj.role!=null) en.role = String(obj.role);
  if(obj.cr!=null) en.cr = String(obj.cr);
  if(obj.xp!=null) en.xp = Number(obj.xp)||0;
  if(obj.ac!=null) en.ac = Number(obj.ac)||10;
  if(obj.speed!=null) en.speed = Number(obj.speed)||30;
  if(obj.hp!=null){
    if(typeof obj.hp==='number'){
      const max = Math.max(1, Math.round(obj.hp)||1);
      en.hp = { current: max, max };
    } else if(typeof obj.hp==='object'){
      const max = Math.max(1, Math.round(Number(obj.hp.max ?? obj.hp.current ?? 10))||10);
      const current = obj.hp.current!=null ? Math.max(0, Math.min(max, Math.round(Number(obj.hp.current))||0)) : max;
      en.hp = { current, max };
    }
  }
  if(obj.abilities && typeof obj.abilities==='object'){
    ABILITY_KEYS.forEach(k=>{ if(obj.abilities[k]!=null) en.abilities[k] = Number(obj.abilities[k]) || 10; });
  }
  if(obj.saveBonus!=null) en.saveBonus = Number(obj.saveBonus)||0;
  if(Array.isArray(obj.attacks)){
    en.attacks = obj.attacks.map(a=>{
      a = a && typeof a==='object' ? a : {};
      const rechargeNum = a.recharge!=null && a.recharge!=='' ? Math.max(1, Math.min(6, Math.round(Number(a.recharge))||6)) : null;
      return { id: uid('atk'), name: a.name?String(a.name):'', toHit: Number(a.toHit)||0, damage: a.damage?String(a.damage):'', damageType: a.damageType?String(a.damageType):'', notes: a.notes?String(a.notes):'', recharge: rechargeNum, rechargeAvailable: true };
    });
  }
  if(Array.isArray(obj.traits)){
    en.traits = obj.traits.map(t=>{ t = t && typeof t==='object' ? t : {}; return { id: uid('trait'), name: t.name?String(t.name):'', desc: t.desc?String(t.desc):'' }; });
  }
  if(obj.legendaryActionsMax!=null) en.legendaryActionsMax = Math.max(0, Number(obj.legendaryActionsMax)||0);
  if(Array.isArray(obj.legendaryActions)){
    en.legendaryActions = obj.legendaryActions.map(la=>{ la = la && typeof la==='object' ? la : {}; return { id: uid('leg'), name: la.name?String(la.name):'', desc: la.desc?String(la.desc):'', cost: Math.max(1, Number(la.cost)||1) }; });
  }
  if(obj.lairAction!=null) en.lairAction = String(obj.lairAction);
  if(obj.notes!=null) en.notes = String(obj.notes);
  ensureCombatFields(en);
  return en;
}

function spellStatLine(meta){
  if(!meta) return '';
  const parts = [];
  if(meta.range) parts.push(meta.range);
  if(meta.concentration) parts.push('Concentration');
  if(meta.ritual) parts.push('Ritual');
  if(meta.damageAtSlot){
    const lvls = Object.keys(meta.damageAtSlot).map(Number).sort((a,b)=>a-b);
    const base = lvls[0];
    parts.push(`${meta.damageAtSlot[base]}${meta.damageType?' '+meta.damageType.toLowerCase():''} dmg`);
  } else if(meta.damageAtLevel){
    const lvls = Object.keys(meta.damageAtLevel).map(Number).sort((a,b)=>a-b);
    const base = lvls[0];
    parts.push(`${meta.damageAtLevel[base]}${meta.damageType?' '+meta.damageType.toLowerCase():''} dmg${lvls.length>1?' (scales w/ char. level)':''}`);
  }
  if(meta.saveAbility){
    const eff = meta.saveEffect && meta.saveEffect!=='none' ? ` (${meta.saveEffect} dmg on success)` : '';
    parts.push(`${meta.saveAbility.toUpperCase()} save${eff}`);
  }
  if(meta.areaType && meta.areaSize) parts.push(`${meta.areaSize}-ft ${meta.areaType}`);
  return parts.join(' · ');
}
function abilityMod(score){ return Math.floor((score-10)/2); }

// Renders the target/slot-level/Cast row shown under a spell on the character sheet — shared by a
// character's own known spells (which spend their own spell slots, chosen via castAtLevel — pick a
// level higher than the spell's own to upcast, per standard 5e rules) and item/feat-granted spells
// (which spend their own usesCurrent charge instead and are always cast at their own fixed level).
// bindBase is the dot-path to the spell object itself (e.g. "characters.0.spells.2" or
// "characters.0.inventory.1.grantsSpells.0"); clickAttrs are the extra data-* attributes the
// cast-spell click handler needs to find that same object again.
function renderCastControls(ch, idx, sp, meta, source, bindBase, clickAttrs, aliveEnemies){
  const hasAttack = !!(meta && (meta.saveAbility || meta.damageAtSlot || meta.damageAtLevel));
  const isCantrip = (sp.level||0) === 0;
  const knownLeveled = source==='known' && !isCantrip;

  let canCast = true;
  if(source==='known'){
    if(!isCantrip){ const slot = ch.spellcasting.slots[sp.castAtLevel] || {current:0,max:0}; canCast = slot.current > 0; }
  } else {
    canCast = sp.atWill || (sp.usesCurrent||0) > 0;
  }

  let slotSelect = '';
  if(knownLeveled){
    const availableLevels = [];
    for(let lv=sp.level; lv<=9; lv++){ const s=ch.spellcasting.slots[lv]; if(s && s.max>0) availableLevels.push(lv); }
    slotSelect = availableLevels.length ? `
      <select data-bind="${bindBase}.castAtLevel" data-type="number" style="width:135px;" title="Which slot to spend — pick higher than the spell's own level to upcast">
        ${availableLevels.map(lv=>{ const s=ch.spellcasting.slots[lv]; return `<option value="${lv}" ${Number(sp.castAtLevel)===lv?'selected':''}>Lvl ${lv} slot (${s.current}/${s.max})</option>`; }).join('')}
      </select>` : `<span class="hint" style="margin:0;">No level ${sp.level}+ slots available</span>`;
  }

  if(!hasAttack){
    // No structured damage or save to auto-resolve (a buff/utility spell). Still worth a "spend the
    // slot" button for a character's own leveled spells so tracking stays accurate; granted spells
    // already have their own −1/reset uses control shown alongside them, and cantrips with nothing

  }

// A single item can grant a flat bonus to any of these while equipped. This is the one place
// that list of attributes lives — add a key here and it flows through everywhere automatically.
const BONUS_FIELD_DEFS = [
  {key:'ac', label:'AC'},
  {key:'speed', label:'Speed'},
  {key:'initiative', label:'Init.'},
  {key:'str', label:'STR'}, {key:'dex', label:'DEX'}, {key:'con', label:'CON'},
  {key:'int', label:'INT'}, {key:'wis', label:'WIS'}, {key:'cha', label:'CHA'}
];
function blankItemBonuses(){
  const b = {};
  BONUS_FIELD_DEFS.forEach(f=>{ b[f.key] = 0; });
  return b;
}
function ensureItemBonuses(it){
  if(!it.bonuses){
    it.bonuses = blankItemBonuses();
    if(it.initiativeBonus){ it.bonuses.initiative = it.initiativeBonus; } // migrate the old per-item field
  } else {
    BONUS_FIELD_DEFS.forEach(f=>{ if(it.bonuses[f.key]===undefined) it.bonuses[f.key] = 0; });
  }
  delete it.initiativeBonus;
}
function summarizeItemBonuses(bonuses){
  if(!bonuses) return '';
  const parts = [];
  BONUS_FIELD_DEFS.forEach(f=>{
    const v = bonuses[f.key]||0;
    if(!v) return;
    if(f.key==='speed') parts.push(`${fmtMod(v)} ft speed`);
    else if(f.key==='ac') parts.push(`${fmtMod(v)} AC`);
    else if(f.key==='initiative') parts.push(`${fmtMod(v)} initiative`);
    else parts.push(`${fmtMod(v)} ${f.label}`);

  return parts.join(', ');
}
function equippedItemAttrBonus(ch, key){

}
// Numeric weight in lb per single unit of the item (qty multiplies it), used only for the
// Encumbrance display. Backfilled to 0 for items saved before this field existed, and for custom

function ensureItemWeight(it){
  if(it.weight===undefined || it.weight===null || it.weight==='') it.weight = 0;
}

// Items AND feats can both grant their own free castings of a spell — an item like a Ring of
// Fireball (1 charge/long rest), or a feat like Magic Initiate (2 at-will cantrips + one 1st-level
// spell recharging on a long rest). These live on the item/feat itself, independent of the
// character's normal class spell list (classSpellListFor/state.spellClassMap only governs the
// "Spells known" search above). Item grants only count while the item is equipped; feat grants are
// always active once the feat is taken. Each granted spell is either limited-use (usesCurrent/
// usesMax, recharging on the listed cadence) or, if atWill is true, unlimited — usesCurrent/usesMax
// are ignored in that case.
const RESET_CADENCES = ['long rest','short rest','dawn','other'];
function ensureItemGrantsSpells(it){
  if(!Array.isArray(it.grantsSpells)) it.grantsSpells = [];
}
function ensureFeatGrantsSpells(ft){
  if(!Array.isArray(ft.grantsSpells)) ft.grantsSpells = [];
}
function equippedGrantedSpells(ch){
  // Flattened list of {sourceType:'item',sourceId,sourceName,spell:{...}} for every granted spell on
  // an equipped item, used to surface these alongside the character's normal spells known.
  const out = [];
  (ch.inventory||[]).forEach(it=>{
    ensureItemGrantsSpells(it);

  });

}

    ensureFeatGrantsSpells(ft);
    ft.grantsSpells.forEach(gs=> out.push({ sourceType:'feat', sourceId: ft.id, sourceName: ft.name, spell: gs }));
  });

}
function allGrantedSpells(ch){ return equippedGrantedSpells(ch).concat(featGrantedSpells(ch)); }
// Same flattened list as allGrantedSpells, but keeps each entry's concrete array indices (as a

function allGrantedSpellsWithPaths(ch){
  const out = [];
  (ch.inventory||[]).forEach((it,ii)=>{
    ensureItemGrantsSpells(it);
    if(!it.equipped) return;
    (it.grantsSpells||[]).forEach((gs,gi)=>{
      out.push({ sourceType:'item', sourceId: it.id, sourceName: it.name, spell: gs, path: `inventory.${ii}.grantsSpells.${gi}` });
    });
  });
  (ch.feats||[]).forEach((ft,fi)=>{
    ensureFeatGrantsSpells(ft);
    (ft.grantsSpells||[]).forEach((gs,gi)=>{
      out.push({ sourceType:'feat', sourceId: ft.id, sourceName: ft.name, spell: gs, path: `feats.${fi}.grantsSpells.${gi}` });
    });

}
function resetAllGrantedSpellUses(ch){
  (ch.inventory||[]).forEach(it=>{
    ensureItemGrantsSpells(it);
    it.grantsSpells.forEach(gs=>{ if(!gs.atWill) gs.usesCurrent = gs.usesMax; });
  });
  (ch.feats||[]).forEach(ft=>{
    ensureFeatGrantsSpells(ft);
    ft.grantsSpells.forEach(gs=>{ if(!gs.atWill) gs.usesCurrent = gs.usesMax; });
  });
}
// Cadence-aware version used by the rest buttons — only refreshes granted-spell uses matching the
// given cadence ('long rest' or 'short rest'), leaving 'dawn'/'other' ones alone since those follow
// their own schedule. The manual "reset all" button on the character sheet still uses the
// unconditional version above for a full manual override.
function resetGrantedSpellUsesByCadence(ch, cadence){
  (ch.inventory||[]).forEach(it=>{
    ensureItemGrantsSpells(it);
    it.grantsSpells.forEach(gs=>{ if(!gs.atWill && gs.resetsOn===cadence) gs.usesCurrent = gs.usesMax; });
  });
  (ch.feats||[]).forEach(ft=>{
    ensureFeatGrantsSpells(ft);
    ft.grantsSpells.forEach(gs=>{ if(!gs.atWill && gs.resetsOn===cadence) gs.usesCurrent = gs.usesMax; });
  });

// Tops up every currently-tracked spell slot level back to its max — used by rest actions. Doesn't
// recompute max from class+level (that's applySpellSlotsForLevel's job); this just refills what's
// already there, which also works fine for classes/subclasses this tool doesn't auto-track.
function resetSpellSlotsCurrent(ch){
  Object.keys(ch.spellcasting.slots||{}).forEach(lvl=>{
    const slot = ch.spellcasting.slots[lvl];
    if(slot && slot.max) slot.current = slot.max;
  });
}
// A long rest: full HP, half your hit dice back (min 1), every spell slot topped up, long-rest
// granted-spell uses refreshed, one level of exhaustion shaken off, and — since full HP means
// they're conscious again — death saves cleared and "unconscious" flips back to "alive".
function longRestCharacter(ch){
  ch.hp.current = ch.hp.max;
  const halfDice = Math.max(1, Math.floor((ch.hitDice.total||1)/2));
  ch.hitDice.current = Math.min(ch.hitDice.total, (ch.hitDice.current||0) + halfDice);
  resetSpellSlotsCurrent(ch);
  resetGrantedSpellUsesByCadence(ch, 'long rest');
  ensureCharacterExtras(ch);
  ch.deathSaves = { successes:0, failures:0 };
  const exhaustion = (ch.conditions||[]).find(c=>c.conditionIndex==='exhaustion');
  if(exhaustion){
    exhaustion.level = Math.max(0, (exhaustion.level||1) - 1);

function equippedItemInitiativeBonus(ch){ return equippedItemAttrBonus(ch, 'initiative'); }
function effectiveAC(ch){ return ch.ac + equippedItemAttrBonus(ch,'ac') + featFlatBonus(ch,'ac'); }
// Applies rolled damage to whoever an attack was aimed at — temp HP absorbs first, then current
// HP, clamped at 0. For a PC target, also clears death saves if the result leaves them above 0
// (mirrors the same reset used everywhere else HP goes up); PCs go unconscious at 0, not dead, per
// standard rules, so status isn't touched here for them. For an enemy target, dropping to 0 HP
// while still marked 'alive' flips it to 'dead' automatically — this is what actually removes them
// from every target dropdown (they're all filtered to status==='alive') and from the combat turn
// order on the next Next/Prev press, so a defeated enemy can't keep absorbing attacks or hold up
// initiative. Returns {died} so the caller can show a "slain" toast instead of a routine damage one.
function applyDamageToTarget(target, kind, amount){
  if(!target || amount<=0) return { died:false };
  let remaining = amount;
  if(target.hp.temp && target.hp.temp>0){
    const absorbed = Math.min(target.hp.temp, remaining);
    target.hp.temp -= absorbed;
    remaining -= absorbed;
  }
  target.hp.current = Math.max(0, target.hp.current - remaining);
  if(kind==='pc' && target.hp.current>0){
    ensureCharacterExtras(target);
    target.deathSaves = { successes:0, failures:0 };
  }
  let died = false;
  if(kind==='enemy' && target.hp.current<=0 && target.status==='alive'){

function effectiveSpeed(ch){ return ch.speed + equippedItemAttrBonus(ch,'speed') + featFlatBonus(ch,'speed'); }

const ABILITY_KEYS = ['str','dex','con','int','wis','cha'];

// Standard PHB "choose N skills" count granted by class at 1st level. Deliberately NOT the whole
// picture — background always adds 2 more fixed skills, and a few races/subclasses add others —
// neither of which this tracker models mechanically (background is freeform text; race traits are
// reference-only). So this powers a soft, informational count on the Skills card, not a hard cap
// like the feat/ASI budget below: being "over" is expected and normal once background is factored
// in, not a mistake to block.
const CLASS_SKILL_COUNT = {
  barbarian:2, bard:3, cleric:2, druid:2, fighter:2, monk:2,
  paladin:2, ranger:3, rogue:4, sorcerer:2, warlock:2, wizard:2
};
function classSkillBudget(ch){
  const base = CLASS_SKILL_COUNT[ch.classIndex] ?? 2;
  const skilledBonus = (ch.feats||[]).filter(f=>f.key==='skilled').length * 3;
  return base + skilledBonus;
}

function pointBuySpent(baseAbilities){
  return ABILITY_KEYS.reduce((sum,k)=> sum + (POINT_BUY_COST[baseAbilities[k]] ?? 0), 0);
}
function ensureAbilityBonusChoice(ch){
  if(!ch.abilityBonusChoice) ch.abilityBonusChoice = { plus2: null, plus1: null };
}
function bonusFromChoice(ch, key){
  ensureAbilityBonusChoice(ch);

  if(plus1 === key && plus1 !== plus2) b += 1;

function ensureBaseAbilities(ch){

    const featBonus = featAbilityBonus(ch, k);

function syncAllAbilities(){

function timeAgo(ts){
  if(!ts) return 'never';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<10) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); if(h<24) return h+'h ago';
  const d = Math.floor(h/24); return d+'d ago';
}
function fmtDate(ts){
  const d = new Date(ts);

}

function showToast(msg){

function getPath(obj, path){

function setPath(obj, path, value){

// they draw on their own usesCurrent/usesMax charge instead of the character's spell slots.
function ensureSpellCastFields(sp){
  if(sp.targetKind===undefined) sp.targetKind = null; // 'enemy' | null

// Persists per-weapon-item attack state — which ability it rolls with ('auto' resolves finesse/

// (assumed true — a casual table's PCs are almost always using gear they're built around), and
// which enemy it's currently aimed at.
function ensureItemAtkFields(it){
  if(it.atkAbility===undefined) it.atkAbility = 'auto'; // 'auto' | 'str' | 'dex'
  if(it.atkProficient===undefined) it.atkProficient = true;

// Best-effort read of a rollable weapon attack out of an inventory item's freeform tags string —
// works for SRD-picked weapons (tags auto-filled as "Weapon · 1d8 Slashing · Versatile, Monk · ...")
// and for any custom/homebrew item as long as the player typed something with an "NdM" dice pattern
// in it somewhere. Returns null (no Attack button shown) if no dice pattern is found at all, so
// non-weapon gear (a torch, a rope) never gets mistaken for something you can swing.
function parseWeaponFromTags(tags){
  if(!tags) return null;
  const diceMatch = tags.match(/(\d+d\d+(?:\s*[+-]\s*\d+)?)/i);
  if(!diceMatch) return null;
  const typeMatch = tags.match(/\d+d\d+(?:\s*[+-]\s*\d+)?\s+(\w+)/i);
  const lower = tags.toLowerCase();
  return {
    damage: diceMatch[1].replace(/\s+/g,''),
    damageType: typeMatch ? typeMatch[1] : '',
    isFinesse: /finesse/.test(lower),

  if(parsed.isFinesse) return abilityMod(ch.abilities.dex) > abilityMod(ch.abilities.str) ? 'dex' : 'str';
  if(parsed.isRanged) return 'dex';
  return 'str';

// The to-hit/damage/target row shown under an equipped weapon — shared between the character's

function renderWeaponAttackRow(ch, idx, it, i, aliveEnemies){

      <input type="checkbox" data-bind="${base}.inventory.${i}.atkProficient" data-type="checkbox" ${it.atkProficient?'checked':''} style="width:auto;"> proficient
    </label>
    <label class="hint" style="display:inline-flex;align-items:center;gap:4px;margin:0;">Target
      <select data-bind="${base}.inventory.${i}.__target" data-type="target" style="min-width:150px;">${targetOptions}</select>
    </label>
    <button class="step-btn" data-action="roll-weapon-attack" data-idx="${idx}" data-item="${i}" title="Rolls to hit and, on a hit, damage — applies it automatically if a target is picked">🎲 Attack</button>
  </div>`;
}
// A spell attack's to-hit bonus and save DC both use the same proficiency-bonus + spellcasting-
// ability-modifier math — 'none' means the character has no spellcasting ability set yet.
function spellAttackBonus(ch){
  if(ch.spellcasting.ability==='none') return null;
  return profBonus(ch.level) + abilityMod(ch.abilities[ch.spellcasting.ability]);
}
function spellSaveDC(ch){
  if(ch.spellcasting.ability==='none') return null;
  return 8 + profBonus(ch.level) + abilityMod(ch.abilities[ch.spellcasting.ability]);
}
// Reads the correct damage dice for the level a spell is actually being cast at — upcast-aware for
// leveled spells (damageAtSlot is keyed by slot level, already precomputed in the SRD bundle for
// every valid upcast, e.g. fireball's 8d6 at 3rd climbing to 14d6 at 9th), and character-level-aware
// for cantrips (damageAtLevel scales with the caster's level, not a slot). Returns null if the spell
// has no structured damage at all (buffs, utility spells) — those still cost a slot to cast, but
// there's nothing to roll.
function spellDamageForCast(meta, castLevel, chLevel){
  if(!meta) return null;
  if(meta.damageAtSlot){
    const lvls = Object.keys(meta.damageAtSlot).map(Number).sort((a,b)=>a-b);
    let use = lvls[0];
    lvls.forEach(lv=>{ if(lv<=castLevel) use = lv; });
    return meta.damageAtSlot[use];
  }
  if(meta.damageAtLevel){
    const lvls = Object.keys(meta.damageAtLevel).map(Number).sort((a,b)=>a-b);
    let use = lvls[0];
    lvls.forEach(lv=>{ if(lv<=chLevel) use = lv; });
    return meta.damageAtLevel[use];
  }
  return null;
}
function ensureCombatFields(entity){
  if(entity.initiative===undefined) entity.initiative = null;
  if(entity.initiativeBonus===undefined) entity.initiativeBonus = 0;
  if(entity.initiativeMode===undefined) entity.initiativeMode = 'normal';
  if(entity.surprised===undefined) entity.surprised = false;
  if(entity.actionUsed===undefined) entity.actionUsed = false;
  if(entity.bonusActionUsed===undefined) entity.bonusActionUsed = false;
  if(entity.inventory){
    entity.inventory.forEach(ensureItemBonuses);
    entity.inventory.forEach(ensureItemGrantsSpells);
    entity.inventory.forEach(ensureItemWeight);
    entity.inventory.forEach(ensureItemAtkFields); // characters only — weapon-attack target/ability/proficiency fields
  }
  if(entity.baseAbilities){
    ensureLevelingFields(entity); // characters only — enemies have no leveling fields
    ensureCharacterExtras(entity); // skills, death saves, concentration, background/alignment/languages
    (entity.spells||[]).forEach(ensureSpellCastFields); // cast-target/slot fields on known spells
    allGrantedSpells(entity).forEach(({spell})=>ensureSpellCastFields(spell)); // ...and on item/feat-granted spells
  }
  if(entity.attacks){
    entity.attacks.forEach(ensureAttackFields);
    ensureLegendaryFields(entity); // enemies only — characters have no attacks array
    if(entity.xpAwarded===undefined) entity.xpAwarded = false;
    if(entity.saveBonus===undefined) entity.saveBonus = 0;
  }
}
function normalizeCampaign(camp){
  if(!camp.enemies) camp.enemies = [];
  if(camp.combat===undefined) camp.combat = null;
  if(!camp.partyInventory) camp.partyInventory = [];
  if(!camp.npcs) camp.npcs = [];
  if(!camp.sessions) camp.sessions = [];
  camp.partyInventory.forEach(ensureItemWeight);
  camp.npcs.forEach(ensureNpcFields);
  (camp.characters||[]).forEach(ensureCombatFields);
  (camp.enemies||[]).forEach(ensureCombatFields);
  return camp;
}

// ---------- persistence ----------
async function loadInitial(){
  const raw = await safeGet('campaign:current');
  if(raw){
    try{ state.campaign = normalizeCampaign(JSON.parse(raw)); } catch(e){ state.campaign = blankCampaign(); }
  }
  const idxRaw = await safeGet('campaign:snapshot-index');
  if(idxRaw){
    try{ state.snapshotIndex = JSON.parse(idxRaw); } catch(e){ state.snapshotIndex = []; }
  }
  const logRaw = await safeGet('campaign:dice-log');
  if(logRaw){
    try{ state.diceLog = JSON.parse(logRaw); } catch(e){ state.diceLog = []; }
  }
  render();
}

async function persistCurrent(){
  const ok = await safeSet('campaign:current', JSON.stringify(state.campaign));
  state.storageOk = ok;
  return ok;
}

async function saveSnapshot(label){
  state.campaign.updatedAt = Date.now();
  const ok1 = await persistCurrent();
  const id = uid('snap');
  const entry = { id, timestamp: Date.now(), label: label || ('Session '+state.campaign.sessionNumber) };
  const ok2 = await safeSet('campaign:snap:'+id, JSON.stringify({ ...entry, state: state.campaign }));
  state.snapshotIndex.unshift(entry);
  const ok3 = await safeSet('campaign:snapshot-index', JSON.stringify(state.snapshotIndex));
  state.lastSavedAt = Date.now();
  showToast(ok1&&ok2&&ok3 ? 'Snapshot saved' : 'Saved locally (storage error)');
  render();
}

async function loadSnapshot(id){
  const raw = await safeGet('campaign:snap:'+id);
  if(!raw){ showToast('Could not load that snapshot'); return; }
  try{
    const parsed = JSON.parse(raw);
    // safety snapshot of what we're leaving, so nothing is lost
    await saveSnapshotSilent('(auto) before revert');
    state.campaign = normalizeCampaign(parsed.state);
    await persistCurrent();
    showToast('Loaded: ' + parsed.label);
    render();
  }catch(e){ showToast('That snapshot looks corrupted'); }
}

async function saveSnapshotSilent(label){
  const id = uid('snap');
  const entry = { id, timestamp: Date.now(), label };
  await safeSet('campaign:snap:'+id, JSON.stringify({ ...entry, state: state.campaign }));
  state.snapshotIndex.unshift(entry);
  await safeSet('campaign:snapshot-index', JSON.stringify(state.snapshotIndex));
}

async function renameSnapshot(id, newLabel){
  const entry = state.snapshotIndex.find(s=>s.id===id);
  if(!entry) return;
  entry.label = newLabel;
  await safeSet('campaign:snapshot-index', JSON.stringify(state.snapshotIndex));
  const raw = await safeGet('campaign:snap:'+id);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      parsed.label = newLabel;
      await safeSet('campaign:snap:'+id, JSON.stringify(parsed));
    }catch(e){}
  }
}

async function deleteSnapshot(id){
  await safeDelete('campaign:snap:'+id);
  state.snapshotIndex = state.snapshotIndex.filter(s=>s.id!==id);
  await safeSet('campaign:snapshot-index', JSON.stringify(state.snapshotIndex));
  render();
}

async function persistDiceLog(){
  state.diceLog = state.diceLog.slice(0,30);
  await safeSet('campaign:dice-log', JSON.stringify(state.diceLog));
}

// ---------- autosave ----------
// Historically, render() alone never touched storage — only explicit actions (Save Snapshot, import,
// loading a snapshot) called persistCurrent(). That meant ordinary play — HP changes, attacks, XP,
// leveling, loot — was never actually saved unless someone remembered to tap "Save Snapshot," so a
// closed or reloaded tab could lose a whole session. This debounces a save to campaign:current a
// moment after the last change, and flushes immediately if the tab is hidden or closed — which
// covers the common case of tabbing over to a separate AI-DM chat mid-session.
let autosaveTimer = null;
let autosavePending = false;
function scheduleAutosave(){
  autosavePending = true;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, 1500);
}
async function runAutosave(){
  clearTimeout(autosaveTimer);
  if(!autosavePending) return;
  autosavePending = false;
  const ok = await persistCurrent();
  state.lastSavedAt = Date.now();
  state.storageOk = ok;
  updateSavedIndicator();
}
// Updates just the "last saved" text directly, without a full render() — a full render() replaces
// the whole #app innerHTML, which would blur whatever field the person is mid-typing in.
function updateSavedIndicator(){
  const el = document.querySelector('.saved-indicator');
  if(el) el.textContent = `last saved ${timeAgo(state.lastSavedAt)}${state.storageOk?'':' — storage unavailable'}`;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) runAutosave(); });
window.addEventListener('pagehide', runAutosave);
setInterval(updateSavedIndicator, 15000); // keeps "last saved Xm ago" fresh even between edits

// ---------- destructive-action confirm ----------
// window.confirm() is blocked in this sandboxed artifact iframe, so these use a click-to-arm pattern
// instead: the first click flips the button into a "click again to confirm" state, and only a second
// click within a few seconds actually performs the action. Clicking anything else, or letting the
// window lapse, cancels the pending confirm.
const CONFIRM_ACTIONS = new Set(['remove-char','remove-enemy','delete-snap']);
const CONFIRM_WINDOW_MS = 4000;
function armKeyFor(action, key){ return action + ':' + key; }
function isArmed(action, key){
  return !!(state.armedAction && state.armedAction.key===armKeyFor(action,key) && (Date.now()-state.armedAction.armedAt)<CONFIRM_WINDOW_MS);
}

// Only shown once a character is actually down (0 HP, not dead/ghost) — stays out of the way
// otherwise. Clicking a pip sets the count to that position, or back down by one if it's already
// there, so mistakes are easy to correct without needing a separate undo.
function renderDeathSaves(ch, idx, base){
  ensureCharacterExtras(ch);
  if(ch.hp.current > 0 || ch.status==='dead' || ch.status==='ghost') return '';
  const ds = ch.deathSaves;
  const stabilized = ds.successes>=3;
  const pip = (filled, action, i)=>`<span data-action="${action}" data-idx="${idx}" data-pos="${i}" style="cursor:pointer;font-size:22px;line-height:1;margin-right:4px;color:${filled?'inherit':'var(--line)'};">●</span>`;
  const succPips = [0,1,2].map(i=>pip(i<ds.successes,'toggle-death-success',i)).join('');
  const failPips = [0,1,2].map(i=>pip(i<ds.failures,'toggle-death-failure',i)).join('');
  return `<div class="card" style="border-color:var(--ember);">
    <h3 style="color:var(--ember);">💀 Death Saving Throws</h3>
    <div class="row" style="align-items:center;">
      <div class="col"><label>Successes</label><div style="color:var(--moss);">${succPips}</div></div>
      <div class="col"><label>Failures</label><div style="color:var(--ember);">${failPips}</div></div>
      <div class="col" style="flex:none;">
        <button class="btn primary" data-action="roll-death-save" data-idx="${idx}" ${stabilized?'disabled':''} style="margin-top:16px;">🎲 Roll Death Save</button>
      </div>
    </div>
    ${stabilized ? `<div class="hint" style="color:var(--moss);margin-top:6px;">Stable at 0 HP — no further death saves needed unless they take damage again.</div>` : ''}
    <div class="hint" style="margin-top:6px;">At 0 HP, roll a plain d20 (no modifiers): 10+ is a success, below 10 a failure. A natural 1 counts as two failures; a natural 20 brings them back to 1 HP immediately and ends this. Three successes stabilizes them; three failures and they die. Any HP regained resets this automatically.</div>
  </div>`;
}

// A freeform text field (with autocomplete from the character's own known spells, but not

function renderConcentrationBlock(ch, idx, base){

  const options = (ch.spells||[]).map(sp=>`<option value="${escapeAttr(sp.name)}">`).join('');

  return `<div class="field" style="background:var(--panel-2);border:1px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:10px;">
